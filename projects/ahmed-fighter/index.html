  ctx.fillStyle = 'rgba(255,255,255,.08)';
  roundRect(px + 12, py + ph - 8, pw - 24, 3, 1.5); ctx.fill();
  if(xf > 0){
    ctx.fillStyle = UI.gold;
    roundRect(px + 12, py + ph - 8, Math.max(3, (pw - 24) * xf), 3, 1.5); ctx.fill();
  }

  // Armed: the swings left matter more than the name, so they get the size.
  if(p.weapon){
    var WD = ASSET_WEAPONS[p.weapon.key];
    var wx = 16, wy = 148;
    ctx.fillStyle = 'rgba(8,10,16,.62)';
    roundRect(wx, wy, 214, 44, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(237,190,87,.45)'; ctx.lineWidth = 2;
    roundRect(wx, wy, 214, 44, 10); ctx.stroke();
    ctx.save(); ctx.translate(wx + 32, wy + 22); ctx.scale(0.78, 0.78);
    weaponInHand(0, 0, -0.42, p.weapon.key);
    ctx.restore();
    txt(WD.n, wx + 62, wy + 16, UI.t.label + 1, UI.fg, 'left', 900);
    var left = p.weapon.uses;
    txt(left + (left === 1 ? ' SWING LEFT' : ' SWINGS LEFT'), wx + 62, wy + 33, UI.t.label,
        left <= 2 ? C.bad : UI.fgMut, 'left', 700);
  }

  // stage progress
  var st = F.st;
  ctx.fillStyle = 'rgba(8,10,16,.55)';
  roundRect(W/2-200, 12, 400, 62, 12); ctx.fill();
  txt(st.name, W/2, 30, 20, C.gold, 'center', 900);
  txt(st.ar, W/2, 51, 16, 'rgba(255,255,255,.8)', 'center', 700);
  if(st.survival){
    txt('WAVE ' + F.survWave + '   ·   BEST ' + save.survBest, W/2, 66, 15, C.hp, 'center', 800);
  } else {
    var pw = 300, px = W/2 - pw/2;
    bar(px, 64, pw, 7, clamp(p.x/st.len, 0, 1), 1, C.sand);
  }

  // enemies / boss
  var boss = null, alive = 0;
  for(var i=0;i<F.enemies.length;i++){
    var e = F.enemies[i];
    if(e.dead) continue;
    alive++;
    if(e.kind === 'boss' || e.kind === 'saqr') boss = e;
  }
  if(boss){
    ctx.fillStyle = 'rgba(8,10,16,.62)';
    roundRect(W-406, 14, 390, 62, 12); ctx.fill();
    txt(boss.name, W-26, 34, 19, C.bad, 'right', 900);
    txt(boss.ar, W-330, 34, 17, C.gold, 'left', 700);
    bar(W-396, 50, 370, 16, boss.hp, boss.maxHp, C.bad);
  } else if(alive > 0){
    ctx.fillStyle = 'rgba(8,10,16,.62)';
    roundRect(W-190, 14, 174, 50, 12); ctx.fill();
    txt('ENEMIES', W-176, 30, 13, C.dim, 'left', 800);
    txt(String(alive), W-30, 40, 30, C.bad, 'right', 900);
  }

  // combo
  if(p.combo > 1){
    var a = clamp(p.comboT/1.7, 0, 1);
    var pulse = 1 + Math.sin(gameTime*18)*0.05;
    txt(p.combo + ' HIT', 130, 168, 44*pulse, C.gold, 'center', 900, a);
    txt('COMBO', 130, 198, 16, C.white, 'center', 800, a*0.8);
  }

  // objective banner
  if(F.lockX !== null){
    ctx.globalAlpha = 0.55 + Math.sin(gameTime*5)*0.2;
    ctx.fillStyle = 'rgba(6,8,14,.9)';
    roundRect(W/2-190, 174, 380, 44, 10); ctx.fill();
    ctx.globalAlpha = 1;
    txt('DEFEAT ALL — اهزم الجميع', W/2, 196, 23, '#ff8f8c', 'center', 900,
        0.75 + Math.sin(gameTime*5)*0.25);
  } else if(!F.st.survival && F.waveIdx >= F.waves.length){
    var ax = W - 200 + Math.sin(gameTime*6)*14;
    txt('GO →', ax, 150, 40, C.gold, 'center', 900, 0.6 + Math.sin(gameTime*6)*0.4);
    txt('تقدّم', ax, 184, 18, C.white, 'center', 800, 0.7);
  } else {
    txt('→', W-120 + Math.sin(gameTime*4)*10, 150, 40, 'rgba(255,255,255,.5)', 'center', 900);
  }

  // first-stage coaching
  if(F.idx === 0){
    var tip = null;
    if(p.rage >= 100)                       tip = ['RAGE is full — hit RAGE for the finisher', 'الغضب جاهز'];
    else if(p.hp < p.maxHp * 0.6)           tip = ['Hold BLOCK to guard · tap it while moving to dodge', 'اضغط صد للحماية'];
    else if(F.lockX !== null)               tip = ['Tap PUNCH three times fast for the combo', 'اضغط لكمة ثلاث مرات'];
    else if(F.waveIdx === 0 && F.time < 14) tip = ['Drag anywhere on the left half to move', 'اسحب من اليسار للحركة'];
    else if(F.props.length && F.time < 26)  tip = ['Smash crates for food and rage orbs', 'حطّم الصناديق'];
    if(tip){
      ctx.fillStyle = 'rgba(6,8,14,.72)';
      roundRect(W/2-300, H-92, 600, 52, 10); ctx.fill();
      txt(tip[0], W/2, H-74, 17, C.sand, 'center', 700);
      txt(tip[1], W/2, H-54, 15, C.gold, 'center', 700);
    }
  }

  // pause button
  ctx.fillStyle = 'rgba(8,10,16,.6)';
  roundRect(W-68, 84, 52, 44, 10); ctx.fill();
  ctx.fillStyle = C.white;
  ctx.fillRect(W-53, 94, 7, 25); ctx.fillRect(W-39, 94, 7, 25);
  uiBtns.push({ x:W-74, y:78, w:64, h:56, fn:function(){ G.paused = true; } });

  // intro card
  if(G.intro > 0){
    var k = clamp(G.intro/2.2, 0, 1);
    var al = G.intro > 1.6 ? (2.2-G.intro)/0.6 : Math.min(1, G.intro/0.6);
    ctx.globalAlpha = clamp(al, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(0, H/2-90, W, 180);
    txt(F.st.name, W/2, H/2-24, 54, C.gold, 'center', 900);
    txt(F.st.ar, W/2, H/2+22, 30, C.white, 'center', 700);
    txt(F.st.hint, W/2, H/2+62, 17, C.dim, 'center', 700);
    ctx.globalAlpha = 1;
  }
}

function drawTouch(){
  ctx.save();
  // joystick
  if(In.joy.active){
    ctx.globalAlpha = 0.30;
    ctx.strokeStyle = C.sand; ctx.lineWidth = 4;
    circle(In.joy.ox, In.joy.oy, 78); ctx.stroke();
    var dx = In.joy.x - In.joy.ox, dy = In.joy.y - In.joy.oy;
    var d = Math.sqrt(dx*dx + dy*dy) || 1, m = Math.min(d, 78);
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = C.gold;
    circle(In.joy.ox + dx/d*m, In.joy.oy + dy/d*m, 30); ctx.fill();
  } else {
    ctx.globalAlpha = 0.13;
    ctx.strokeStyle = C.sand; ctx.lineWidth = 3;
    circle(190, H-150, 78); ctx.stroke();
    ctx.globalAlpha = 0.22;
    txt('MOVE', 190, H-150, 16, C.sand, 'center', 800);
  }
  // action buttons
  for(var k in BTN){
    var b = BTN[k];
    var held = In.hold[b.key] > 0;
    var lock = (k === 'special' && G.fight && G.fight.player.rage < 100);
    ctx.globalAlpha = held ? 0.85 : (lock ? 0.20 : 0.42);
    ctx.fillStyle = b.col;
    circle(b.x, b.y, b.r); ctx.fill();
    ctx.globalAlpha = held ? 1 : 0.65;
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3;
    circle(b.x, b.y, b.r); ctx.stroke();
    ctx.globalAlpha = 1;
    txt(b.label, b.x, b.y - 8, b.r > 46 ? 16 : 14, '#fff', 'center', 900, held?1:0.9);
    txt(b.ar,    b.x, b.y + 12, b.r > 46 ? 15 : 13, '#fff', 'center', 700, held?1:0.75);
  }
  ctx.restore();
}

function drawFight(){
  var F = G.fight;
  ctx.save();
  if(shake > 0.4) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  applyCam();

  drawStageBg(F.st.theme, F.camX);

  // Every way out of the area, drawn where it stands. Gold means you can
  // pass; grey with the talent's name means come back later.
  if(!F.st.survival) drawWays(F);
  if(F.sealT > 0){
    var sa = clamp(F.sealT / 0.5, 0, 1);
    ctx.globalAlpha = sa;
    ctx.fillStyle = 'rgba(8,10,16,.88)';
    roundRect(W/2-230, H-238, 460, 60, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(198,206,220,.6)'; ctx.lineWidth = 2;
    roundRect(W/2-230, H-238, 460, 60, 12); ctx.stroke();
    txtLS(F.sealMsg, W/2, H-215, UI.t.body, UI.fg, 'center', 900, 2, sa);
    txt(F.sealAr, W/2, H-193, UI.t.label, UI.fgMut, 'center', 700, sa);
    ctx.globalAlpha = 1;
  }
  // wave barrier
  if(F.lockX !== null){
    var bx = F.lockX + W - 245 - F.camX;
    ctx.globalAlpha = 0.16 + Math.sin(gameTime*3)*0.06;
    ctx.fillStyle = C.bad;
    ctx.fillRect(bx, 0, 80, H);
    ctx.globalAlpha = 1;
  }

  var draws = [];
  function pushFighter(f){
    draws.push({ z:f.z, run:function(){
      if(f.dead && f.downT < -0.6) ctx.globalAlpha = clamp(1 + (f.downT+0.6)/0.8, 0, 1);
      drawFighter(f, F.camX);
      ctx.globalAlpha = 1;
    }});
  }
  pushFighter(F.player);
  for(var i=0;i<F.enemies.length;i++) pushFighter(F.enemies[i]);
  for(i=0;i<F.props.length;i++){
    var pr = F.props[i];
    if(pr.broken) continue;
    (function(q){ draws.push({ z:q.z, run:function(){ drawProp(q, F.camX); } }); })(pr);
  }
  for(i=0;i<F.items.length;i++){
    (function(q){ draws.push({ z:q.z, run:function(){ drawItem(q, F.camX); } }); })(F.items[i]);
  }
  for(i=0;i<F.gates.length;i++){
    (function(q){ draws.push({ z:GATE_Z - 0.01, run:function(){ drawGate(q, F.camX); } }); })(F.gates[i]);
  }
  draws.sort(function(a,b){ return a.z - b.z; });
  for(i=0;i<draws.length;i++) draws[i].run();

  drawFx(F.camX);
  (THEME[F.st.theme] || THEME.souq).fore(F.camX);
  ctx.restore();

  // The scene is finished. Everything from here is lens and film, in the
  // order a camera would apply it.
  postProcess();

  // low health: the edges pulse red. After the grade, because it is a warning
  // the player must read, not a colour the stage gets a vote on.
  var hpR = F.player.hp / F.player.maxHp;
  if(hpR < 0.3 && !F.player.dead){
    var lg = ctx.createRadialGradient(W/2, H/2, H*0.30, W/2, H/2, H*0.85);
    lg.addColorStop(0, 'rgba(200,16,46,0)');
    lg.addColorStop(1, 'rgba(200,16,46,' + (0.22 + Math.sin(gameTime*7)*0.14).toFixed(3) + ')');
    ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  }

  if(flashScreen > 0){
    ctx.globalAlpha = clamp(flashScreen, 0, 1) * 0.5;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  drawHUD();
  drawTouch();
}

/* ==========================================================================
   UI SCREENS
   ========================================================================== */

var uiBtns = [];
/* ==========================================================================
   UI DESIGN SYSTEM
   The screens grew one control at a time, and it showed: BACK was 170x58 on
   the map, 220x48 in settings, 140x64 on the briefing and 210x66 on the
   results screen -- the same button, four sizes, four positions. Everything
   below exists so that cannot happen again. Sizes come from `UI.btn`,
   positions from `UI.navY`, type from `UI.t`, colour from a role rather than
   a hex. Nothing in a screen should invent its own number.

   The look follows the key art: a dark cinematic ground, gold reserved for
   values and headings, Kuwait red for the one action that matters on a
   screen, and the flag hoist bar as the recurring mark.
   ========================================================================== */
var UI = {
  // 8pt spacing scale. Positions and gaps come from here.
  sp:  [0, 4, 8, 12, 16, 24, 32, 48, 64, 96],
  // One size per role. A screen picks a role, never a number.
  t:   { display:112, screen:56, title:40, head:26, sub:19, body:16, label:13, micro:11 },
  // Colour by role, so intent is visible at the call site.
  ink0:'#05070b', ink1:'#0b101a', ink2:'#151b28', ink3:'#1e2534',
  fg:'#f4f1e8', fgMut:'rgba(244,241,232,.62)', fgFaint:'rgba(244,241,232,.32)',
  gold:'#edbe57', red:'#c8102e', green:'#007a3d',
  line:'rgba(237,190,87,.20)', lineSoft:'rgba(255,255,255,.07)',
  // Fixed metrics: the same control is the same size on every screen.
  btn: { lg:{w:300,h:76}, md:{w:190,h:58}, sm:{w:150,h:46} },
  pad: 96,
  headY: 78,
  navY:  0            // set from H below
};
UI.navY = H - 104;

/* Text with letter-spacing. Uppercase labels need it or they read as a blur
   at small sizes; ctx.letterSpacing is ignored on engines that lack it, which
   degrades to exactly what we had before. */
function txtLS(s, x, y, size, color, align, weight, ls, alpha){
  ctx.save();
  ctx.letterSpacing = (ls || 0) + 'px';
  txt(s, x, y, size, color, align, weight, alpha);
  ctx.restore();
}

/* The Kuwait hoist bar -- black, green, white, red. The mark from the key
   art, reused at every size as the thing that says which game this is. */
function flagBar(x, y, h, w){
  var cols = ['#101216', '#007a3d', '#f3f5f8', UI.red];
  var bh = h / 4;
  for(var i = 0; i < 4; i++){
    ctx.fillStyle = cols[i];
    ctx.fillRect(x, y + i * bh, w || 6, bh);
  }
}

/* One panel treatment. `flag` puts the hoist bar down the left edge, which is
   how a panel says "this is the important one" without shouting in red. */
function panel(x, y, w, h, o){
  o = o || {};
  ctx.fillStyle = o.raised ? UI.ink3 : UI.ink2;
  roundRect(x, y, w, h, o.r === undefined ? 14 : o.r); ctx.fill();
  ctx.strokeStyle = o.accent ? UI.line : UI.lineSoft;
  ctx.lineWidth = 1.5;
  roundRect(x, y, w, h, o.r === undefined ? 14 : o.r); ctx.stroke();
  if(o.flag){
    ctx.save();
    roundRect(x, y, w, h, o.r === undefined ? 14 : o.r); ctx.clip();
    flagBar(x, y, h, 6);
    ctx.restore();
  }
}

/* Every screen opens the same way: the mark, the name, the Arabic under it. */
function screenHead(en, ar){
  var y = UI.headY;
  flagBar(UI.pad - 26, y - 26, 52, 6);
  txtLS(en, UI.pad, y - 8, UI.t.title, UI.gold, 'left', 900, 2.5);
  if(ar) txt(ar, UI.pad, y + 24, UI.t.sub, UI.fgMut, 'left', 700);
}

/* The nav row. Buttons are md, evenly spaced, and always land on UI.navY --
   so BACK is in the same place on every screen in the game. */
function navRow(items){
  var m = UI.btn.md, gap = UI.sp[5];
  var total = items.length * m.w + (items.length - 1) * gap;
  var x = (W - total) / 2;
  for(var i = 0; i < items.length; i++){
    var it = items[i];
    uiButton(x + i * (m.w + gap), UI.navY, m.w, m.h, it[0], it[1], it[2], it[3]);
  }
}

/* A label/value pair, the shape most of the stat readouts in this game want. */
function statLine(x, y, label, value, col, align){
  txtLS(label, x, y, UI.t.micro, UI.fgFaint, align || 'right', 800, 1.6);
  txtLS(value, x, y + 20, UI.t.sub, col || UI.gold, align || 'right', 900, 0.5);
}

function uiButton(x, y, w, h, label, sub, fn, style){
  uiBtns.push({ x:x, y:y, w:w, h:h, fn:fn });
  var primary = style === 'primary', danger = style === 'danger', off = style === 'off';
  var r = 12;
  // Only one control on a screen is red. Everything else is a dark panel with
  // a hairline, so the eye lands on the action without hunting for it.
  ctx.fillStyle = off ? 'rgba(14,18,26,.72)'
                : primary ? UI.red
                : danger ? 'rgba(74,18,26,.9)' : UI.ink2;
  roundRect(x, y, w, h, r); ctx.fill();
  if(primary){
    var pg = ctx.createLinearGradient(0, y, 0, y + h);      // a little depth
    pg.addColorStop(0, 'rgba(255,255,255,.16)');
    pg.addColorStop(1, 'rgba(0,0,0,.18)');
    ctx.fillStyle = pg; roundRect(x, y, w, h, r); ctx.fill();
  }
  ctx.strokeStyle = primary ? 'rgba(255,224,160,.85)'
                  : off ? 'rgba(255,255,255,.06)' : UI.line;
  ctx.lineWidth = 1.5;
  roundRect(x, y, w, h, r); ctx.stroke();

  var base = primary ? UI.t.head - 2 : UI.t.sub + 1;
  var fit = Math.min(base, (w - UI.sp[5]) / (label.length * 0.66));
  txtLS(label, x + w/2, y + (sub ? h/2 - 10 : h/2), Math.max(11, fit),
        off ? UI.fgFaint : UI.fg, 'center', 900, 1.8);
  if(sub) txt(sub, x + w/2, y + h/2 + 15, UI.t.body - 1,
              off ? UI.fgFaint : primary ? 'rgba(255,236,206,.92)' : UI.gold, 'center', 700);
}
/* A setting you flip. Both pause and settings had hand-rolled these at two
   different sizes; the metric comes from UI.btn now. */
function toggleBtn(x, y, w, label, sub, fn, on){
  uiButton(x, y, w, UI.btn.sm.h, label, sub, fn, on ? null : 'off');
}
/* The settings screen's toggles carry an Arabic sub-label, so they use the
   taller md height — still one metric rather than four typed numbers. */
function toggleBtnS(x, y, w, label, sub, fn, on){
  uiButton(x, y, w, UI.btn.md.h, label, sub, fn, on ? null : 'off');
}
function flushUI(){
  if(!In.uiTap){ uiBtns = []; return; }
  var t = In.uiTap; In.uiTap = null;
  if(t.enter && uiBtns.length){ Sfx.ui(); uiBtns[0].fn(); uiBtns = []; return; }
  for(var i=uiBtns.length-1;i>=0;i--){
    var b = uiBtns[i];
    if(t.x >= b.x && t.x <= b.x+b.w && t.y >= b.y && t.y <= b.y+b.h){
      Sfx.init(); Sfx.resume(); Sfx.ui(); b.fn(); break;
    }
  }
  uiBtns = [];
}

function screenBg(tint){
  // The key art's ground, so the store page and the menu look like one thing:
  // a warm pool off-centre, falling away to near-black at the corners.
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, tint || UI.ink2);
  g.addColorStop(1, UI.ink0);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  var warm = ctx.createRadialGradient(W*0.68, H*0.42, 0, W*0.68, H*0.42, W*0.62);
  warm.addColorStop(0, 'rgba(232,184,73,.10)');
  warm.addColorStop(0.45, 'rgba(200,16,46,.05)');
  warm.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = warm; ctx.fillRect(0, 0, W, H);

  // Sadu weaving, the Kuwaiti motif -- but as two crisp bands aligned to the
  // header and nav rows rather than ten faint lines floating mid-screen.
  saduBand(0, UI.headY + 62, W, 0.5);
  saduBand(0, UI.navY - 30, W, 0.5);

  var vg = ctx.createRadialGradient(W/2, H/2, H*0.30, W/2, H/2, H*0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

/* A woven sadu band: the running triangle pattern, in flag colours. */
function saduBand(x, y, w, alpha){
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 0.6 : alpha;
  ctx.fillStyle = UI.line;
  ctx.fillRect(x, y, w, 1);
  ctx.fillRect(x, y + 13, w, 1);
  var cols = [UI.red, '#007a3d', UI.gold];
  for(var i = 0; i * 22 < w; i++){
    ctx.fillStyle = cols[i % 3];
    ctx.globalAlpha = (alpha === undefined ? 0.6 : alpha) * 0.55;
    ctx.beginPath();
    ctx.moveTo(x + i * 22, y + 12);
    ctx.lineTo(x + i * 22 + 11, y + 2);
    ctx.lineTo(x + i * 22 + 22, y + 12);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

var demo = null;
function drawDemoAhmed(dt){
  if(!demo){
    demo = makePlayer();
    demo.x = 726; demo.z = 0.86; demo.facing = -1;
    demo.cycle = 0.9;
  }
  demo.anim += dt;
  if(demo.state === 'attack') advanceAttack(demo, dt, []);
  else {
    demo.cycle -= dt;
    if(demo.cycle <= 0){
      demo.cycle = rand(1.0, 1.9);
      startAttack(demo, pick(['jab','cross','hook','kick','knee']));
    }
  }
  demo.vx *= 0.9;
  drawFighter(demo, 0);
}

/* --------------------------------------------------------------------- map */
function drawMap(){
  screenBg('#131b2a');
  screenHead('THE WORLD', 'الخريطة');
  statLine(W - UI.pad, UI.headY - 12, 'CAREER XP', String(save.xp), UI.gold);

  // talents carried
  txtLS('CARRYING', UI.pad, 138, UI.t.micro, UI.fgFaint, 'left', 800, 2);
  var order = ['vault','dashleap','powerkick','haymaker','hawk'];
  for(var ai=0; ai<order.length; ai++){
    var A = ABILITIES[order[ai]], got = hasAbility(order[ai]);
    var ax = UI.pad + 84 + ai*46, ay = 122;
    ctx.fillStyle = got ? 'rgba(237,190,87,.20)' : 'rgba(255,255,255,.05)';
    roundRect(ax, ay, 38, 38, 8); ctx.fill();
    ctx.strokeStyle = got ? UI.gold : 'rgba(255,255,255,.10)';
    ctx.lineWidth = 2; roundRect(ax, ay, 38, 38, 8); ctx.stroke();
    txt(got ? A.icon : '·', ax+19, ay+19, got ? 21 : 18, got ? UI.gold : UI.fgFaint, 'center', 900);
  }

  var D = diff();
  uiButton(W - UI.pad - 246, 40, 246, 54, D.n, 'الصعوبة · ' + D.ar, function(){
    save.diff = (save.diff + 1) % 3; writeSave();
  });
  ctx.fillStyle = D.col;
  roundRect(W - UI.pad - 234, 48, 8, 38, 4); ctx.fill();

  var L = ASSET_WORLD.layout, AR = ASSET_WORLD.areas;

  // --- routes ---------------------------------------------------------------
  // Drawn once per pair. A route you can walk is solid gold; one you cannot is
  // dashed and grey and says what it wants, which is the whole map's job.
  for(var a = 0; a < AR.length; a++){
    var sides = ['w','e','d'];
    for(var si = 0; si < sides.length; si++){
      var link = AR[a][sides[si]];
      if(!link || link.to < a) continue;               // draw each pair once
      var A1 = L[a], A2 = L[link.to];
      var seen = visited(a) || visited(link.to);
      var open = linkOpen(link);
      ctx.save();
      ctx.lineWidth = open ? 5 : 3;
      ctx.strokeStyle = !seen ? 'rgba(255,255,255,.07)'
                      : open ? 'rgba(237,190,87,.55)' : 'rgba(150,158,172,.42)';
      if(!open) ctx.setLineDash([9, 8]);
      ctx.beginPath(); ctx.moveTo(A1.x, A1.y); ctx.lineTo(A2.x, A2.y); ctx.stroke();
      ctx.restore();
      if(seen && !open && link.needs){
        var mx = (A1.x + A2.x)/2, my = (A1.y + A2.y)/2;
        var tal = ABILITIES[link.needs];
        ctx.fillStyle = 'rgba(10,13,20,.92)';
        roundRect(mx-15, my-15, 30, 30, 8); ctx.fill();
        ctx.strokeStyle = 'rgba(150,158,172,.5)'; ctx.lineWidth = 1.5;
        roundRect(mx-15, my-15, 30, 30, 8); ctx.stroke();
        txt(tal ? tal.icon : '?', mx, my, 16, 'rgba(198,206,220,.85)', 'center', 900);
      }
    }
  }

  // --- areas ----------------------------------------------------------------
  for(var i = 0; i < L.length; i++){
    var st = STAGES[i], px = L[i].x, py = L[i].y;
    var seenIt = visited(i), done = areaCleared(i), here = save.at === i;
    var rank = save.ranks[i];

    if(here){
      ctx.strokeStyle = 'rgba(237,190,87,' + (0.35 + Math.sin(gameTime*3)*0.22) + ')';
      ctx.lineWidth = 3; circle(px, py, 50); ctx.stroke();
    }
    ctx.fillStyle = !seenIt ? 'rgba(24,28,38,.92)'
                  : done ? 'rgba(0,122,61,.85)' : 'rgba(200,16,46,.9)';
    circle(px, py, 38); ctx.fill();
    ctx.strokeStyle = seenIt ? UI.gold : 'rgba(255,255,255,.14)';
    ctx.lineWidth = 3; circle(px, py, 38); ctx.stroke();
    txt(seenIt ? String(i+1) : '?', px, py, seenIt ? 30 : 24,
        seenIt ? UI.fg : UI.fgFaint, 'center', 900);

    txtLS(seenIt ? L[i].n : '— — —', px, py + 56, UI.t.micro,
          seenIt ? UI.fg : UI.fgFaint, 'center', 800, 1.6);
    if(seenIt) txt(st.ar, px, py + 74, UI.t.label - 1, UI.fgMut, 'center', 700);
    if(rank) txtLS(rank, px + 30, py - 30, UI.t.label, rankColor(rank), 'center', 900, 0);

    // a sealed route inside this area, once you can open it
    var gs = st.gates || [];
    for(var gi = 0; gi < gs.length; gi++){
      if(gateOpen(i, gs[gi].at) || !seenIt) continue;
      var spec = GATES[gs[gi].type];
      var can = !spec.need || hasAbility(spec.need);
      if(!can) continue;
      ctx.fillStyle = 'rgba(237,190,87,.92)';
      circle(px - 30, py - 30, 14); ctx.fill();
      txt('!', px - 30, py - 29, 19, '#1a1408', 'center', 900);
    }

    if(seenIt){
      (function(n){
        uiBtns.push({ x:px-42, y:py-42, w:84, h:84, fn:function(){ openBrief(n); } });
      })(i);
    }
  }

  txtLS('WALK BETWEEN AREAS · TAP A VISITED ONE TO TRAVEL', W/2, UI.navY - 108,
        UI.t.micro, UI.fgFaint, 'center', 800, 2);

  var survIdx = STAGES.length - 1;
  var survOpen = areaCleared(ASSET_WORLD.layout.length - 1);
  if(survOpen){
    uiButton(W/2-190, UI.navY - 76, 380, 58, 'SURVIVAL  ·  BEST WAVE ' + save.survBest,
             'البقاء — موجات لا تنتهي', function(){ openBrief(survIdx); }, 'primary');
  } else {
    uiButton(W/2-190, UI.navY - 76, 380, 58, 'SURVIVAL LOCKED', 'اهزم الوحش لفتحه',
             function(){ Sfx.hurt(); }, 'off');
  }

  navRow([['MENU', 'القائمة', function(){ G.state = 'menu'; }],
          ['TRAIN', 'تدريب', function(){ G.state = 'upgrade'; }]]);
}

    txt(lines[i], UI.pad + UI.sp[5], 332 + i*34, UI.t.sub, C.sand, 'left', 600, a);
  }
  txt(st.storyAr || '', UI.pad + UI.sp[5], 412, UI.t.body + 1, UI.fgMut, 'left', 700,
      clamp((G.endT - 0.6) * 3, 0, 1));

  // what is waiting
  var seen = {};
  var order = [];
  for(var w=0;w<st.waves.length;w++)
    for(var e=0;e<st.waves[w].e.length;e++){
      var k = st.waves[w].e[e][0];
      if(!seen[k]){ seen[k] = 1; order.push(k); }
    }
  txtLS('EXPECT', UI.pad, 478, UI.t.micro, UI.fgFaint, 'left', 800, 2);
  for(i=0;i<order.length && i<6;i++){
    var T = TYPES[order[i]], bx = UI.pad + i*168;
    panel(bx, 494, 156, 46, { r:8 });
    ctx.fillStyle = T.col.band;                    // the archetype's own colour
    roundRect(bx, 494, 5, 46, 3); ctx.fill();
    txt(T.name, bx+16, 510, UI.t.label + 1, UI.fg, 'left', 800);
    txt(T.ar, bx+16, 528, UI.t.label, UI.gold, 'left', 700);
  }

  // sealed route
  var bg = (st.gates || [])[0];
  if(bg && !gateOpen(briefIdx, bg.at)){
    var spec = GATES[bg.type];
    var can = !spec.need || hasAbility(spec.need);
    // The fifth hand-rolled panel on this screen; the component knows how to
    // say "this one matters" via `accent`.
    panel(W - UI.pad - 340, 452, 340, 88, { r:10, accent:can, raised:can });
    ctx.fillStyle = can ? UI.gold : 'rgba(255,255,255,.16)';
    roundRect(W - UI.pad - 340, 452, 5, 88, 3); ctx.fill();
    txtLS('SEALED ROUTE', W - UI.pad - 318, 474, UI.t.micro,
          can ? UI.gold : UI.fgFaint, 'left', 900, 2);
    txt(spec.n + ' · ' + spec.ar, W - UI.pad - 318, 498, UI.t.body, UI.fg, 'left', 700);
    txt(can ? 'You carry the key — go open it.' : spec.how,
        W - UI.pad - 318, 522, UI.t.label + 1, can ? C.hp : C.bad, 'left', 600);
  }

  var rank = save.ranks[briefIdx];
  if(rank){
    txt('BEST RANK', W-100, 478, 14, C.dim, 'center', 800);
    txt(rank, W-100, 516, 40, rankColor(rank), 'center', 900);
  }

  navRow([['FIGHT', 'ابدأ',  function(){ startStage(briefIdx); }, 'primary'],
          ['TRAIN', 'تدريب', function(){ G.state = 'upgrade'; }],
          ['BACK',  'رجوع',  function(){ G.state = 'map'; }]]);
}

/* ------------------------------------------------------------------ settings */
function drawSettings(){
  screenBg('#121a24');
  screenHead('SETTINGS', 'الإعدادات');

  var D = diff();
  uiButton(W/2-304, 132, 608, 62, 'DIFFICULTY:  ' + D.n, 'الصعوبة · ' + D.ar, function(){
    save.diff = (save.diff + 1) % 3; writeSave();
  });
  ctx.fillStyle = D.col; roundRect(W/2-292, 142, 8, 42, 4); ctx.fill();

  toggleBtnS(W/2-304, 206, 292, save.sound ? 'SOUND: ON' : 'SOUND: OFF', 'الصوت',
           function(){ Sfx.init(); Sfx.setOn(!save.sound); }, save.sound);
  toggleBtnS(W/2+12, 206, 292, save.music ? 'MUSIC: ON' : 'MUSIC: OFF', 'الموسيقى',
           function(){ save.music = !save.music; writeSave(); if(!save.music) Music.stop(); },
           save.music);

  toggleBtnS(W/2-304, 288, 292, save.haptics ? 'VIBRATION: ON' : 'VIBRATION: OFF', 'الاهتزاز',
           function(){ save.haptics = !save.haptics; writeSave(); haptic(30); },
           save.haptics);
  toggleBtnS(W/2+12, 288, 292, isFullscreen() ? 'EXIT FULLSCREEN' : 'FULLSCREEN', 'ملء الشاشة',
           function(){ toggleFullscreen(); }, true);
  // Three tiers, so it cycles rather than toggles.
  var gt = gfxTier();
  toggleBtnS(W/2-304, 370, 608, 'GRAPHICS: ' + GFX_NAMES[gt],
           GFX_AR[gt] + (gt === 2 ? ' — أبطأ على الأجهزة القديمة' : ''),
           function(){ save.gfx = (gfxTier() + 1) % 3; save.gfxUser = true; writeSave(); },
           gt > 0);

  // lifetime stats
  panel(W/2-300, 440, 600, 96, { r:12 });
  var st = save.stats;
  var rows = [['ENEMIES DOWNED', st.kills], ['CRATES SMASHED', st.crates],
              ['PERFECT PARRIES', st.parries], ['STAGES CLEARED', st.clears],
              ['FIGHTS STARTED', st.fights], ['TIME IN THE RING', Math.round(st.time/60) + 'm']];
  for(var i=0;i<rows.length;i++){
    var cx = W/2 - 290 + (i % 3) * 197, cy = 466 + Math.floor(i / 3) * 44;
    statLine(cx, cy, rows[i][0], String(rows[i][1]), UI.gold, 'left');
  }

  if(confirmWipe){
    txt('Erase all progress? This cannot be undone.', W/2, 540, 17, C.bad, 'center', 800);
    uiButton(W/2-304, 552, 292, 52, 'YES, ERASE', 'نعم', function(){
      try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
      save.unlocked = 1; save.xp = 0; save.best = 0; save.cleared = []; save.ranks = {};
      save.survBest = 0; save.achieved = []; save.up = {pow:0,vit:0,spd:0,stam:0};
      for(var k in save.stats) save.stats[k] = 0;
      writeSave(); confirmWipe = false; G.state = 'menu';
    }, 'danger');
    uiButton(W/2+12, 552, 292, 52, 'CANCEL', 'إلغاء', function(){ confirmWipe = false; });
  } else {
    uiButton(W/2-304, 552, 292, 52, 'RESET PROGRESS', 'مسح التقدم',
             function(){ confirmWipe = true; }, 'danger');
    uiButton(W/2+12, 552, 292, 52, 'ACHIEVEMENTS', 'الإنجازات',
             function(){ G.state = 'achievements'; });
  }
  navRow([['BACK', 'رجوع', function(){ confirmWipe = false; G.state = 'menu'; }]]);
}
var confirmWipe = false;

function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFullscreen(){
  try{
    if(isFullscreen()){
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      var el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    }
  }catch(e){}
  setTimeout(resize, 250);
}

/* -------------------------------------------------------------- achievements */
function drawAchievements(){
  checkAchievements();
  screenBg('#191426');
  var got = save.achieved.length;
  screenHead('ACHIEVEMENTS', 'الإنجازات');
  // keep the count in its own LTR run — mixed into the Arabic string the bidi
  // algorithm swaps the two numbers round.
  statLine(W - UI.pad, UI.headY - 12, 'UNLOCKED',
           got + ' / ' + ACHIEVEMENTS.length, UI.gold);

  for(var i=0;i<ACHIEVEMENTS.length;i++){
    var a = ACHIEVEMENTS[i];
    var have = save.achieved.indexOf(a.k) >= 0;
    var cx = 90 + (i % 3) * 372, cy = 132 + Math.floor(i / 3) * 104;
    panel(cx, cy, 348, 92, { r:10, accent:have, raised:have });

    ctx.fillStyle = have ? C.gold : 'rgba(255,255,255,.10)';
    circle(cx+34, cy+34, 18); ctx.fill();
    txt(have ? '★' : '?', cx+34, cy+34, have ? 20 : 18, have ? '#1a1408' : C.dim, 'center', 900);

    txt(a.n, cx+64, cy+26, 17, have ? C.gold : C.dim, 'left', 900);
    txt(a.ar, cx+330, cy+26, 14, have ? 'rgba(255,255,255,.65)' : 'rgba(255,255,255,.2)', 'right', 700);
    txt(a.d, cx+64, cy+56, 14, have ? 'rgba(255,255,255,.7)' : 'rgba(255,255,255,.28)', 'left', 600);
  }
  navRow([['BACK', 'رجوع', function(){ G.state = 'settings'; }]]);
}

/* ----------------------------------------------------------------- upgrades */
var UPS = ASSET_UPGRADES.tracks;
function upCost(lvl){ return ASSET_UPGRADES.cost(lvl); }
var UP_MAX = ASSET_UPGRADES.maxLevel;

function drawUpgrade(){
  screenBg('#1b1526');
  screenHead('TRAINING CAMP', 'معسكر التدريب');
  statLine(W - UI.pad, UI.headY - 12, 'SPENDABLE XP', String(save.xp), UI.gold);

  var rowX = UI.pad, rowW = W - UI.pad * 2;
  for(var i=0;i<UPS.length;i++){
    var u = UPS[i], lvl = save.up[u.k], y = 156 + i*76;
    panel(rowX, y, rowW, 64, { r:12 });
    txtLS(u.n, rowX + UI.sp[5], y+24, UI.t.sub, UI.gold, 'left', 900, 1.8);
    txt(u.ar, rowX + UI.sp[5], y+46, UI.t.label + 1, UI.fgMut, 'left', 700);
    txt(u.d, rowX + 190, y+26, UI.t.body - 1, UI.fgMut, 'left', 600);

    for(var s=0;s<UP_MAX;s++){                              // level pips
      ctx.fillStyle = s < lvl ? UI.gold : 'rgba(255,255,255,.12)';
      roundRect(rowX + 190 + s*34, y+42, 28, 9, 4); ctx.fill();
    }
    var cost = upCost(lvl);
    if(lvl >= UP_MAX){
      txtLS('MAX', rowX + rowW - 96, y+34, UI.t.sub, C.hp, 'center', 900, 2);
    } else {
      var afford = save.xp >= cost;
      (function(key, c, ok){
        // A price, not a stat -- the unit says what the number is for.
        uiButton(rowX + rowW - 170, y+9, 150, 46, (ok ? '▲ ' : '') + c + ' XP', null, function(){
          if(save.xp >= c && save.up[key] < UP_MAX){
            save.xp -= c; save.up[key]++; writeSave(); Sfx.power(); checkAchievements();
          } else { Sfx.hurt(); }
        }, ok ? 'primary' : 'off');
      })(u.k, cost, afford);
    }
  }
  // abilities are found, not bought — shown here so the two are never confused
  txtLS('ABILITIES — FOUND, NEVER BOUGHT', rowX, 542, UI.t.micro, UI.fgFaint, 'left', 800, 2);
  var ord = ['vault','dashleap','powerkick','haymaker','hawk'];
  var aw = (rowW - UI.sp[3] * (ord.length - 1)) / ord.length;
  for(var ai=0; ai<ord.length; ai++){
    var A = ABILITIES[ord[ai]], got = hasAbility(ord[ai]);
    var ax = rowX + ai*(aw + UI.sp[3]);
    panel(ax, 554, aw, 46, { r:10, accent:got, raised:got });
    txt(got ? A.icon : '?', ax+24, 577, 20, got ? UI.gold : UI.fgFaint, 'center', 900);
    txtLS(got ? A.n : 'UNDISCOVERED', ax+46, 570, UI.t.label, got ? UI.fg : UI.fgFaint, 'left', 800, 1.2);
    txt(got ? A.ar : '—', ax+46, 589, UI.t.label, got ? UI.gold : UI.fgFaint, 'left', 700);
  }

  navRow([['BACK', 'رجوع', function(){ G.state = save.unlocked > 0 ? 'map' : 'menu'; }],
          ['MENU', 'القائمة', function(){ G.state = 'menu'; }]]);
}

/* -------------------------------------------------------------- pause/end */
function drawPause(){
  ctx.fillStyle = 'rgba(4,6,11,.82)';
  ctx.fillRect(0, 0, W, H);
  txtLS('PAUSED', W/2, 190, UI.t.screen, UI.gold, 'center', 900, 8);
  txt('إيقاف مؤقت', W/2, 236, 22, C.white, 'center', 700);
  var bw = UI.btn.lg.w, bx = W/2 - bw/2, hw = (bw - UI.sp[3])/2, bh = UI.btn.sm.h;
  uiButton(bx, 286, bw, UI.btn.lg.h, 'RESUME', 'متابعة', function(){ G.paused = false; }, 'primary');
  uiButton(bx, 286 + UI.btn.lg.h + UI.sp[4], bw, bh, 'RESTART STAGE', 'إعادة المرحلة', function(){
    var idx = G.fight ? G.fight.idx : 0;
    G.paused = false; startStage(idx);
  });

            function(){ Sfx.setOn(!save.sound); }, save.sound);
  toggleBtn(bx + hw + UI.sp[3], ty, hw, save.music ? 'MUSIC: ON' : 'MUSIC: OFF', null,
            function(){ save.music = !save.music; writeSave(); if(!save.music) Music.stop(); },
            save.music);
  ty += bh + UI.sp[3];
  toggleBtn(bx, ty, hw, save.haptics ? 'VIBRATE: ON' : 'VIBRATE: OFF', null,
            function(){ save.haptics = !save.haptics; writeSave(); haptic(30); }, save.haptics);
  toggleBtn(bx + hw + UI.sp[3], ty, hw, isFullscreen() ? 'WINDOWED' : 'FULLSCREEN', null,
            function(){ toggleFullscreen(); }, true);
  ty += bh + UI.sp[3];
  toggleBtn(bx, ty, bw, 'GRAPHICS: ' + GFX_NAMES[gfxTier()], null,
            function(){ save.gfx = (gfxTier() + 1) % 3; save.gfxUser = true; writeSave(); },
            gfxTier() > 0);
  uiButton(bx, ty + bh + UI.sp[5], bw, bh, 'QUIT TO MAP', 'خروج', function(){
    Music.stop(); G.state = 'map'; G.paused = false; G.fight = null;
  }, 'danger');
}

function drawClear(dt){
  G.endT += dt;
  screenBg('#132318');
  var F = G.fight;
  txtLS('STAGE CLEAR', W/2, 120, UI.t.screen, UI.gold, 'center', 900, 8);
  txt('تم اجتياز المرحلة', W/2, 168, 22, C.white, 'center', 700);
  txt(F.st.name, W/2, 208, 22, C.hp, 'center', 800);

  var rows = [
    ['ENEMIES DOWN', F.kills],
    ['BEST COMBO',   F.bestCombo],
    ['TIME',         Math.floor(F.time) + 's'],
    ['XP EARNED',    F.xp],
    ['CLEAR BONUS',  F.bonus]
  ];
  for(var i=0;i<rows.length;i++){
    var y = 262 + i*44;
    var a = clamp((G.endT - i*0.13) * 3, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    roundRect(W/2-260, y-16, 520, 36, 8); ctx.fill();
    txt(rows[i][0], W/2-240, y+2, 17, C.dim, 'left', 700);
    txt(String(rows[i][1]), W/2+240, y+2, 21, C.gold, 'right', 900);
    ctx.globalAlpha = 1;
  }
  txt('TOTAL XP ' + save.xp, W/2, 498, 22, C.hp, 'center', 900);

  // rank badge
  var rk = F.rank || 'C', rc = rankColor(rk);
  var grow = clamp((G.endT - 0.7) * 2.6, 0, 1);
  if(grow > 0){
    ctx.save();
    ctx.translate(W/2 + 330, 300);
    ctx.scale(0.6 + grow*0.4, 0.6 + grow*0.4);
    ctx.globalAlpha = grow;
    ctx.fillStyle = 'rgba(8,10,16,.9)';
    circle(0, 0, 62); ctx.fill();
    ctx.strokeStyle = rc; ctx.lineWidth = 5;
    circle(0, 0, 62); ctx.stroke();
    txt(rk, 0, -4, 66, rc, 'center', 900);
    txt('RANK', 0, 36, 14, C.dim, 'center', 800);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  var next = G.fight.idx + 1;
  navRow([['NEXT', 'التالي', function(){
             if(next < CAMPAIGN) openBrief(next); else G.state = 'map';
           }, 'primary'],
          ['TRAIN', 'تدريب', function(){ G.state = 'upgrade'; }],
          ['MAP', 'الخريطة', function(){ G.state = 'map'; }]]);
}

function drawGameOver(dt){
  G.endT += dt;
  screenBg('#251016');
  txtLS('KNOCKED OUT', W/2, 180, UI.t.screen + 4, C.bad, 'center', 900, 8);
  txt('خسرت الجولة', W/2, 232, 24, C.white, 'center', 700);
  var F = G.fight;
  if(F.st.survival){
    txt('REACHED WAVE ' + F.reached, W/2, 288, 30, C.gold, 'center', 900);
    txt('Best wave: ' + save.survBest, W/2, 322, 18, C.hp, 'center', 800);
  } else {
    txt('Enemies downed: ' + F.kills + '   ·   Best combo: ' + F.bestCombo,
        W/2, 292, 20, C.dim, 'center', 700);
    txt('Ahmed gets back up. Train, then run it again.', W/2, 330, 17, 'rgba(255,255,255,.55)', 'center', 600);
  }

  navRow([['RETRY', 'إعادة', function(){ startStage(F.idx); }, 'primary'],
          ['TRAIN', 'تدريب', function(){ G.state = 'upgrade'; }],
          ['MAP', 'الخريطة', function(){ G.state = 'map'; }]]);
}

function drawVictory(dt){
  G.endT += dt;
  screenBg('#1d1730');
  var pulse = 1 + Math.sin(gameTime*3)*0.02;
  txtLS('CHAMPION', W/2, 150, UI.t.screen*pulse, UI.gold, 'center', 900, 8);
  txt('بطل الكويت', W/2, 210, 30, C.white, 'center', 700);
  var F = G.fight;
  var ep = [
    'AL-WAHSH stays down. The arena is on its feet.',
    'The souq traders came out for this one — they are the loudest row in the house.',
    'Ahmed takes the belt back to Mubarakiya in the morning, and opens the shop.'
  ];
  for(var i=0;i<ep.length;i++){
    var a = clamp((G.endT - 0.3 - i*0.5) * 2.2, 0, 1);
    txt(ep[i], W/2, 262 + i*32, 18, i === 2 ? C.gold : C.sand, 'center', 600, a);
  }
  txt('أحمد يرفع الحزام في بطولة الكويت', W/2, 372, 18, 'rgba(255,255,255,.6)', 'center', 700,
      clamp((G.endT - 1.6) * 2, 0, 1));
  txt('Best combo this run: ' + F.bestCombo + '   ·   Rank: ' + (F.rank || '-') +
      '   ·   Total XP: ' + save.xp, W/2, 414, 18, C.hp, 'center', 800);
  txt('SURVIVAL is now open on the map. Replay any stage to chase an S rank.',
      W/2, 446, 16, C.dim, 'center', 600);
  navRow([['MAP', 'الخريطة', function(){ G.state = 'map'; }, 'primary'],
          ['TRAIN', 'تدريب', function(){ G.state = 'upgrade'; }],
          ['AWARDS', 'الإنجازات', function(){ G.state = 'achievements'; }]]);
}

/* ==========================================================================
   MAIN LOOP
   ========================================================================== */
function drawAchToast(){
  if(achToastT <= 0 || !achToast) return;
  var a = clamp(achToastT > 3.0 ? (3.4 - achToastT) / 0.4 : Math.min(1, achToastT / 0.5), 0, 1);
  // Mid-fight the stage banner already owns y 12-74 at centre, and the toast
  // plate is 10-76 — they landed on top of each other. Drop below it.
  var top = (G.state === 'fight') ? 92 : 10;
  var y = top - (1 - a) * 26;
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(8,10,16,.93)';
  roundRect(W/2-240, y, 480, 66, 12); ctx.fill();
  ctx.strokeStyle = UI.gold; ctx.lineWidth = 2.5;
  roundRect(W/2-240, y, 480, 66, 12); ctx.stroke();
  txtLS(achToast.head || 'ACHIEVEMENT UNLOCKED', W/2, y+16, UI.t.micro, UI.fgFaint,
        'center', 800, 2, a);
  txt(achToast.n, W/2, y+38, UI.t.head - 4, UI.gold, 'center', 900, a);
  txt(achToast.ar, W/2, y+56, UI.t.label, UI.fgMut, 'center', 700, a);
  ctx.globalAlpha = 1;
}

function render(dt){
  switch(G.state){
    case 'menu':     drawMenu(dt); break;
    case 'help':     drawHelp(); break;
    case 'map':      drawMap(); break;
    case 'brief':    drawBrief(dt); break;
    case 'settings': drawSettings(); break;
    case 'achievements': drawAchievements(); break;
    case 'upgrade':  drawUpgrade(); break;
    case 'fight':    drawFight(); if(G.paused) drawPause(); break;
    case 'clear':    drawClear(dt); break;
    case 'gameover': drawGameOver(dt); break;
    case 'victory':  drawVictory(dt); break;
  }
  flushUI();
}

var last = 0;
function frame(now){
  if(!last) last = now;
  var rdt = Math.min(0.048, (now - last) / 1000);
  last = now;
  var dt = rdt;
  if(G.slow > 0){ G.slow -= rdt; dt = rdt * 0.34; }
  gameTime += dt;
  G.t += dt;
  GFX_HIGH = gfxTier() >= 1;
  GFX_CINE = gfxTier() >= 2 && CAN_FILTER;
  samplePerf(rdt);

  readInput();

  if(G.state === 'fight' && !G.paused){
    if(G.intro > 0) G.intro -= dt;
    if(hitstop > 0) hitstop -= dt;
    else updateFight(dt);
    updateFx(dt);
  } else {
    updateFx(dt * 0.7);
  }

  if(achToastT > 0) achToastT -= rdt;
  render(dt);
  drawAchToast();
  clearTaps();
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);

/* optional offline cache */
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
})();

    // The title fight, lit like one: hard spots straight down, two more behind,
    // a crowd that returns almost nothing, and blacks allowed to go black.
    rig:{ key:{x:-0.10,y:-0.99,col:'#ffffff',power:1.08}, fill:{col:'#5b3a72',power:0.26},
          rim:{col:'#ffffff',power:1.00}, toe:'rgba(7,5,12,.26)', shoulder:'rgba(255,255,255,.94)',
          grade:[[0,'rgba(150,88,240,0.108)'],[0.5,'rgba(140,120,150,0.022)'],[1,'rgba(255,150,80,0.094)']],
          bloom:0.36, exposure:1.04, contrast:1.20, saturate:1.10, haze:1.4 },
    floor:function(camX){
      // Championship canvas: bordered mat, centre circle, corner marks.
      var g = ctx.createLinearGradient(0, gy(0.06), 0, gy(1));
      g.addColorStop(0, 'rgba(84,64,96,.60)'); g.addColorStop(1, 'rgba(48,34,58,.75)');
      ctx.fillStyle = g; ctx.fillRect(0, gy(0.06), W, gy(1) - gy(0.06));
      ctx.save();
      ctx.strokeStyle = 'rgba(224,179,74,.50)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, gy(0.16)); ctx.lineTo(W, gy(0.16)); ctx.stroke();
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(0, gy(0.94)); ctx.lineTo(W, gy(0.94)); ctx.stroke();
      ctx.strokeStyle = 'rgba(200,16,46,.34)'; ctx.lineWidth = 3;
      groundRow(camX, 0.55, 900, 1.0, function(x, i, y, sc){     // centre circle
        ctx.beginPath();
        ctx.ellipse(x, gy(0.55), 190 * sc, 62 * sc, 0, 0, 6.2832); ctx.stroke();
      });
      ctx.restore();
      // Spotlight pools, tracking the same rig the mid layer hangs.
      ctx.save();
      groundRow(camX, 0.48, 340, 0.5, function(x, i, y, sc){
        var lg = ctx.createRadialGradient(x, y, 6, x, y, 200 * sc);
        lg.addColorStop(0, 'rgba(240,220,255,.16)');
        lg.addColorStop(1, 'rgba(240,220,255,0)');
        ctx.fillStyle = lg;
        ctx.beginPath(); ctx.ellipse(x, y, 200 * sc, 66 * sc, 0, 0, 6.2832); ctx.fill();
      });
      ctx.restore();
    },
    air:function(camX){
      airDrift(camX, { n:18, col:'#ffd8f0', alpha:0.30, r:2.4, y0:40, y1:FLOOR_TOP+120,
                       par:0.5, driftX:30, sway:14, seed:380 });
      if(!GFX_HIGH) return;
      ctx.save();                                                 // camera flashes in the crowd
      for(var i = 0; i < 14; i++){
        var ph = (gameTime * 0.9 + hashv(i, 400)) % 1;
        if(ph > 0.10) continue;
        var span = W * 1.8;
        var x = (hashv(i, 401) * span - camX * 0.16) % span;
        if(x < 0) x += span;
        ctx.globalAlpha = (1 - ph / 0.10) * 0.75;
        ctx.fillStyle = '#fff8e8';
        circle(x, 150 + hashv(i, 402) * 170, 3.4); ctx.fill();
      }
      ctx.restore();
    },
    far:function(camX){
      // Two tiers of crowd going up into the dark, then the spots. The upper
      // tier is smaller and dimmer, which is the only thing that makes the
      // room read as tall rather than as a wall of dots.
      for(var r=0;r<3;r++){
        for(var i=0;i<56;i++){
          var ux = ((i*24 + r*12) - camX*0.03) % (W+48);
          if(ux < -24) ux += W+48;
          ctx.globalAlpha = 0.10 + r*0.045;
          ctx.fillStyle = ['#2a2035','#352a44','#241b2e'][i%3];
          circle(ux, 34 + r*30, 7); ctx.fill();
        }
      }
      ctx.globalAlpha = 0.5; ctx.fillStyle = '#0e0a16';
      ctx.fillRect(0, 128, W, 16);                   // the tier divide
      ctx.globalAlpha = 1;
      for(r=0;r<5;r++){
        for(var i2=0;i2<48;i2++){
          var cx = ((i2*30 + r*15) - camX*0.05) % (W+60);
          if(cx < -30) cx += W+60;
          ctx.globalAlpha = 0.25 + r*0.1;
          ctx.fillStyle = ['#3a2c46','#4a3757','#2f2439'][i2%3];
          circle(cx, 160 + r*40, 11); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      // spotlights
      for(var sp=0;sp<3;sp++){
        var lx = 250 + sp*390;
        var grd = ctx.createLinearGradient(lx, 0, lx, FLOOR_TOP);
        grd.addColorStop(0, 'rgba(255,240,200,.22)');
        grd.addColorStop(1, 'rgba(255,240,200,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.moveTo(lx-26, 0); ctx.lineTo(lx+26, 0);
        ctx.lineTo(lx+180, FLOOR_TOP); ctx.lineTo(lx-180, FLOOR_TOP);
        ctx.closePath(); ctx.fill();
      }
    },
    mid:function(camX){
      ctx.fillStyle = '#1b1226';
      ctx.fillRect(0, FLOOR_TOP-120, W, 120);
      ctx.strokeStyle = 'rgba(224,179,74,.5)'; ctx.lineWidth = 4;
      for(var r=0;r<3;r++){
        ctx.beginPath(); ctx.moveTo(0, FLOOR_TOP-108+r*34); ctx.lineTo(W, FLOOR_TOP-108+r*34); ctx.stroke();
      }
      repeatX(260, 0.5, camX, function(x,i){
        ctx.fillStyle = '#c8102e';
        ctx.fillRect(x, FLOOR_TOP-118, 8, 118);
      });
    },
    fore:function(camX){
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.fillRect(0, H-30, W, 30);
    }
  }
};

function drawTower(x, baseY, h, r, spheres){
  ctx.fillStyle = '#0d1730';
  ctx.fillRect(x-6, baseY-h, 12, h);
  if(spheres > 0){ circle(x, baseY-h*0.62, r); ctx.fill(); }
  if(spheres > 1){ circle(x, baseY-h*0.90, r*0.55); ctx.fill(); }
  ctx.fillStyle = 'rgba(120,190,255,.30)';
  if(spheres > 0){ circle(x-r*0.3, baseY-h*0.66, r*0.4); ctx.fill(); }
}


/* ==========================================================================
   THE BACKDROP VOCABULARY
   The far layer was nine hand-rolled loops of fillRect, which is why every
   place had the same skyline in a different colour. It is also the layer the
   depth-of-field pass softens, so detail there is thrown away and only
   SILHOUETTE survives -- which is the argument for building shapes rather
   than rectangles, and for stacking two or three bands at different parallax
   instead of one.

   Everything here draws a silhouette in one flat colour. The rig's fog and
   haze do the atmospheric perspective; these only have to get the shape
   right, and the shape is what tells you where you are standing.
   ========================================================================== */

/* A band of buildings with crowns that differ. A skyline of plain boxes reads
   as a bar chart; what makes it a city is that the tops disagree. */
function skyline(camX, o){
  var base = o.y, span = o.span || 150, gap = o.gap || 40;
  ctx.fillStyle = o.col;
  repeatX(span + gap, o.par, camX, function(x, i){
    var h = o.h0 + hashv(i, o.seed) * (o.h1 - o.h0);
    var w = span * (0.55 + hashv(i, o.seed + 7) * 0.55);
    var top = base - h;
    ctx.fillRect(x, top, w, h + (o.foot || 30));
    var kind = (hashv(i, o.seed + 3) * 4) | 0;
    if(kind === 0){                                   // stepped crown
      ctx.fillRect(x + w*0.16, top - h*0.13, w*0.68, h*0.13);
      ctx.fillRect(x + w*0.34, top - h*0.21, w*0.32, h*0.09);
    } else if(kind === 1){                            // mast
      var mx = x + w*0.5, mh = h*0.30;
      ctx.fillRect(mx - w*0.035, top - mh, w*0.07, mh);
      ctx.fillRect(mx - w*0.13, top - mh*0.62, w*0.26, w*0.05);
    } else if(kind === 2){                            // roof tank on legs
      ctx.fillRect(x + w*0.22, top - h*0.14, w*0.10, h*0.14);
      ctx.fillRect(x + w*0.60, top - h*0.14, w*0.10, h*0.14);
      ctx.fillRect(x + w*0.16, top - h*0.20, w*0.60, h*0.07);
    }                                                 // kind 3 stays flat
    if(o.lit && hashv(i, o.seed + 11) > 0.45){        // a few lit windows
      ctx.save(); ctx.globalAlpha = o.litA || 0.5; ctx.fillStyle = o.lit;
      for(var r=0;r<4;r++) for(var c=0;c<3;c++){
        if(hashv(i*13 + r*3 + c, o.seed + 19) < 0.55) continue;
        ctx.fillRect(x + w*0.16 + c*w*0.26, top + h*0.14 + r*h*0.19, w*0.13, h*0.075);
      }
      ctx.restore();
    }
  });
}

/* A dune line: one sine ridge filled down to the floor. Two of these at
   different parallax and tone is the whole desert. */
function duneBand(camX, o){
  ctx.fillStyle = o.col;
  ctx.beginPath();
  ctx.moveTo(-120, o.y + 30);
  for(var x = -120; x <= W + 120; x += 44){
    var t = (x + camX * o.par) * o.freq;
    ctx.lineTo(x, o.y - Math.sin(t) * o.amp - Math.sin(t * 2.3 + 1.7) * o.amp * 0.34);
  }
  ctx.lineTo(W + 120, o.y + 40); ctx.lineTo(-120, o.y + 40);
  ctx.closePath(); ctx.fill();
}

/* A jagged ridge — sharper than a dune, for rock rather than sand. */
function ridgeBand(camX, o){
  ctx.fillStyle = o.col;
  ctx.beginPath();
  ctx.moveTo(-100, o.y + 40);
  var step = o.step || 58;
  for(var x = -100, i = 0; x <= W + 100; x += step, i++){
    var k = hashv(i + Math.floor(camX * o.par / step), o.seed);
    ctx.lineTo(x, o.y - k * o.amp);
  }
  ctx.lineTo(W + 100, o.y + 40); ctx.lineTo(-100, o.y + 40);
  ctx.closePath(); ctx.fill();
}

/* A dhow. Kuwait's boat, and the one silhouette that says which harbour this
   is: a hull that rises to a high stern, one raked mast, one lateen sail. */
function dhow(x, y, s, col, sail){
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x - 46*s, y);
  ctx.quadraticCurveTo(x - 20*s, y + 11*s, x + 30*s, y + 7*s);
  ctx.lineTo(x + 52*s, y - 17*s);
  ctx.lineTo(x + 40*s, y - 15*s);
  ctx.quadraticCurveTo(x + 6*s, y - 3*s, x - 46*s, y - 4*s);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(x - 4*s, y - 60*s, 3*s, 58*s);           // mast, raked forward
  ctx.fillStyle = sail || col;
  ctx.beginPath();                                       // lateen sail
  ctx.moveTo(x - 2*s, y - 58*s);
  ctx.lineTo(x + 34*s, y - 8*s);
  ctx.lineTo(x - 26*s, y - 8*s);
  ctx.closePath(); ctx.fill();
}

/* A palm. Fronds as tapering quads off one point, so it reads at any size. */
function palmFar(x, y, s, col, seed){
  ctx.fillStyle = col;
  ctx.beginPath();                                       // trunk, leaning
  var lean = (hashv(seed||0, 3) - 0.5) * 26 * s;
  ctx.moveTo(x - 3.4*s, y);
  ctx.quadraticCurveTo(x - 1*s + lean*0.5, y - 42*s, x + lean, y - 78*s);
  ctx.lineTo(x + lean + 4.4*s, y - 78*s);
  ctx.quadraticCurveTo(x + 4*s + lean*0.5, y - 42*s, x + 3.4*s, y);
  ctx.closePath(); ctx.fill();
  var hx = x + lean + 2*s, hy = y - 78*s;
  for(var i=0;i<7;i++){
    var a = -Math.PI + i * (Math.PI/6) + (hashv(i, (seed||0)+5) - 0.5) * 0.24;
    var len = 30*s * (0.68 + hashv(i, (seed||0)+9) * 0.5);
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.quadraticCurveTo(hx + Math.cos(a)*len*0.6, hy + Math.sin(a)*len*0.6 - 5*s,
                         hx + Math.cos(a)*len,     hy + Math.sin(a)*len + 7*s);
    ctx.quadraticCurveTo(hx + Math.cos(a)*len*0.6, hy + Math.sin(a)*len*0.6 + 4*s,
                         hx, hy);
    ctx.closePath(); ctx.fill();
  }
}

/* The same palm, but near enough that the trunk and the crown want different
   colours. Coconuts because at this distance you would see them. */
function palmTrunk(x, y, s, seed, trunkCol, frondCol){
  ctx.fillStyle = trunkCol;
  var lean = (hashv(seed, 3) - 0.5) * 30 * s;
  ctx.beginPath();
  ctx.moveTo(x - 4.6*s, y);
  ctx.quadraticCurveTo(x - 1*s + lean*0.5, y - 52*s, x + lean, y - 96*s);
  ctx.lineTo(x + lean + 5.6*s, y - 96*s);
  ctx.quadraticCurveTo(x + 5.4*s + lean*0.5, y - 52*s, x + 4.6*s, y);
  ctx.closePath(); ctx.fill();
  for(var r=0;r<5;r++){                                  // trunk rings
    ctx.globalAlpha = 0.18; ctx.fillStyle = '#000';
    ctx.fillRect(x - 4*s + lean*(r/6), y - 16*s - r*15*s, 8*s, 2*s);
    ctx.globalAlpha = 1; ctx.fillStyle = trunkCol;
  }
  var hx = x + lean + 2.6*s, hy = y - 96*s;
  ctx.fillStyle = frondCol;
  for(var i=0;i<8;i++){
    var a = -Math.PI - 0.2 + i * (Math.PI + 0.4)/7 + (hashv(i, seed+5) - 0.5) * 0.30;
    var len = 40*s * (0.62 + hashv(i, seed+9) * 0.55);
    var droop = 13*s + hashv(i, seed+13) * 12*s;
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.quadraticCurveTo(hx + Math.cos(a)*len*0.55, hy + Math.sin(a)*len*0.55 - 6*s,
                         hx + Math.cos(a)*len,     hy + Math.sin(a)*len + droop);
    ctx.quadraticCurveTo(hx + Math.cos(a)*len*0.5,  hy + Math.sin(a)*len*0.5 + 5*s,
                         hx, hy);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(120,86,40,.9)';                  // coconuts
  for(var c=0;c<3;c++){
    ctx.beginPath();
    ctx.arc(hx + (c-1)*5.5*s, hy + 5*s, 3.4*s, 0, 6.2832); ctx.fill();
  }
}

/* A minaret and its dome — the shape that says souq rather than high street. */
function minaret(x, y, h, col){
  ctx.fillStyle = col;
  ctx.fillRect(x - h*0.048, y - h, h*0.096, h);
  ctx.fillRect(x - h*0.082, y - h*0.72, h*0.164, h*0.045);   // balcony
  ctx.beginPath();                                           // cap
  ctx.moveTo(x - h*0.075, y - h);
  ctx.quadraticCurveTo(x, y - h*1.16, x + h*0.075, y - h);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(x - h*0.012, y - h*1.22, h*0.024, h*0.08);     // finial
}
function domeRoof(x, y, r, col){
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x - r, y);
  ctx.quadraticCurveTo(x - r, y - r*1.28, x, y - r*1.34);
  ctx.quadraticCurveTo(x + r, y - r*1.28, x + r, y);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(x - r*0.05, y - r*1.62, r*0.10, r*0.30);
}

/* A bedouin tent: a low black ridge with guy lines. */
function tentFar(x, y, s, col){
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x - 54*s, y);
  ctx.lineTo(x - 30*s, y - 26*s);
  ctx.lineTo(x, y - 20*s);
  ctx.lineTo(x + 30*s, y - 27*s);
  ctx.lineTo(x + 54*s, y);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 1.4*s;
  ctx.beginPath();
  ctx.moveTo(x - 30*s, y - 26*s); ctx.lineTo(x - 68*s, y);
  ctx.moveTo(x + 30*s, y - 27*s); ctx.lineTo(x + 68*s, y);
  ctx.stroke();
}

/* Masts in a marina — verticals of different heights over the water line. */
function mastField(camX, o){
  ctx.strokeStyle = o.col; ctx.lineWidth = 1.6;
  repeatX(o.span || 46, o.par, camX, function(x, i){
    var h = o.h0 + hashv(i, o.seed) * (o.h1 - o.h0);
    ctx.beginPath(); ctx.moveTo(x, o.y); ctx.lineTo(x, o.y - h); ctx.stroke();
    ctx.fillStyle = o.col;
    ctx.fillRect(x - 5, o.y - h*0.72, 10, 1.6);
  });
}

/* ==========================================================================
   GROUND + ATMOSPHERE
   The playfield is a depth band: t = 0 at the back wall, t = 1 at the front
   rail. Every helper below works in t and borrows the same perspective the
   fighters use (screenOf), so a lane marking and a fighter standing on it
   agree about where the floor is.
   ========================================================================== */
function gy(t){ return FLOOR_TOP + t * FLOOR_H; }
function gsc(t){ return 0.98 + t * 0.40; }

/* Places a marking every `cell` world units along one depth line. The camera
   is side-on -- x never scales with depth, only sprite size does -- so the
   spacing stays constant and `sc` is handed over for sizing only. */
function groundRow(camX, t, cell, par, fn){
  var sc = gsc(t), off = camX * par;
  var i0 = Math.floor(off / cell) - 1, n = Math.ceil(W / cell) + 3;
  for(var i = i0; i < i0 + n; i++) fn(i * cell - off, i, gy(t), sc);
}

/* Slabs and tiles. The joints running away from camera stay parallel -- this
   view is side-on, so converging them would fight the way fighters move. The
   depth cue comes from the cross rows instead: they crowd toward the back and
   fade out with distance. */
function groundGrid(camX, cell, col, lw, rows){
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = lw || 1;
  rows = rows || 5;
  var k, t;
  for(k = 0; k <= rows; k++){
    t = Math.pow(k / rows, 0.78);
    ctx.globalAlpha = 0.30 + t * 0.60;
    ctx.beginPath(); ctx.moveTo(0, gy(t)); ctx.lineTo(W, gy(t)); ctx.stroke();
  }
  ctx.globalAlpha = 0.50;
  repeatX(cell, 1.0, camX, function(x){
    ctx.beginPath(); ctx.moveTo(x, gy(0)); ctx.lineTo(x, gy(1)); ctx.stroke();
  });
  ctx.restore();
}

/* Boardwalk: planks laid across the walk, so only the converging rows show. */
function groundPlanks(camX, count, col, gap){
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = gap || 2;
  for(var k = 0; k <= count; k++){
    var t = Math.pow(k / count, 0.80);
    ctx.globalAlpha = 0.25 + t * 0.55;
    ctx.beginPath(); ctx.moveTo(0, gy(t)); ctx.lineTo(W, gy(t)); ctx.stroke();
  }
  ctx.restore();
}

/* Wind-blown sand. Ripples crowd together toward the horizon and stretch as
   they come forward, which is most of what sells a flat plane as ground. */
function groundRipples(camX, col, rows, amp, strength){
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  rows = rows || 9;
  for(var k = 0; k < rows; k++){
    var t = Math.pow(k / rows, 0.72);
    var y = gy(t), sc = gsc(t);
    ctx.globalAlpha = (0.10 + t * 0.28) * (strength || 1);
    ctx.lineWidth = 1.2 + t * 2.2;
    ctx.beginPath();
    var off = camX * (0.55 + t * 0.45);
    for(var x = -40; x <= W + 40; x += 26){
      var wob = Math.sin((x + off) * 0.011 + k * 1.7) * (amp || 5) * sc;
      if(x === -40) ctx.moveTo(x, y + wob); else ctx.lineTo(x, y + wob);
    }
    ctx.stroke();
  }
  ctx.restore();
}

/* Scattered flat patches: puddles, oil, worn paving, ice on a market floor. */
function groundPatches(camX, col, n, seed, rx, par){
  ctx.save();
  ctx.fillStyle = col;
  for(var i = 0; i < n; i++){
    var t = 0.12 + hashv(i, seed) * 0.84;
    var span = W * 2.4;
    var x = (hashv(i, seed + 1) * span - camX * (par || 1)) % span;
    if(x < -120) x += span;
    var sc = gsc(t);
    ctx.globalAlpha = 0.10 + hashv(i, seed + 2) * 0.20;
    ctx.beginPath();
    ctx.ellipse(x, gy(t), (rx || 44) * sc * (0.5 + hashv(i, seed + 3)),
                (rx || 44) * 0.26 * sc, 0, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}

/* Lane dashes down the middle of a road, plus a solid edge line each side. */
function groundLanes(camX, col){
  ctx.save();
  ctx.strokeStyle = col;
  var edges = [0.16, 0.92];
  for(var e = 0; e < edges.length; e++){
    ctx.globalAlpha = 0.30; ctx.lineWidth = 2 + edges[e] * 3;
    ctx.beginPath(); ctx.moveTo(0, gy(edges[e])); ctx.lineTo(W, gy(edges[e])); ctx.stroke();
  }
  ctx.globalAlpha = 0.55;
  groundRow(camX, 0.54, 210, 1.0, function(x, i, y, sc){
    ctx.fillStyle = col;
    ctx.fillRect(x, y - 2 * sc, 96 * sc, 4.5 * sc);
  });
  ctx.restore();
}

/* The backdrop has to sit down into the floor or the horizon reads as a cut
   edge. A short haze band either side of FLOOR_TOP does it. */
function horizonBand(col){
  var g = ctx.createLinearGradient(0, FLOOR_TOP - 54, 0, FLOOR_TOP + 34);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.55, col);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = 0.7;
  ctx.fillStyle = g;
  ctx.fillRect(0, FLOOR_TOP - 54, W, 88);
  ctx.restore();
}

/* Anything drifting through the air: dust, spray, embers, confetti. One
   system, because they only differ by colour, drift and how much they sway. */
function airDrift(camX, o){
  if(!GFX_HIGH) return;
  var n = o.n || 22, sp = o.span || W * 1.6;
  ctx.save();
  ctx.fillStyle = o.col;
  for(var i = 0; i < n; i++){
    var seed = (o.seed || 60) + i;
    var life = hashv(i, seed) * 6 + 3;
    var ph = (gameTime / life + hashv(i, seed + 1)) % 1;
    var x = (hashv(i, seed + 2) * sp - camX * (o.par || 0.5)
             + ph * (o.driftX || 60)) % sp;
    if(x < -20) x += sp;
    var y0 = (o.y0 || 60), y1 = (o.y1 || FLOOR_TOP);
    var y = y0 + ((hashv(i, seed + 3) + ph * (o.fall || 1)) % 1) * (y1 - y0);
    y += Math.sin(gameTime * 1.6 + i) * (o.sway || 5);
    ctx.globalAlpha = (o.alpha || 0.35) * Math.sin(ph * Math.PI);
    var r = (o.r || 2) * (0.5 + hashv(i, seed + 4));
    if(o.streak){
      ctx.fillRect(x, y, r * (o.streak || 6), r * 0.7);
    } else {
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    }
  }
  ctx.restore();
}

/* Gulls: two strokes each, which at this size is all a bird needs. */
function airBirds(camX, n, col, y0, speed){
  if(!GFX_HIGH) return;
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineCap = 'round';
  var span = W * 2;
  for(var i = 0; i < n; i++){
    var x = (hashv(i, 90) * span + gameTime * (speed || 26) * (0.6 + hashv(i, 91))
             - camX * 0.18) % span;
    if(x < -30) x += span;
    var y = y0 + hashv(i, 92) * 120 + Math.sin(gameTime * 1.1 + i * 2) * 9;
    var w = 6 + hashv(i, 93) * 5;
    var flap = Math.sin(gameTime * 6 + i * 1.7) * 0.45;
    ctx.globalAlpha = 0.45 + hashv(i, 94) * 0.3;
    ctx.beginPath();
    ctx.moveTo(x - w, y + Math.sin(flap) * w * 0.5);
    ctx.quadraticCurveTo(x, y - w * 0.35, x + w, y + Math.sin(flap) * w * 0.5);
    ctx.stroke();
  }
  ctx.restore();
}

/* A slow cloud band. Themes hand over a config rather than a function since
   they all want the same thing in a different colour. */
function skyClouds(camX, c){
  ctx.save();
  ctx.fillStyle = c.col;
  var span = W * 2.2;
  for(var i = 0; i < (c.n || 6); i++){
    var x = (hashv(i, c.seed || 70) * span - camX * (c.par || 0.05)
             - gameTime * (c.speed || 3)) % span;
    if(x < -300) x += span;
    var y = (c.y || 70) + hashv(i, (c.seed || 70) + 1) * (c.spread || 90);
    var w = (c.w || 150) * (0.6 + hashv(i, (c.seed || 70) + 2) * 0.9);
    var h = w * (0.16 + hashv(i, (c.seed || 70) + 3) * 0.10);
    ctx.globalAlpha = (c.alpha || 0.28) * (0.5 + hashv(i, (c.seed || 70) + 4) * 0.5);
    ctx.beginPath();
    ctx.ellipse(x, y, w, h, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + w * 0.32, y - h * 0.55, w * 0.52, h * 0.85, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x - w * 0.40, y - h * 0.22, w * 0.40, h * 0.70, 0, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
}

function drawStageBg(theme, camX){
  var T = THEME[theme] || THEME.souq;
  useRig(T.rig);
  var g = ctx.createLinearGradient(0, 0, 0, FLOOR_TOP + 30);
  g.addColorStop(0, T.sky[0]); g.addColorStop(0.55, T.sky[1]); g.addColorStop(1, T.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, FLOOR_TOP + 30);
  if(T.clouds && GFX_HIGH) skyClouds(camX, T.clouds);
  // Depth of field. The far layer sits past the focal plane, so it goes soft.
  // The trap here is that a canvas filter applies to every draw call, not to
  // the layer -- setting it and then running T.far() blurs the whole frame
  // once per rectangle the backdrop draws, which measured at 1fps. So the
  // layer is rendered once into a half-size buffer and blurred on the way
  // back: one filtered composite regardless of how much the backdrop draws.
  if(GFX_CINE && RIG.haze > 0.5) farBlurred(T, camX);
  else T.far(camX);
  ctx.fillStyle = T.fog; ctx.fillRect(0, 0, W, FLOOR_TOP);
  T.mid(camX);
  // A second, weaker pass of the same haze so the mid layer sits between the
  // backdrop and the fighters instead of reading as hard as the foreground.
  ctx.save(); ctx.globalAlpha = 0.26;
  ctx.fillStyle = T.fog; ctx.fillRect(0, 0, W, FLOOR_TOP);
  ctx.restore();
  horizonBand(T.fog);

  // floor
  var fg = ctx.createLinearGradient(0, FLOOR_TOP - 20, 0, H);
  fg.addColorStop(0, T.ground[0]); fg.addColorStop(1, T.ground[1]);
  ctx.fillStyle = fg; ctx.fillRect(0, FLOOR_TOP - 20, W, H - FLOOR_TOP + 20);

  // Distance darkens the floor toward the back wall, so the band reads as a
  // plane going away rather than a flat slab.
  var dg = ctx.createLinearGradient(0, FLOOR_TOP - 20, 0, gy(0.62));
  dg.addColorStop(0, 'rgba(0,0,0,.30)'); dg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = dg; ctx.fillRect(0, FLOOR_TOP - 20, W, gy(0.62) - FLOOR_TOP + 20);

  if(T.floor) T.floor(camX);

  ctx.globalAlpha = 0.06;
  repeatX(120, 1.0, camX, function(x){
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.moveTo(x, FLOOR_TOP); ctx.lineTo(x + 40, FLOOR_TOP);
    ctx.lineTo(x + 96, H); ctx.lineTo(x + 6, H);
    ctx.closePath(); ctx.fill();
  });
  ctx.globalAlpha = 1;
  if(T.air) T.air(camX);
}

/* ==========================================================================
   GAME STATE + COMBAT
   ========================================================================== */

// Each location gets its own tonal centre so the loop does not wear thin.
var MUSIC_ROOT = { souq:73.42, gym:82.41, fishmarket:69.30, towers:65.41,
                   marina:77.78, failaka:87.31, highway:61.74, desert:73.42, arena:98.00 };
/* Scalability, measured rather than guessed. The game starts on the top tier
   and walks down one step at a time until the device holds frame rate: first
   the post chain goes (it reads the frame back per-pixel, which is nearly free
   with a GPU and ruinous without one), then the lighting rig. Each step gets
   its own fresh sample, because dropping a tier changes what there is to
   measure. A player who has set the tier themselves is never overridden. */
var perfN = 0, perfSum = 0, perfDone = false;
var GFX_NAMES = ['FAST', 'REALISTIC', 'CINEMATIC'];
var GFX_AR    = ['رسوم سريعة', 'رسوم واقعية', 'رسوم سينمائية'];
function samplePerf(rdt){
  if(perfDone || save.gfxUser || gfxTier() === 0) return;
  if(G.state !== 'fight' || G.paused || G.intro > 0) return;
  perfN++; perfSum += rdt;
  if(perfN < 110) return;
  var fps = perfN / perfSum;
  perfN = 0; perfSum = 0;
  // 46 is the knee: above it the fight reads smooth, below it the hit frames
  // start to land late, which matters more than any amount of lighting.
  if(fps >= 46){ perfDone = true; return; }
  var t = gfxTier() - 1;
  save.gfx = t; writeSave();
  if(t === 0) perfDone = true;
  toast('GRAPHICS: ' + GFX_NAMES[t], GFX_AR[t] + ' — يمكن تغييرها', 'ADJUSTED FOR THIS DEVICE');
}

var gameTime = 0;
var G = { state:'menu', paused:false, fight:null, t:0, intro:0, endT:0, result:null };

function makePlayer(){
  var A = ASSET_AHMED, per = A.perLevel;
  var lv = playerLevel(), gain = ASSET_LEVELS.perLevel;
  var maxHp   = A.base.hp   + save.up.vit  * per.vit  + (lv - 1) * gain.hp;
  var maxStam = A.base.stam + save.up.stam * per.stam;
  var maxMp   = A.base.mp   + (lv - 1) * gain.mp;
  var p = makeFighter({
    isPlayer:true, x:A.spawn.x, z:A.spawn.z, sc:A.spawn.sc,
    hp:maxHp, maxHp:maxHp, stam:maxStam, maxStam:maxStam,
    pow:A.base.pow, spd:A.base.spd + save.up.spd * per.spd, reach:A.base.reach,
    name:A.name, ar:A.ar, kind:'player',
    col:A.col
  });
  p.chainStep = 0; p.chainT = 0; p.dashT = 0; p.rage = 0;
  p.mp = p.maxMp = maxMp;
  p.level = lv;
  for(var k in A.look) p[k] = A.look[k];
  return p;
}

function startStage(idx, entry, keep){
  var st = STAGES[idx];
  var p = makePlayer();
  // Walking in from the east means arriving at that edge, facing back the way
  // the world runs. Survival and the arena always start at the mouth.
  if(entry === 'e'){ p.x = Math.max(120, st.len - 150); p.facing = -1; }
  // Carry the fighter's condition across an area edge — travel is a step
  // through a doorway, not a fresh run.
  if(keep){
    p.hp = clamp(keep.hp, 1, p.maxHp);
    p.mp = clamp(keep.mp, 0, p.maxMp);
    p.rage = clamp(keep.rage, 0, 100);
    if(keep.weapon) p.weapon = keep.weapon;
  }
  markVisited(idx);
  G.fight = {
    idx:idx, st:st, player:p, enemies:[], camX:0, lockX:null,
    // A beaten area keeps its scenery and loses its ambushes.
    waves:areaCleared(idx) ? [] : st.waves.map(function(w){ return w; }),
    // Entering from the east means every trigger is already behind you.
    waveIdx: (entry === 'e' && !areaCleared(idx))
      ? st.waves.filter(function(w){ return w.at < p.x; }).length : 0,
    props:buildProps(st, idx), items:[],
    gates:(st.gates || []).map(function(g){
      return { at:g.at, type:g.type, reward:g.reward,
               open:gateOpen(idx, g.at), t:0, hp:0, flash:0, near:false, can:false };
    }),
    survWave:1, time:0, kills:0, xp:0,
    bestCombo:0, done:false, hint:'', hintT:0
  };
  parts.length = 0; nums.length = 0; rings.length = 0;
  shake = 0; hitstop = 0; flashScreen = 0; camPunch = 0; bloomWarm = false;
  G.state = 'fight'; G.paused = false; G.intro = keep ? 1.1 : 2.2; G.slow = 0;
  if(!keep) bump('fights');
  writeSave();
  Sfx.init(); Sfx.resume();
  Music.stop();
  Music.start(!!st.boss || !!st.survival, MUSIC_ROOT[st.theme] || 73.42);
}

/* ------------------------------------------------------------- attack logic */
function startAttack(f, key){
  var a = ATK[key];
  if(!a) return false;
  if(f.state === 'attack' || f.state === 'hit' || f.state === 'down' || f.state === 'dash') return false;
  if(f.isPlayer && key !== 'special' && f.stam < a.stam) return false;
  if(f.isPlayer && key !== 'special') f.stam -= a.stam;
  f.atk = f.isPlayer ? hawkAttack(f, armedAttack(f, a)) : a;
  f.atkKey = key; f.atkT = 0; f.state = 'attack';
  f.hitDone = false; f.hitTargets = []; f.hitProps = []; f.hitGates = []; f.blocking = false;
  f.wepSwing = false; f.hawkSwing = false;
  if(!f.isPlayer && a.heavy) f.tele = a.su;
  Sfx.whoosh();
  return true;
}
function advanceAttack(f, dt, targets){
  var a = f.atk;
  f.atkT += dt;
  if(f.tele > 0) f.tele = Math.max(0, f.tele - dt);
  if(f.atkT >= a.su && f.atkT < a.su + a.ac){
    f.vx = approach(f.vx, f.facing * (a.heavy ? 165 : 120), 1400 * dt);
    checkHit(f, a, targets);
    checkPropHit(f, a);
    checkGateHit(f, a);
  } else {
    f.vx *= Math.pow(0.02, dt);
  }
  f.moving = false;
  if(f.atkT >= a.su + a.ac + a.rc){ f.state = 'idle'; f.atk = null; }
}
function checkHit(f, a, targets){
  for(var i=0;i<targets.length;i++){
    var t = targets[i];
    if(!t || t.dead || t === f) continue;
    if(f.hitDone && !a.multi) return;
    if(f.hitTargets.indexOf(t) >= 0) continue;
    if(t.state === 'down' || t.invuln > 0) continue;
    var dx = (t.x - f.x) * f.facing;
    var dz = Math.abs(t.z - f.z);
    if(dx > -30 && dx < a.reach + 30 && dz < 0.17){
      f.hitTargets.push(t);
      f.hitDone = true;
      applyHit(f, t, a);
      if(!a.multi) return;
    }
  }
}
function applyHit(att, def, a){
  // Whiffing costs nothing but time; only a swing that lands wears it out.
  if(att.weapon && a.wep && !att.wepSwing){
    att.wepSwing = true;
    if(--att.weapon.uses <= 0) breakWeapon(att);
  }
  if(a.hawk && !att.hawkSwing){
    att.hawkSwing = true;
    att.mp = Math.max(0, att.mp - ABILITIES.hawk.mp);
    var hs = screenOf(def);
    burst(hs.x, hs.y - 74, 14, 'rgba(255,168,52,.95)', 300);
    burst(hs.x, hs.y - 74, 8, 'rgba(255,238,190,.95)', 190);
    ring(hs.x, hs.y - 74, '#ffb04a', 8, 74, 0.28);
  } else if(att.isPlayer && att.maxMp){
    att.mp = Math.min(att.maxMp, att.mp + ASSET_AHMED.mpRegen.onHit);
  }
  var awayFacing = ((att.x - def.x) * def.facing) < 0;      // attacker behind def
  var blocked = def.blocking && !awayFacing && def.state !== 'attack';

  // Perfect parry: guard raised in the last fifth of a second before impact.
  if(blocked && def.isPlayer && def.parryT > 0 && att.state === 'attack'){
    def.parryT = 0; def.invuln = 0.30;
    def.rage = clamp(def.rage + 26, 0, 100);
    def.stam = clamp(def.stam + 18, 0, def.maxStam);
    att.state = 'hit'; att.hitT = 0.46; att.atk = null;
    att.vx += def.facing * 260;
    var ps = screenOf(att);
    popNum(ps.x, ps.y - 120, 'PARRY!', 'crit');
    burst(ps.x, ps.y - 80, 14, '#8fd3ff', 340);
    ring(ps.x, ps.y - 80, '#bfe8ff', 12, 96, 0.40);
    Sfx.block(); Sfx.ok(); haptic(30);
    shake = Math.max(shake, 12); hitstop = Math.max(hitstop, 0.09);
    bump('parries');
    return;
  }

  var mult = att.isPlayer ? (1 + (save.up[a.fam || 'box'] || 0) * 0.10) : 1;
  var dmg = a.dmg * att.pow * mult * rand(0.92, 1.10);
  if(blocked) dmg *= 0.20;
  dmg = Math.max(1, Math.round(dmg));

  var sp = screenOf(def);
  var hx = sp.x + def.facing * -14, hy = sp.y - 84 * sp.s;

  if(blocked){
    Sfx.block();
    burst(hx, hy, 6, '#8fd3ff', 190);
    ring(hx, hy, '#8fd3ff', 8, 40, 0.22);
    popNum(hx, hy - 14, 'BLOCK', 'dmg');
    def.stam -= 14;
    def.vx += (att.facing) * a.push * 0.30;
    shake = Math.max(shake, 5);
  } else {
    def.hp -= dmg;
    def.flash = 0.09;
    def.vx += att.facing * a.push;
    def.state = 'hit';
    def.hitT = a.heavy ? 0.34 : 0.22;
    def.atk = null;
    var dir = att.facing > 0 ? 0 : Math.PI;
    burst(hx, hy, a.heavy ? 10 : 6, a.heavy ? C.gold : '#ffd9a0', a.heavy ? 300 : 210);
    streak(hx, hy, a.heavy ? 12 : 7, a.heavy ? '#fff3c4' : '#ffe6bb', a.heavy ? 620 : 420, dir);
    ring(hx, hy, a.heavy ? '#fff0b8' : 'rgba(255,235,190,.9)',
         a.heavy ? 10 : 7, a.heavy ? 74 : 46, a.heavy ? 0.34 : 0.24);
    popNum(hx, hy - 18, dmg, a.heavy ? 'crit' : 'dmg');
    Sfx[a.sfx === 'kick' ? 'kick' : 'punch']();
    Sfx.hurt();
    haptic(def.isPlayer ? (a.heavy ? 48 : 24) : (a.heavy ? 20 : 10));
    shake = Math.max(shake, a.heavy ? 13 : 7);
    hitstop = Math.max(hitstop, a.heavy ? 0.075 : 0.04);
    punchIn(a.heavy ? 1 : 0.45, hx - (G.fight ? G.fight.camX : 0), hy);

    if(att.isPlayer){
      att.rage = clamp(att.rage + dmg * 0.85, 0, 100);
      att.combo++; att.comboT = 1.7;
      var F = G.fight;
      if(F && att.combo > F.bestCombo) F.bestCombo = att.combo;
    } else if(def.isPlayer){
      def.rage = clamp(def.rage + dmg * 0.55, 0, 100);
      def.combo = 0;
    }

    var kdChance = (def.kind === 'boss' || def.kind === 'saqr') ? 0.12 : 0.45;
    if(def.hp <= 0 || (a.heavy && chance(kdChance)) || a.multi){
      def.state = 'down';
      def.downT = def.hp <= 0 ? 1.05 : 0.85;
      def.vx += att.facing * a.push * 0.8;
      Sfx.down();
      shake = Math.max(shake, 16);
    }
  }
  if(def.hp < 0) def.hp = 0;
}

/* ------------------------------------------------------------------ helpers */
function nearest(f, list){
  var best = null, bd = 1e9;
  for(var i=0;i<list.length;i++){
    var e = list[i];
    if(!e || e.dead) continue;
    var d = Math.abs(e.x - f.x) + Math.abs(e.z - f.z) * 260;
    if(d < bd){ bd = d; best = e; }
  }
  return best;
}
function faceNearest(f, list){
  var n = nearest(f, list);
  if(n && Math.abs(n.x - f.x) > 8) f.facing = n.x > f.x ? 1 : -1;
}
function separate(list){
  for(var i=0;i<list.length;i++){
    for(var j=i+1;j<list.length;j++){
      var a = list[i], b = list[j];
      if(a.dead || b.dead || a.state === 'down' || b.state === 'down') continue;
      var dx = b.x - a.x, dz = b.z - a.z;
      if(Math.abs(dx) < 62 && Math.abs(dz) < 0.13){
        var push = (62 - Math.abs(dx)) * 0.55;
        var s = dx >= 0 ? 1 : -1;
        a.x -= s * push * 0.5; b.x += s * push * 0.5;
        var sz = dz >= 0 ? 1 : -1;
        a.z = clamp(a.z - sz * 0.018, 0, 1);
        b.z = clamp(b.z + sz * 0.018, 0, 1);
      }
    }
  }
}

/* --------------------------------------------------------------- player step */
function nextPunch(p){
  if(p.chainT > 0) p.chainStep = (p.chainStep + 1) % 3;
  else p.chainStep = 0;
  p.chainT = 0.95;
  return ['jab','cross','hook'][p.chainStep];
}

function updatePlayer(p, dt, enemies, F){
  p.anim += dt;
  if(p.flash > 0) p.flash -= dt;
  if(p.invuln > 0) p.invuln -= dt;
  if(p.chainT > 0) p.chainT -= dt;
  p.comboT -= dt;
  if(p.comboT <= 0) p.combo = 0;

  if(p.state === 'down'){
    p.downT -= dt; p.vx *= Math.pow(0.03, dt); p.moving = false;
    if(p.downT <= 0){
      if(p.hp <= 0){ p.dead = true; }
      else { p.state = 'idle'; p.invuln = 0.9; }
    }
  } else if(p.state === 'hit'){
    p.hitT -= dt; p.vx *= Math.pow(0.05, dt); p.moving = false;
    if(p.hitT <= 0) p.state = 'idle';
  } else if(p.state === 'dash'){
    p.dashT -= dt; p.moving = true;
    if(p.dashT <= 0){ p.state = 'idle'; p.invuln = 0.06; }
  } else if(p.state === 'attack'){
    advanceAttack(p, dt, enemies);
  } else {
    var wasBlocking = p.blocking;
    p.blocking = In.hold.block > 0 && p.stam > 3;
    if(p.blocking && !wasBlocking) p.parryT = 0.20;   // parry window opens on press
    if(p.parryT > 0) p.parryT -= dt;
    if(p.blocking) p.stam -= 13 * dt;

    var speed = p.spd * (p.blocking ? 0.38 : 1);
    p.vx = In.ax * speed;
    p.vz = In.az * speed * 0.0046;
    p.moving = (Math.abs(In.ax) > 0.14 || Math.abs(In.az) > 0.14);
    if(In.ax >  0.16) p.facing =  1;
    if(In.ax < -0.16) p.facing = -1;

    var mag = Math.abs(In.ax) + Math.abs(In.az);
    if(In.tap.block && mag > 0.35 && p.stam >= 14){
      var leap = hasAbility('dashleap');
      p.stam -= 14; p.state = 'dash';
      p.dashT = leap ? 0.32 : 0.24; p.invuln = leap ? 0.34 : 0.26;
      p.vx = In.ax * p.spd * (leap ? 3.4 : 2.6);
      p.vz = In.az * p.spd * 0.011;
      if(leap) burst(p.x, FLOOR_TOP + p.z*FLOOR_H, 6, 'rgba(255,233,168,.7)', 120);
      Sfx.whoosh();
    } else if(In.tap.special && p.rage >= 100){
      faceNearest(p, enemies);
      if(startAttack(p, 'special')){ p.rage = 0; p.invuln = 0.55; Sfx.power(); flashScreen = 1; }
    } else if(In.tap.punch){
      faceNearest(p, enemies);
      startAttack(p, nextPunch(p));
    } else if(In.tap.kick){
      faceNearest(p, enemies);
      var n = nearest(p, enemies);
      var close = n && Math.abs(n.x - p.x) < 56;
      startAttack(p, close ? 'knee' : 'kick');
    }
  }

  p.stam = clamp(p.stam + (p.blocking ? 3 : 24 + save.up.stam * 2.4) * dt, 0, p.maxStam);
  p.mp = clamp(p.mp + ASSET_AHMED.mpRegen.idle * dt, 0, p.maxMp);
  // Ease the flame rather than snapping it the frame MP crosses the cost.
  var want = hawkReady(p) ? 1 : 0;
  p.hawkLit = approach(p.hawkLit || 0, want, dt * 4.5);
  p.x += p.vx * dt;
  p.z = clamp(p.z + p.vz * dt, 0, 1);
}

/* ---------------------------------------------------------------- enemy step */
function updateEnemy(e, dt, p, tokens){
  e.anim += dt;
  var isBoss = (e.kind === 'boss' || e.kind === 'saqr');
  if(isBoss && e.phase !== 2 && e.hp <= e.maxHp * 0.5){
    e.phase = 2;
    e.pow *= 1.28; e.spd *= 1.20; e.rate *= 0.70;
    e.moves = ['jab','cross','hook','kick','knee','special'];
    e.col = { skin:e.col.skin, top:'#3a0d14', bottom:'#12151b', band:'#ff2d4d' };
    e.invuln = 0.7; e.flash = 0.45; e.state = 'idle'; e.atk = null;
    var bs = screenOf(e);
    popNum(bs.x, bs.y - 150, 'ENRAGED', 'crit');
    burst(bs.x, bs.y - 70, 26, C.bad, 380);
    flashScreen = 1; shake = 22; Sfx.power(); haptic(90);
  }
  if(e.flash > 0) e.flash -= dt;
  if(e.invuln > 0) e.invuln -= dt;
  if(e.guardT > 0) e.guardT -= dt; else { e.guardT = rand(0.4, 1.1); e.guardRoll = Math.random(); }

  if(e.state === 'down'){
    e.downT -= dt; e.vx *= Math.pow(0.03, dt); e.moving = false; e.blocking = false;
    if(e.downT <= 0){
      if(e.hp <= 0) e.dead = true;
      else { e.state = 'idle'; e.invuln = 0.35; e.cd = rand(0.3, 0.8); }
    }
  } else if(e.state === 'hit'){
    e.hitT -= dt; e.vx *= Math.pow(0.06, dt); e.moving = false; e.blocking = false;
    if(e.hitT <= 0) e.state = 'idle';
  } else if(e.state === 'attack'){
    advanceAttack(e, dt, [p]);
  } else {
    e.cd -= dt;
    if(e.tele > 0) e.tele -= dt;
    var dx = p.x - e.x, dz = p.z - e.z;
    e.facing = dx >= 0 ? 1 : -1;
    var adx = Math.abs(dx);
    var inRange = adx < e.reach * 0.95 && Math.abs(dz) < 0.13;

    e.blocking = (p.state === 'attack' && adx < 120 && e.guardRoll < e.guard);

    if(inRange && e.cd <= 0 && tokens > 0 && p.state !== 'down'){
      startAttack(e, pick(e.moves));
      e.cd = e.rate * rand(0.75, 1.45);
      if(e.hitRun) e.retreat = rand(0.7, 1.2);
      e.moving = false;
      return true;
    }
    if(e.retreat > 0) e.retreat -= dt;
    var wantX = p.x + e.side * (e.reach * 0.70 + e.lane);
    if(e.retreat > 0) wantX = p.x + e.side * 330;      // hit-and-run: back off
    var F = G.fight;
    if(F && F.lockX !== null && (wantX < F.minX + 24 || wantX > F.maxX - 24)){
      e.side = -e.side;
      wantX = p.x + e.side * (e.reach * 0.70 + e.lane);
    }
    var wantZ = clamp(p.z + e.orbit, 0, 1);
    if(adx > 480) e.lane = 0;              // far away: just close the distance
    var sp = e.spd * (e.blocking ? 0.4 : 1);
    var tx = clamp((wantX - e.x) * 3.2, -sp, sp);
    e.vx = approach(e.vx, tx, sp * 6 * dt);
    e.vz = clamp((wantZ - e.z) * 2.4, -0.85, 0.85);
    e.moving = Math.abs(e.vx) > 16 || Math.abs(e.vz) > 0.10;
  }
  e.x += e.vx * dt;
  e.z = clamp(e.z + e.vz * dt, 0, 1);
  return false;
}

/* ==========================================================================
   BREAKABLE PROPS + PICKUPS
   Crates and barrels line the streets. Smash them for food (health) and
   rage orbs, so exploring the stage pays for itself.
   ========================================================================== */
function buildProps(st, idx){
  var out = [];
  if(st.survival) return out;
  var seed = (idx + 1) * 7;                    // each stage gets its own layout
  for(var x = 430; x < st.len - 160; x += 265){
    if(hashv(x, seed + 31) < 0.30) continue;
    out.push({
      x: x + hashv(x, seed + 32) * 110,
      z: 0.16 + hashv(x, seed + 33) * 0.72,
      kind: hashv(x, seed + 34) < 0.5 ? 'crate' : 'barrel',
      hp: 2, broken:false, t:0, shakeT:0
    });
  }
  return out;
}
var WEAPON_KEYS = Object.keys(ASSET_WEAPONS);
function dropItem(F, x, z, forced){
  var roll = Math.random();
  var kind = forced || (roll < 0.42 ? 'food'
                      : roll < 0.68 ? 'rage'
                      : roll < 0.84 ? 'weapon' : null);
  if(!kind) return;
  var it = { x:x, z:z, h:46, vh:150, kind:kind, life:16, t:0 };
  if(kind === 'weapon') it.wep = pick(WEAPON_KEYS);
  F.items.push(it);
}

/* Armed punches. The ATK entries are shared, so a swing gets its own copy
   rather than the weapon quietly rewriting the table for everyone. */
function armedAttack(f, a){
  if(!f.weapon || a.fam !== 'box' || a.multi) return a;
  var W = ASSET_WEAPONS[f.weapon.key];
  return { fam:a.fam, dmg:a.dmg * W.dmg, su:a.su, ac:a.ac, rc:a.rc + 0.03,
           reach:a.reach + W.reach, push:a.push + W.push, stam:a.stam,
           sfx:a.sfx, arm:a.arm, heavy:true, wep:true };
}
/* HAWK FIST. Punches only — kicks stay cold — and every lit swing burns MP,
   so it is a resource you spend rather than a permanent damage upgrade. */
function hawkReady(f){
  if(!f.isPlayer || !hasAbility('hawk')) return false;
  return f.mp >= ABILITIES.hawk.mp;
}
function hawkAttack(f, a){
  if(a.fam !== 'box' || !hawkReady(f)) return a;
  return { fam:a.fam, dmg:a.dmg * 1.55, su:a.su, ac:a.ac, rc:a.rc,
           reach:a.reach + 10, push:a.push + 90, stam:a.stam,
           sfx:a.sfx, arm:a.arm, heavy:a.heavy, multi:a.multi,
           wep:a.wep, hawk:true };
}

function breakWeapon(f){
  var sp = screenOf(f);
  burst(sp.x, sp.y - 80, 16, '#c9d2de', 300);
  popNum(sp.x, sp.y - 130, 'BROKE', 'crit');
  Sfx.hurt(); haptic(25);
  f.weapon = null;
}
function checkPropHit(f, a){
  var F = G.fight;
  if(!F || !f.isPlayer) return;
  for(var i=0;i<F.props.length;i++){
    var pr = F.props[i];
    if(pr.broken || f.hitProps.indexOf(pr) >= 0) continue;
    var dx = (pr.x - f.x) * f.facing, dz = Math.abs(pr.z - f.z);
    if(dx > -40 && dx < a.reach + 40 && dz < 0.22){
      f.hitProps.push(pr);
      pr.hp--; pr.shakeT = 0.18;
      var sp = FLOOR_TOP + pr.z*FLOOR_H;
      Sfx.thud(pr.kind === 'crate' ? 700 : 340, 0.12, 1.1, 0.30);
      shake = Math.max(shake, 6);
      if(pr.hp <= 0){
        pr.broken = true;
        bump('crates');
        burst(pr.x, sp - 30, 16, pr.kind === 'crate' ? '#b0834a' : '#7d8794', 300);
        dropItem(F, pr.x, pr.z);
      } else {
        burst(pr.x, sp - 30, 6, '#d8c39a', 180);
      }
    }
  }
}
function updateItems(F, dt){
  var p = F.player;
  for(var i=F.items.length-1;i>=0;i--){
    var it = F.items[i];
    it.t += dt; it.life -= dt;
    if(it.h > 0 || it.vh > 0){
      it.vh -= 620*dt; it.h += it.vh*dt;
      if(it.h <= 0){ it.h = 0; it.vh = 0; }
    }
    var near = Math.abs(it.x - p.x) < 52 && Math.abs(it.z - p.z) < 0.20 &&
               p.state !== 'down' && !p.dead;
    if(near){
      var sp = screenOf(p);
      if(it.kind === 'weapon'){
        var W = ASSET_WEAPONS[it.wep];
        p.weapon = { key:it.wep, uses:W.uses, max:W.uses };
        popNum(sp.x, sp.y - 130, W.n, 'crit');
        toast(W.n, W.ar, 'PICKED UP');
      } else if(it.kind === 'food'){
        var heal = Math.round(p.maxHp * 0.28);
        p.hp = Math.min(p.maxHp, p.hp + heal);
        popNum(sp.x, sp.y - 130, heal, 'heal');
      } else {
        p.rage = clamp(p.rage + 45, 0, 100);
        popNum(sp.x, sp.y - 130, 'RAGE', 'crit');
      }
      burst(it.x, FLOOR_TOP + it.z*FLOOR_H - 20, 12,
            it.kind === 'food' ? C.hp : it.kind === 'weapon' ? '#c9d2de' : '#e05cf0', 220);
      Sfx.ok();
      F.items.splice(i, 1);
      continue;
    }
    if(it.life <= 0) F.items.splice(i, 1);
  }
}
/* A box lit by the rig: key down one side, fill on the other, rim on the
   shadow edge. Props shaded by a different rule than the fighters standing
   next to them is the fastest way to make a scene look assembled rather than
   lit, so they answer to the same lights. */
function litBox(x, y, w, h, r, col, gloss){
  var lx = LIGHT.x >= 0 ? x + w : x, rx = LIGHT.x >= 0 ? x : x + w;
  var L = litOf(col);
  var g = ctx.createLinearGradient(lx, y, rx, y + h*0.35);
  g.addColorStop(0,    L.key);
  g.addColorStop(0.45, col);
  g.addColorStop(0.84, L.core);
  g.addColorStop(1,    L.rimS1);
  roundRect(x, y, w, h, r); ctx.fillStyle = g; ctx.fill();
  if(gloss && GFX_HIGH){
    // one tight specular band along the lit edge
    ctx.save(); roundRect(x, y, w, h, r); ctx.clip();
    ctx.globalAlpha = 0.30 * RIG.key.power;
    ctx.fillStyle = RIG.key.col;
    ctx.fillRect(LIGHT.x >= 0 ? x + w - w*0.16 : x, y + h*0.06, w*0.16, h*0.72);
    ctx.restore(); ctx.globalAlpha = 1;
  }
}

function drawProp(pr, camX){
  var s = 0.94 + pr.z*0.40;
  var X = pr.x - camX, Y = FLOOR_TOP + pr.z*FLOOR_H;
  if(pr.shakeT > 0) X += rand(-3, 3);
  var off = GFX_HIGH ? -LIGHT.x * 20 * s : 0;
  ctx.globalAlpha = 0.15; ctx.fillStyle = GFX_HIGH ? shade(RIG.fill.col, -0.72) : '#000';
  ctx.beginPath(); ctx.ellipse(X + off, Y+4, 32*s, 10*s, 0, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 0.28; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(X, Y+3, 20*s, 6*s, 0, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.save(); ctx.translate(X, Y); ctx.scale(s, s);
  if(pr.kind === 'crate'){
    if(GFX_HIGH) litBox(-26, -50, 52, 50, 5, '#8a6236');
    else { ctx.fillStyle = '#8a6236'; roundRect(-26, -50, 52, 50, 5); ctx.fill(); }
    ctx.strokeStyle = '#5e4224'; ctx.lineWidth = 4;
    roundRect(-26, -50, 52, 50, 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-24,-48); ctx.lineTo(24,-2);

  } else {
    if(GFX_HIGH) litBox(-22, -56, 44, 56, 12, '#5d6874', true);
    else { ctx.fillStyle = '#5d6874'; roundRect(-22, -56, 44, 56, 12); ctx.fill(); }
    ctx.fillStyle = 'rgba(0,0,0,.25)'; roundRect(-22, -56, 12, 56, 12); ctx.fill();
    ctx.fillStyle = C.red; ctx.fillRect(-22, -40, 44, 8);
    ctx.fillStyle = C.green; ctx.fillRect(-22, -22, 44, 8);
  }
  ctx.restore();
}
function drawItem(it, camX){
  var s = 0.90 + it.z*0.40;
  var X = it.x - camX, Y = FLOOR_TOP + it.z*FLOOR_H - it.h - 14*s;

  ctx.globalAlpha = 0.22; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(X, FLOOR_TOP + it.z*FLOOR_H + 2, 14*s, 5*s, 0, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = fade;
  ctx.save(); ctx.translate(X, Y + bob); ctx.scale(s, s);
  ctx.globalAlpha = fade * 0.30;
  var glow = it.kind === 'food' ? C.hp : it.kind === 'weapon' ? '#c9d2de' : '#e05cf0';
  ctx.fillStyle = glow;
  circle(0, 0, 26 + Math.sin(it.t*6)*4); ctx.fill();
  ctx.globalAlpha = fade;
  ctx.fillStyle = 'rgba(8,10,16,.78)';
  circle(0, 0, 19); ctx.fill();
  ctx.strokeStyle = glow;
  ctx.lineWidth = 3;
  circle(0, 0, 19); ctx.stroke();
  if(it.kind === 'weapon'){
    ctx.save(); ctx.scale(0.78, 0.78);          // sit inside the pickup badge
    weaponInHand(0, 0, -0.62, it.wep);
    ctx.restore();
  } else if(it.kind === 'food'){
    // grilled skewer
    ctx.fillStyle = '#e6d9b8'; roundRect(-2.5, -15, 5, 30, 3); ctx.fill();
    ctx.fillStyle = '#b85f30';
    circle(0, -7, 6.5); ctx.fill(); circle(0, 3, 6.5); ctx.fill(); circle(0, 12, 5.5); ctx.fill();
  } else {
    ctx.fillStyle = '#e05cf0';
    ctx.beginPath();
    ctx.moveTo(0,-14); ctx.lineTo(10,0); ctx.lineTo(0,14); ctx.lineTo(-10,0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(4,0); ctx.lineTo(0,7); ctx.lineTo(-4,0);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ==========================================================================
   GATES
   Each stage hides one route behind an ability. Nothing here blocks the way
   forward — the gate is set into the back wall — so a stage is always
   completable, and finding an ability sends you back through old stages.
   ========================================================================== */
function openGate(F, g){
  g.open = true; g.flash = 0.6;
  save.gates[gateKey(F.idx, g.at)] = 1;
  var y = FLOOR_TOP + GATE_Z*FLOOR_H;
  burst(g.at, y - 44, 26, C.gold, 340);
  ring(g.at, y - 44, '#ffe9a8', 12, 118, 0.45);
  shake = Math.max(shake, 18); flashScreen = 0.55; punchIn(1.25, W/2, H*0.5);
  Sfx.power(); haptic(60);
  if(g.reward && g.reward.ability){
    var A = ABILITIES[g.reward.ability];
    if(grantAbility(g.reward.ability)) toast(A.n, A.ar, 'TALENT FOUND');
    if(g.reward.xp) grantXp(g.reward.xp);
  } else if(g.reward && g.reward.xp){
    grantXp(g.reward.xp);
    popNum(g.at, y - 130, '+' + g.reward.xp, 'heal');
  }
  writeSave();
  checkAchievements();
}
function updateGates(F, dt){
  var p = F.player;
  for(var i=0;i<F.gates.length;i++){
    var g = F.gates[i];
    if(g.flash > 0) g.flash -= dt;
    if(g.open){ g.near = false; continue; }
    var spec = GATES[g.type];
    g.near = Math.abs(p.x - g.at) < 74 && Math.abs(p.z - GATE_Z) < 0.26;
    g.can = !spec.need || hasAbility(spec.need);
    if(g.near && g.can && !spec.breakBy){
      g.t += dt;
      if(g.t > 0.45) openGate(F, g);
    } else if(!g.near) g.t = 0;
  }
}
/* Shutters and walls come down to the right kind of strike. */
function checkGateHit(f, a){
  var F = G.fight;
  if(!F || !f.isPlayer || !F.gates) return;
  for(var i=0;i<F.gates.length;i++){
    var g = F.gates[i];
    if(g.open) continue;
    var spec = GATES[g.type];
    if(!spec.breakBy || spec.breakBy !== a.fam) continue;
    if(!hasAbility(spec.need)) continue;
    if(f.hitGates.indexOf(g) >= 0) continue;
    var dx = (g.at - f.x) * f.facing, dz = Math.abs(GATE_Z - f.z);
    if(dx > -46 && dx < a.reach + 54 && dz < 0.30){
      f.hitGates.push(g);
      g.hp = (g.hp || 0) + 1;
      g.flash = 0.18;
      var y = FLOOR_TOP + GATE_Z*FLOOR_H;
      burst(g.at, y - 40, 10, g.type === 'shutter' ? '#c9d3e0' : '#c2a882', 260);
      shake = Math.max(shake, 9);
      Sfx.thud(g.type === 'shutter' ? 520 : 300, 0.15, 1.1, 0.34);
      if(g.hp >= 3) openGate(F, g);
    }
  }
}

function drawGate(g, camX){

  if(g.type === 'stash' || g.type === 'shutter'){

    if(!g.open){

      ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1.6;

  } else if(g.type === 'wall'){

    {
      ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 1.6;
      for(var bk=0;bk<5;bk++){

      }

        ctx.beginPath();
        ctx.moveTo(-4, -74); ctx.lineTo(3, -54); ctx.lineTo(-6, -34);
        ctx.lineTo(4, -14); ctx.lineTo(-2, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(3, -54); ctx.lineTo(16, -46); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-6, -34); ctx.lineTo(-19, -28); ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(4,6,10,.92)';
        ctx.beginPath();
        ctx.moveTo(-18, 0); ctx.lineTo(-14, -52); ctx.lineTo(2, -66);
        ctx.lineTo(18, -50); ctx.lineTo(16, 0); ctx.closePath(); ctx.fill();
      }
    }
  } else if(g.type === 'ledge'){
    litShape(function(){ roundRect(-40, -44, 80, 44, 4); }, '#6d5f4a', 0, -22, 44);
    ctx.fillStyle = 'rgba(255,255,255,.12)';

    litShape(function(){ roundRect(28, -30, 44, 30, 3); }, '#5d5648', 50, -15, 30);
  }

  if(!g.open && g.reward){
    var bobY = (g.type === 'gap') ? -44 : (g.type === 'ledge' ? -60 : -56);
    bobY += Math.sin(gameTime*3)*3;

  ctx.restore();

  if(g.near && !g.open){

      ? (spec.breakBy ? (spec.breakBy === 'kick' ? 'KICK IT DOWN' : 'PUNCH THROUGH') : 'CLIMBING…')
      : spec.how;
    ctx.fillStyle = 'rgba(6,8,14,.85)';
    roundRect(X - 130, Y - 134, 260, 44, 8); ctx.fill();
    txt(label, X, Y - 121, 17, g.can ? C.gold : C.bad, 'center', 900);
    txt(spec.n + '  ·  ' + spec.ar, X, Y - 101, 13, 'rgba(255,255,255,.65)', 'center', 700);
  }
}

/* ------------------------------------------------------------- wave handling */
function spawnWave(F, wave){
  var camX = F.camX;
  var list = [];
  for(var i=0;i<wave.e.length;i++){
    var type = wave.e[i][0], n = wave.e[i][1];
    for(var k=0;k<n;k++) list.push(type);
  }
  for(var j=0;j<list.length;j++){
    var fromRight = (j % 3 !== 2);
    var x = fromRight ? camX + W + 50 + j*54 : camX - 70 - j*40;
    var tier = (wave.tier !== undefined) ? wave.tier : F.st.tier;
    var e = makeEnemy(list[j], x, rand(0.24, 0.94), tier);
    e.hitRun = !!TYPES[list[j]].hitRun;
    e.side = (j % 2 === 0) ? 1 : -1;
    e.lane = (j >> 1) * 30;
    e.orbit = rand(-0.26, 0.26);
    e.guard = TYPES[list[j]].wall ? 0.62
            : (list[j] === 'thug') ? 0.12
            : (list[j] === 'boss' || list[j] === 'saqr') ? 0.40 : 0.24;
    e.guardT = rand(0, 1); e.guardRoll = 1;
    e.cd = rand(0.4, 1.4);
    F.enemies.push(e);
  }
  if(list.indexOf('boss') >= 0 || list.indexOf('saqr') >= 0) Sfx.ko();
}

var RANK_ORDER = ['S','A','B','C'];
function rankFor(F){
  var hpR = F.player.hp / F.player.maxHp;
  var score = F.kills*12 + F.bestCombo*22 + hpR*320 - F.time*1.1;
  score *= (0.8 + save.diff * 0.2);          // harder difficulty ranks easier
  return score > 620 ? 'S' : score > 470 ? 'A' : score > 330 ? 'B' : 'C';
}
function rankColor(r){
  return r === 'S' ? '#e05cf0' : r === 'A' ? C.gold : r === 'B' ? C.hp : C.dim;
}

function updateFight(dt){
  var F = G.fight;
  if(!F) return;
  var p = F.player, st = F.st;
  F.time += dt;
  if(F.sealT > 0) F.sealT -= dt;

  // --- camera / wave gating ------------------------------------------------
  var wave = F.waveIdx < F.waves.length ? F.waves[F.waveIdx] : null;
  if(wave && F.lockX === null && (wave.at < 0 || p.x > wave.at)){
    F.lockX = F.camX;
    spawnWave(F, wave);
  }
  if(F.lockX !== null){
    var alive = 0;
    for(var i=0;i<F.enemies.length;i++) if(!F.enemies[i].dead) alive++;
    if(alive === 0){
      F.lockX = null; F.waveIdx++; Sfx.ok();
      G.slow = 0.55;                              // brief slow-mo on the last KO
      if(st.survival){
        F.survWave++;
        F.waves.push(genSurvivalWave(F.survWave));
        if(F.survWave > save.survBest){ save.survBest = F.survWave; writeSave(); }
        dropItem(F, p.x + 120, clamp(p.z, 0.1, 0.9), F.survWave % 3 === 0 ? 'food' : null);
      }
    }
  }

  F.minX = (F.lockX !== null) ? F.lockX + 70 : 40;
  F.maxX = (F.lockX !== null) ? F.lockX + W - 250 : st.len;

  // --- update actors -------------------------------------------------------
  var attacking = 0;
  for(i=0;i<F.enemies.length;i++) if(F.enemies[i].state === 'attack') attacking++;
  var tokens = Math.max(0, 2 - attacking);

  updatePlayer(p, dt, F.enemies, F);
  for(i=0;i<F.enemies.length;i++){
    var e = F.enemies[i];
    if(e.dead) continue;
    if(updateEnemy(e, dt, p, tokens)) tokens--;
  }

  // --- bounds --------------------------------------------------------------
  var minX = F.minX, maxX = F.maxX;
  p.x = clamp(p.x, minX, maxX);
  p.z = clamp(p.z, 0.04, 0.98);
  for(i=0;i<F.enemies.length;i++){
    var en = F.enemies[i];
    if(en.dead) continue;
    if(F.lockX === null) continue;
    if(!en.entered && en.x > F.lockX + 30 && en.x < F.lockX + W - 30) en.entered = true;
    if(en.entered) en.x = clamp(en.x, minX, maxX);
    else en.x = Math.max(en.x, minX - 300);
    en.z = clamp(en.z, 0.04, 0.98);
  }
  separate([p].concat(F.enemies.filter(function(q){ return !q.dead; })));

  // --- props, pickups, footfall dust ---------------------------------------
  for(i=0;i<F.props.length;i++) if(F.props[i].shakeT > 0) F.props[i].shakeT -= dt;
  updateItems(F, dt);
  updateGates(F, dt);
  if(p.moving && p.state !== 'down' && chance(dt * 9))
    burst(p.x, FLOOR_TOP + p.z*FLOOR_H, 1, 'rgba(255,255,255,.45)', 40);

  // --- collect kills -------------------------------------------------------
  for(i=F.enemies.length-1;i>=0;i--){
    var d = F.enemies[i];
    if(d.dead && !d.counted){
      d.counted = true;
      F.kills++; F.xp += d.xp; bump('kills');
      var s = screenOf(d);
      burst(s.x, s.y - 50, 18, C.gold, 300);
      popNum(s.x, s.y - 110, '+' + d.xp, 'heal');
      Sfx.ok();
      if(chance((d.kind === 'boss' || d.kind === 'saqr') ? 1 : 0.16)) dropItem(F, d.x, d.z);
    }
  }
  F.enemies = F.enemies.filter(function(q){ return !(q.dead && q.downT <= -1.4); });
  for(i=0;i<F.enemies.length;i++) if(F.enemies[i].dead) F.enemies[i].downT -= dt;

  // --- camera --------------------------------------------------------------
  var target = (F.lockX !== null) ? F.lockX : clamp(p.x - W * 0.42, 0, Math.max(0, st.len - W + 260));
  F.camX = lerp(F.camX, target, 1 - Math.pow(0.0015, dt));

  // --- outcomes ------------------------------------------------------------
  if(p.dead && !F.done){
    F.done = true;
    if(st.survival){
      F.reached = F.survWave;
      grantXp(F.xp);
      if(F.survWave - 1 > save.survBest) save.survBest = F.survWave - 1;
      writeSave();
    }
    G.state = 'gameover'; G.endT = 0;
    Music.stop(); Sfx.ko();
    checkAchievements();
  }
  // Clearing an area is a beat, not a screen — you keep walking. Only the
  // last fight in the world stops play.
  if(!F.done && !st.survival && F.waveIdx >= F.waves.length && !F.banked){
    F.banked = true;
    var first = !areaCleared(F.idx);
    var bonus = 60 + F.bestCombo * 8 + Math.round(p.hp / p.maxHp * 90);
    F.bonus = bonus;
    if(first){
      grantXp(F.xp + bonus);
      save.cleared.push(F.idx);
      bump('clears'); bump('time', Math.round(F.time));
      if(save.diff === 2) bump('champClears');
    }
    if(F.bestCombo > save.best) save.best = F.bestCombo;
    F.rank = rankFor(F);
    var prev = save.ranks[F.idx];
    if(!prev || RANK_ORDER.indexOf(F.rank) < RANK_ORDER.indexOf(prev)) save.ranks[F.idx] = F.rank;
    save.unlocked = Math.min(CAMPAIGN, Math.max(save.unlocked, save.visited.length));
    writeSave();
    checkAchievements();
    if(F.idx === CAMPAIGN - 1){
      F.done = true;
      G.state = 'victory'; G.endT = 0;
      Music.stop(); Sfx.power();
    } else if(first){
      toast('AREA CLEAR · RANK ' + F.rank, st.ar, st.name);
      Sfx.power();
    }
  }

  // --- area edges and doors -------------------------------------------------
  if(!F.done && !st.survival) checkEdges(F, p, st);
}

/* Draws each way out of the area at its own position. A sealed one names the
   talent it wants, so the player learns what to look for rather than only
   that the door is shut. */
function drawWays(F){
  var links = areaLinks(F.idx), st = F.st;
  var ready = F.waveIdx >= F.waves.length;
  var sides = [['e', st.len + 40], ['w', 0], ['d', links.d ? links.d.at : 0]];
  for(var i = 0; i < sides.length; i++){
    var key = sides[i][0], link = links[key];
    if(!link) continue;
    if(key !== 'w' && !ready) continue;             // the far side stays shut
    var gx = sides[i][1] - F.camX;
    if(gx < -220 || gx > W + 220) continue;
    var open = linkOpen(link);
    var col = open ? '237,190,87' : '150,158,172';
    ctx.globalAlpha = (open ? 0.45 + Math.sin(gameTime*4)*0.2 : 0.30);
    var g = ctx.createLinearGradient(gx-60, 0, gx+60, 0);
    g.addColorStop(0, 'rgba(' + col + ',0)');
    g.addColorStop(0.5, 'rgba(' + col + ',.9)');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = g;
    ctx.fillRect(gx-60, FLOOR_TOP-190, 120, 380);
    ctx.globalAlpha = 1;
    var name = STAGES[link.to] ? STAGES[link.to].name : '';
    if(open){
      txtLS(key === 'w' ? '\u2190' : (key === 'd' ? '\u2193' : '\u2192'),
            gx, FLOOR_TOP-230, UI.t.head, UI.gold, 'center', 900, 0);
      txtLS(name, gx, FLOOR_TOP-204, UI.t.micro, UI.gold, 'center', 800, 2);
    } else {
      var A = ABILITIES[link.needs];
      txtLS('SEALED', gx, FLOOR_TOP-228, UI.t.label, 'rgba(198,206,220,.9)', 'center', 900, 2);
      txtLS('NEEDS ' + (A ? A.n : '?'), gx, FLOOR_TOP-206, UI.t.micro,
            'rgba(198,206,220,.7)', 'center', 800, 1.6);
    }
  }
}

/* Walking into an edge or a door. A route you cannot pass says what it wants
   and pushes you back a step, so a sealed way reads as a lock rather than an
   invisible wall. */
function checkEdges(F, p, st){
  var links = areaLinks(F.idx);
  var use = null, side = null;
  if(links.e && p.x >= st.len - 90) { use = links.e; side = 'e'; }
  else if(links.w && p.x <= 70)     { use = links.w; side = 'w'; }
  else if(links.d && Math.abs(p.x - links.d.at) < 60) { use = links.d; side = 'd'; }
  if(!use) return;

  // Waves have to be down before an area lets you out of its far side.
  if(side !== 'w' && F.waveIdx < F.waves.length) return;

  if(!linkOpen(use)){
    if(F.sealT === undefined || F.sealT <= 0){
      var A = ABILITIES[use.needs];
      F.sealT = 1.6;
      if(use.needs && !hasAbility(use.needs)){
        F.sealMsg = 'SEALED — NEEDS ' + A.n; F.sealAr = A.ar;
      } else {
        F.sealMsg = 'NO WAY THROUGH YET'; F.sealAr = 'لا طريق بعد';
      }
      Sfx.hurt(); haptic(20);
    }
    p.x = side === 'w' ? 78 : (side === 'e' ? st.len - 98 : p.x - 8 * p.facing);
    return;
  }
  travelTo(use.to, side);
}

function bar(x, y, w, h, v, max, col, label){
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  roundRect(x-2, y-2, w+4, h+4, (h+4)/2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  roundRect(x, y, w, h, h/2); ctx.fill();
  var f = clamp(v/max, 0, 1);
  if(f > 0){
    ctx.fillStyle = col;
    roundRect(x, y, Math.max(h, w*f), h, h/2); ctx.fill();
  }
  if(label) txtLS(label, x - 8, y + h/2, UI.t.micro, UI.fgFaint, 'right', 800, 1.4);
}

function drawHUD(){
  var F = G.fight, p = F.player;

  // Player panel. Four resources and a rank have to be readable at a glance
  // mid-fight, so the bars are labelled in the gutter rather than inside, and
  // the level sits in the badge where a portrait would go.

  roundRect(px, py, pw, ph, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(237,190,87,.45)'; ctx.lineWidth = 2;
  roundRect(px, py, pw, ph, 12); ctx.stroke();

  var lv = playerLevel();
  ctx.fillStyle = C.red;   circle(px + 42, py + 46, 26); ctx.fill();

  circle(px + 42, py + 46, 26); ctx.stroke();
  txt(String(lv), px + 42, py + 44, UI.t.head, UI.fg, 'center', 900);
  txtLS('LV', px + 42, py + 62, UI.t.micro - 2, 'rgba(255,255,255,.72)', 'center', 800, 1.2);

  txtLS('AHMED', px + 80, py + 22, UI.t.sub, UI.fg, 'left', 900, 2);
  txt('أحمد', px + pw - 16, py + 22, UI.t.body, UI.gold, 'right', 700);

  var bx = px + 96, bw = pw - 112;
  bar(bx, py + 52, bw, 13, p.hp, p.maxHp, C.hp, 'HP');
  bar(bx, py + 71, bw, 9,  p.mp, p.maxMp, '#ff9a3c', 'MP');
  bar(bx, py + 86, bw*0.62, 7, p.stam, p.maxStam, '#59b6ff', 'ST');
  bar(bx, py + 99, bw*0.62, 7, p.rage, 100, p.rage >= 100 ? '#e05cf0' : '#7a4a90', 'RG');
  if(p.rage >= 100) txtLS('READY', bx + bw*0.62 + 10, py + 99, UI.t.micro, '#e9a7ff',
                          'left', 900, 1.6, 0.6 + Math.sin(gameTime*8)*0.4);

  // Career progress, hairline along the panel's own bottom edge.

/* ==========================================================================
   GATES
   Each stage hides one route behind an ability. Nothing here blocks the way
   forward — the gate is set into the back wall — so a stage is always
   completable, and finding an ability sends you back through old stages.
   ========================================================================== */
function openGate(F, g){
  g.open = true; g.flash = 0.6;
  save.gates[gateKey(F.idx, g.at)] = 1;
  var y = FLOOR_TOP + GATE_Z*FLOOR_H;
  burst(g.at, y - 44, 26, C.gold, 340);
  ring(g.at, y - 44, '#ffe9a8', 12, 118, 0.45);
  shake = Math.max(shake, 18); flashScreen = 0.55;
  Sfx.power(); haptic(60);
  if(g.reward && g.reward.ability){
    var A = ABILITIES[g.reward.ability];
    if(grantAbility(g.reward.ability)) toast(A.n, A.ar, 'ABILITY FOUND');
  } else if(g.reward && g.reward.xp){
    save.xp += g.reward.xp;
    popNum(g.at, y - 130, '+' + g.reward.xp, 'heal');
  }
  writeSave();
  checkAchievements();
}
function updateGates(F, dt){
  var p = F.player;
  for(var i=0;i<F.gates.length;i++){
    var g = F.gates[i];
    if(g.flash > 0) g.flash -= dt;
    if(g.open){ g.near = false; continue; }
    var spec = GATES[g.type];
    g.near = Math.abs(p.x - g.at) < 74 && Math.abs(p.z - GATE_Z) < 0.26;
    g.can = !spec.need || hasAbility(spec.need);
    if(g.near && g.can && !spec.breakBy){
      g.t += dt;
      if(g.t > 0.45) openGate(F, g);
    } else if(!g.near) g.t = 0;
  }
}
/* Shutters and walls come down to the right kind of strike. */
function checkGateHit(f, a){
  var F = G.fight;
  if(!F || !f.isPlayer || !F.gates) return;
  for(var i=0;i<F.gates.length;i++){
    var g = F.gates[i];
    if(g.open) continue;
    var spec = GATES[g.type];
    if(!spec.breakBy || spec.breakBy !== a.fam) continue;
    if(!hasAbility(spec.need)) continue;
    if(f.hitGates.indexOf(g) >= 0) continue;
    var dx = (g.at - f.x) * f.facing, dz = Math.abs(GATE_Z - f.z);
    if(dx > -46 && dx < a.reach + 54 && dz < 0.30){
      f.hitGates.push(g);
      g.hp = (g.hp || 0) + 1;
      g.flash = 0.18;
      var y = FLOOR_TOP + GATE_Z*FLOOR_H;
      burst(g.at, y - 40, 10, g.type === 'shutter' ? '#c9d3e0' : '#c2a882', 260);
      shake = Math.max(shake, 9);
      Sfx.thud(g.type === 'shutter' ? 520 : 300, 0.15, 1.1, 0.34);
      if(g.hp >= 3) openGate(F, g);
    }
  }
}

function drawGate(g, camX){

  } else if(g.type === 'wall'){
    litShape(function(){ roundRect(-30, -76, 60, 76, 3); }, '#9b8460', 0, -38, 42);
    {
      ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 1.6;
      for(var bk=0;bk<5;bk++){

      }
      if(!g.open){
        ctx.strokeStyle = 'rgba(20,14,10,.75)'; ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(-4, -74); ctx.lineTo(3, -54); ctx.lineTo(-6, -34);
        ctx.lineTo(4, -14); ctx.lineTo(-2, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(3, -54); ctx.lineTo(16, -46); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-6, -34); ctx.lineTo(-19, -28); ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(4,6,10,.92)';
        ctx.beginPath();
        ctx.moveTo(-18, 0); ctx.lineTo(-14, -52); ctx.lineTo(2, -66);
        ctx.lineTo(18, -50); ctx.lineTo(16, 0); ctx.closePath(); ctx.fill();
      }
    }
  } else if(g.type === 'ledge'){
    litShape(function(){ roundRect(-40, -44, 80, 44, 4); }, '#6d5f4a', 0, -22, 44);
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    roundRect(-38, -44, 76, 5, 2); ctx.fill();
  } else if(g.type === 'gap'){
    ctx.fillStyle = 'rgba(4,6,10,.92)';
    ctx.beginPath(); ctx.ellipse(0, -4, 46, 13, 0, 0, 6.2832); ctx.fill();
    litShape(function(){ roundRect(28, -30, 44, 30, 3); }, '#5d5648', 50, -15, 30);
  }

  if(!g.open && g.reward){
    var bobY = (g.type === 'gap') ? -44 : (g.type === 'ledge' ? -60 : -56);
    bobY += Math.sin(gameTime*3)*3;
    var px = (g.type === 'gap') ? 50 : 0;
    ctx.globalAlpha = 0.45 + Math.sin(gameTime*4)*0.2;
    ctx.fillStyle = g.reward.ability ? '#e05cf0' : C.gold;
    circle(px, bobY, 15); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = g.reward.ability ? '#f4c4ff' : '#ffe9a8';
    circle(px, bobY, 7); ctx.fill();
  }
  ctx.restore();

  if(g.near && !g.open){

      ? (spec.breakBy ? (spec.breakBy === 'kick' ? 'KICK IT DOWN' : 'PUNCH THROUGH') : 'CLIMBING…')
      : spec.how;
    ctx.fillStyle = 'rgba(6,8,14,.85)';
    roundRect(X - 130, Y - 134, 260, 44, 8); ctx.fill();
    txt(label, X, Y - 121, 17, g.can ? C.gold : C.bad, 'center', 900);
    txt(spec.n + '  ·  ' + spec.ar, X, Y - 101, 13, 'rgba(255,255,255,.65)', 'center', 700);

}

/* ------------------------------------------------------------- wave handling */
function spawnWave(F, wave){
  var camX = F.camX;
  var list = [];
  for(var i=0;i<wave.e.length;i++){
    var type = wave.e[i][0], n = wave.e[i][1];
    for(var k=0;k<n;k++) list.push(type);
  }
  for(var j=0;j<list.length;j++){
    var fromRight = (j % 3 !== 2);
    var x = fromRight ? camX + W + 50 + j*54 : camX - 70 - j*40;
    var tier = (wave.tier !== undefined) ? wave.tier : F.st.tier;
    var e = makeEnemy(list[j], x, rand(0.24, 0.94), tier);
    e.hitRun = !!TYPES[list[j]].hitRun;
    e.side = (j % 2 === 0) ? 1 : -1;
    e.lane = (j >> 1) * 30;
    e.orbit = rand(-0.26, 0.26);
    e.guard = TYPES[list[j]].wall ? 0.62
            : (list[j] === 'thug') ? 0.12
            : (list[j] === 'boss' || list[j] === 'saqr') ? 0.40 : 0.24;
    e.guardT = rand(0, 1); e.guardRoll = 1;
    e.cd = rand(0.4, 1.4);
    F.enemies.push(e);
  }
  if(list.indexOf('boss') >= 0 || list.indexOf('saqr') >= 0) Sfx.ko();
}

var RANK_ORDER = ['S','A','B','C'];
function rankFor(F){
  var hpR = F.player.hp / F.player.maxHp;
  var score = F.kills*12 + F.bestCombo*22 + hpR*320 - F.time*1.1;
  score *= (0.8 + save.diff * 0.2);          // harder difficulty ranks easier
  return score > 620 ? 'S' : score > 470 ? 'A' : score > 330 ? 'B' : 'C';
}
function rankColor(r){
  return r === 'S' ? '#e05cf0' : r === 'A' ? C.gold : r === 'B' ? C.hp : C.dim;
}

function updateFight(dt){
  var F = G.fight;
  if(!F) return;
  var p = F.player, st = F.st;
  F.time += dt;

  // --- camera / wave gating ------------------------------------------------
  var wave = F.waveIdx < F.waves.length ? F.waves[F.waveIdx] : null;
  if(wave && F.lockX === null && (wave.at < 0 || p.x > wave.at)){
    F.lockX = F.camX;
    spawnWave(F, wave);
  }
  if(F.lockX !== null){
    var alive = 0;
    for(var i=0;i<F.enemies.length;i++) if(!F.enemies[i].dead) alive++;
    if(alive === 0){
      F.lockX = null; F.waveIdx++; Sfx.ok();
      G.slow = 0.55;                              // brief slow-mo on the last KO
      if(st.survival){
        F.survWave++;
        F.waves.push(genSurvivalWave(F.survWave));
        if(F.survWave > save.survBest){ save.survBest = F.survWave; writeSave(); }
        dropItem(F, p.x + 120, clamp(p.z, 0.1, 0.9), F.survWave % 3 === 0 ? 'food' : null);
      }
    }
  }

  F.minX = (F.lockX !== null) ? F.lockX + 70 : 40;
  F.maxX = (F.lockX !== null) ? F.lockX + W - 250 : st.len;

  // --- update actors -------------------------------------------------------
  var attacking = 0;
  for(i=0;i<F.enemies.length;i++) if(F.enemies[i].state === 'attack') attacking++;
  var tokens = Math.max(0, 2 - attacking);

  updatePlayer(p, dt, F.enemies, F);
  for(i=0;i<F.enemies.length;i++){
    var e = F.enemies[i];
    if(e.dead) continue;
    if(updateEnemy(e, dt, p, tokens)) tokens--;
  }

  // --- bounds --------------------------------------------------------------
  var minX = F.minX, maxX = F.maxX;
  p.x = clamp(p.x, minX, maxX);
  p.z = clamp(p.z, 0.04, 0.98);
  for(i=0;i<F.enemies.length;i++){
    var en = F.enemies[i];
    if(en.dead) continue;
    if(F.lockX === null) continue;
    if(!en.entered && en.x > F.lockX + 30 && en.x < F.lockX + W - 30) en.entered = true;
    if(en.entered) en.x = clamp(en.x, minX, maxX);
    else en.x = Math.max(en.x, minX - 300);
    en.z = clamp(en.z, 0.04, 0.98);
  }
  separate([p].concat(F.enemies.filter(function(q){ return !q.dead; })));

  // --- props, pickups, footfall dust ---------------------------------------
  for(i=0;i<F.props.length;i++) if(F.props[i].shakeT > 0) F.props[i].shakeT -= dt;
  updateItems(F, dt);
  updateGates(F, dt);
  if(p.moving && p.state !== 'down' && chance(dt * 9))
    burst(p.x, FLOOR_TOP + p.z*FLOOR_H, 1, 'rgba(255,255,255,.45)', 40);

  // --- collect kills -------------------------------------------------------
  for(i=F.enemies.length-1;i>=0;i--){
    var d = F.enemies[i];
    if(d.dead && !d.counted){
      d.counted = true;
      F.kills++; F.xp += d.xp; bump('kills');
      var s = screenOf(d);
      burst(s.x, s.y - 50, 18, C.gold, 300);
      popNum(s.x, s.y - 110, '+' + d.xp, 'heal');
      Sfx.ok();
      if(chance((d.kind === 'boss' || d.kind === 'saqr') ? 1 : 0.16)) dropItem(F, d.x, d.z);
    }
  }
  F.enemies = F.enemies.filter(function(q){ return !(q.dead && q.downT <= -1.4); });
  for(i=0;i<F.enemies.length;i++) if(F.enemies[i].dead) F.enemies[i].downT -= dt;

  // --- camera --------------------------------------------------------------
  var target = (F.lockX !== null) ? F.lockX : clamp(p.x - W * 0.42, 0, Math.max(0, st.len - W + 260));
  F.camX = lerp(F.camX, target, 1 - Math.pow(0.0015, dt));

  // --- outcomes ------------------------------------------------------------
  if(p.dead && !F.done){
    F.done = true;
    if(st.survival){
      F.reached = F.survWave;
      save.xp += F.xp;
      if(F.survWave - 1 > save.survBest) save.survBest = F.survWave - 1;
      writeSave();
    }
    G.state = 'gameover'; G.endT = 0;
    Music.stop(); Sfx.ko();
    checkAchievements();
  }
  if(!F.done && !st.survival && F.waveIdx >= F.waves.length && p.x >= st.len - 90){
    F.done = true;
    var bonus = 60 + F.bestCombo * 8 + Math.round(p.hp / p.maxHp * 90);
    F.bonus = bonus;
    save.xp += F.xp + bonus;
    if(save.cleared.indexOf(F.idx) < 0) save.cleared.push(F.idx);
    if(F.idx + 1 > save.unlocked - 1) save.unlocked = Math.min(CAMPAIGN, F.idx + 2);
    if(F.bestCombo > save.best) save.best = F.bestCombo;
    bump('clears'); bump('time', Math.round(F.time));
    if(save.diff === 2) bump('champClears');
    F.rank = rankFor(F);
    var prev = save.ranks[F.idx];
    if(!prev || RANK_ORDER.indexOf(F.rank) < RANK_ORDER.indexOf(prev)) save.ranks[F.idx] = F.rank;
    writeSave();
    G.state = (F.idx === CAMPAIGN - 1) ? 'victory' : 'clear';
    G.endT = 0;
    Music.stop(); Sfx.power();
    checkAchievements();
  }
}

/* ==========================================================================
   HUD + TOUCH CONTROLS
   ========================================================================== */

function bar(x, y, w, h, v, max, col, label){
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  roundRect(x-2, y-2, w+4, h+4, (h+4)/2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  roundRect(x, y, w, h, h/2); ctx.fill();
  var f = clamp(v/max, 0, 1);
  if(f > 0){
    ctx.fillStyle = col;
    roundRect(x, y, Math.max(h, w*f), h, h/2); ctx.fill();
  }
  if(label) txt(label, x + 6, y + h/2, h - 3, 'rgba(0,0,0,.65)', 'left', 800);
}

function drawHUD(){
  var F = G.fight, p = F.player;

  // player panel
  ctx.fillStyle = 'rgba(8,10,16,.62)';

function drawFight(){
  var F = G.fight;
  ctx.save();
  if(shake > 0.4) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  drawStageBg(F.st.theme, F.camX);

  // exit gate once all waves are done
  if(!F.st.survival && F.waveIdx >= F.waves.length){
    var gx = F.st.len - F.camX + 40;
    if(gx > -200 && gx < W + 200){
      ctx.globalAlpha = 0.45 + Math.sin(gameTime*4)*0.2;
      var g = ctx.createLinearGradient(gx-60, 0, gx+60, 0);
      g.addColorStop(0, 'rgba(224,179,74,0)');
      g.addColorStop(0.5, 'rgba(224,179,74,.9)');
      g.addColorStop(1, 'rgba(224,179,74,0)');
      ctx.fillStyle = g;
      ctx.fillRect(gx-60, FLOOR_TOP-190, 120, 380);
      ctx.globalAlpha = 1;
      txt('EXIT', gx, FLOOR_TOP-210, 26, C.gold, 'center', 900);
    }
  }
  // wave barrier
  if(F.lockX !== null){
    var bx = F.lockX + W - 245 - F.camX;
    ctx.globalAlpha = 0.16 + Math.sin(gameTime*3)*0.06;
    ctx.fillStyle = C.bad;
    ctx.fillRect(bx, 0, 80, H);
    ctx.globalAlpha = 1;
  }

  var draws = [];
  function pushFighter(f){
    draws.push({ z:f.z, run:function(){
      if(f.dead && f.downT < -0.6) ctx.globalAlpha = clamp(1 + (f.downT+0.6)/0.8, 0, 1);
      drawFighter(f, F.camX);
      ctx.globalAlpha = 1;
    }});
  }
  pushFighter(F.player);
  for(var i=0;i<F.enemies.length;i++) pushFighter(F.enemies[i]);
  for(i=0;i<F.props.length;i++){
    var pr = F.props[i];
    if(pr.broken) continue;
    (function(q){ draws.push({ z:q.z, run:function(){ drawProp(q, F.camX); } }); })(pr);
  }
  for(i=0;i<F.items.length;i++){
    (function(q){ draws.push({ z:q.z, run:function(){ drawItem(q, F.camX); } }); })(F.items[i]);
  }
  for(i=0;i<F.gates.length;i++){
    (function(q){ draws.push({ z:GATE_Z - 0.01, run:function(){ drawGate(q, F.camX); } }); })(F.gates[i]);
  }
  draws.sort(function(a,b){ return a.z - b.z; });
  for(i=0;i<draws.length;i++) draws[i].run();

  drawFx(F.camX);
  (THEME[F.st.theme] || THEME.souq).fore(F.camX);
  ctx.restore();

  // vignette
  var vg = ctx.createRadialGradient(W/2, H/2, H*0.34, W/2, H/2, H*0.92);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.42)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  // low health: the edges pulse red
  var hpR = F.player.hp / F.player.maxHp;
  if(hpR < 0.3 && !F.player.dead){
    var lg = ctx.createRadialGradient(W/2, H/2, H*0.30, W/2, H/2, H*0.85);
    lg.addColorStop(0, 'rgba(200,16,46,0)');
    lg.addColorStop(1, 'rgba(200,16,46,' + (0.22 + Math.sin(gameTime*7)*0.14).toFixed(3) + ')');
    ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  }

  postProcess();

  if(flashScreen > 0){
    ctx.globalAlpha = clamp(flashScreen, 0, 1) * 0.5;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  drawHUD();
  drawTouch();
}

var uiBtns = [];
function uiButton(x, y, w, h, label, sub, fn, style){
  uiBtns.push({ x:x, y:y, w:w, h:h, fn:fn });
  var primary = style === 'primary', danger = style === 'danger', off = style === 'off';
  ctx.fillStyle = off ? 'rgba(20,22,28,.7)'
                : primary ? 'rgba(200,16,46,.92)'
                : danger ? 'rgba(70,20,26,.85)' : 'rgba(18,21,28,.86)';
  roundRect(x, y, w, h, 12); ctx.fill();
  ctx.strokeStyle = primary ? 'rgba(255,220,150,.9)' : 'rgba(224,179,74,.45)';
  ctx.lineWidth = 2;
  roundRect(x, y, w, h, 12); ctx.stroke();
  var base = primary ? 24 : 21;
  var fit = Math.min(base, (w - 22) / (label.length * 0.62));
  txt(label, x + w/2, y + (sub ? h/2 - 10 : h/2), Math.max(11, fit),
      off ? C.dim : C.white, 'center', 900);
  if(sub) txt(sub, x + w/2, y + h/2 + 15, 15, primary ? 'rgba(255,235,200,.9)' : C.gold, 'center', 700);
}
function flushUI(){
  if(!In.uiTap){ uiBtns = []; return; }
  var t = In.uiTap; In.uiTap = null;
  if(t.enter && uiBtns.length){ Sfx.ui(); uiBtns[0].fn(); uiBtns = []; return; }
  for(var i=uiBtns.length-1;i>=0;i--){
    var b = uiBtns[i];
    if(t.x >= b.x && t.x <= b.x+b.w && t.y >= b.y && t.y <= b.y+b.h){
      Sfx.init(); Sfx.resume(); Sfx.ui(); b.fn(); break;
    }
  }
  uiBtns = [];
}

function screenBg(tint){
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, tint || '#141a26');

  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // subtle sadu-style stripe
  ctx.globalAlpha = 0.10;
  for(var i=0;i<10;i++){

    ctx.fillRect(0, 96 + i*3, W, 2);
    ctx.fillRect(0, H-120 + i*3, W, 2);
  }
  ctx.globalAlpha = 1;
}

var demo = null;
function drawDemoAhmed(dt){
  if(!demo){
    demo = makePlayer();
    demo.x = 1010; demo.z = 0.72; demo.facing = -1;
    demo.cycle = 0.9;
  }
  demo.anim += dt;
  if(demo.state === 'attack') advanceAttack(demo, dt, []);
  else {
    demo.cycle -= dt;
    if(demo.cycle <= 0){
      demo.cycle = rand(1.0, 1.9);
      startAttack(demo, pick(['jab','cross','hook','kick','knee']));
    }
  }
  demo.vx *= 0.9;
  drawFighter(demo, 0);
}

var MAP_POS = [[140,230],[380,230],[620,230],[860,230],[1100,230],
               [1100,430],[860,430],[620,430],[380,430]];
function drawMap(){
  screenBg('#131b2a');
  txt('CHOOSE YOUR FIGHT', W/2, 52, 34, C.gold, 'center', 900);
  txt('اختر المعركة', W/2, 86, 18, C.white, 'center', 700);
  txt('XP ' + save.xp, 40, 40, 22, C.gold, 'left', 900);
  txt('BEST COMBO ' + save.best, 40, 64, 14, C.dim, 'left', 700);
  // abilities carried
  var order = ['vault','dashleap','powerkick','haymaker'];
  for(var ai=0; ai<order.length; ai++){
    var A = ABILITIES[order[ai]], got = hasAbility(order[ai]);
    var ax = 42 + ai*46, ay = 92;
    ctx.fillStyle = got ? 'rgba(224,179,74,.20)' : 'rgba(255,255,255,.05)';
    roundRect(ax, ay, 38, 38, 8); ctx.fill();
    ctx.strokeStyle = got ? C.gold : 'rgba(255,255,255,.10)';
    ctx.lineWidth = 2; roundRect(ax, ay, 38, 38, 8); ctx.stroke();
    txt(got ? A.icon : '·', ax+19, ay+19, got ? 21 : 18, got ? C.gold : C.dim, 'center', 900);
  }

  // difficulty selector — tap to cycle
  var D = diff();
  uiButton(W-286, 26, 246, 54, D.n, 'الصعوبة · ' + D.ar, function(){
    save.diff = (save.diff + 1) % 3; writeSave();
  });
  ctx.fillStyle = D.col;
  roundRect(W-278, 34, 8, 38, 4); ctx.fill();

  ctx.strokeStyle = 'rgba(224,179,74,.30)';
  ctx.lineWidth = 5; ctx.setLineDash([12, 10]);
  ctx.beginPath();
  for(var i=0;i<MAP_POS.length;i++){
    if(i === 0) ctx.moveTo(MAP_POS[i][0], MAP_POS[i][1]);
    else ctx.lineTo(MAP_POS[i][0], MAP_POS[i][1]);
  }
  ctx.stroke(); ctx.setLineDash([]);

  for(i=0;i<MAP_POS.length;i++){
    var st = STAGES[i], px = MAP_POS[i][0], py = MAP_POS[i][1];
    var locked = i >= save.unlocked;
    var done = save.cleared.indexOf(i) >= 0;
    var rank = save.ranks[i];

    ctx.fillStyle = locked ? 'rgba(30,33,42,.9)' : (done ? 'rgba(0,122,61,.85)' : 'rgba(200,16,46,.9)');
    circle(px, py, 40); ctx.fill();
    ctx.strokeStyle = locked ? 'rgba(255,255,255,.16)' : C.gold;
    ctx.lineWidth = 3; circle(px, py, 40); ctx.stroke();
    txt(locked ? '🔒' : String(i+1), px, py, locked ? 24 : 32, locked ? C.dim : C.white, 'center', 900);

    // sealed route marker — gold when you now carry the key, dim when you don't
    var gs = st.gates || [];
    for(var gi=0; gi<gs.length; gi++){
      if(gateOpen(i, gs[gi].at)) continue;
      var spec = GATES[gs[gi].type];
      var can = !spec.need || hasAbility(spec.need);
      if(locked) continue;
      ctx.fillStyle = can ? 'rgba(224,179,74,.92)' : 'rgba(30,33,42,.92)';
      circle(px-32, py-30, 15); ctx.fill();
      ctx.strokeStyle = can ? '#fff3c4' : 'rgba(255,255,255,.18)';
      ctx.lineWidth = 2; circle(px-32, py-30, 15); ctx.stroke();
      txt(can ? '!' : '🔒', px-32, py-29, can ? 20 : 13, can ? '#1a1408' : C.dim, 'center', 900);
    }

    if(rank){                                    // best rank earned on this stage
      ctx.fillStyle = 'rgba(8,10,16,.92)';
      circle(px+32, py-30, 17); ctx.fill();
      ctx.strokeStyle = rankColor(rank); ctx.lineWidth = 2.5;
      circle(px+32, py-30, 17); ctx.stroke();
      txt(rank, px+32, py-29, 20, rankColor(rank), 'center', 900);
    } else if(done){
      txt('✓', px+30, py-28, 22, C.gold, 'center', 900);
    }

    txt(st.name, px, py+62, 15, locked ? C.dim : C.white, 'center', 800);
    txt(st.ar,  px, py+82, 14, locked ? 'rgba(255,255,255,.22)' : C.gold, 'center', 700);
    if(st.boss && !locked) txt('BOSS', px, py-62, 15, C.bad, 'center', 900);

    if(!locked){
      (function(idx){
        uiBtns.push({ x:px-52, y:py-52, w:104, h:104, fn:function(){ openBrief(idx); } });
      })(i);
    }
  }

  // survival — unlocked by winning the title fight
  var survIdx = STAGES.length - 1;
  var survOpen = save.cleared.indexOf(MAP_POS.length - 1) >= 0;
  if(survOpen){
    uiButton(W/2-190, H-78, 380, 58, 'SURVIVAL  ·  BEST WAVE ' + save.survBest,
             'البقاء — موجات لا تنتهي', function(){ openBrief(survIdx); }, 'primary');
  } else {
    uiButton(W/2-190, H-78, 380, 58, 'SURVIVAL LOCKED', 'اهزم الوحش لفتحه',
             function(){ Sfx.hurt(); }, 'off');

function render(dt){
  switch(G.state){
    case 'menu':     drawMenu(dt); break;
    case 'help':     drawHelp(); break;
    case 'map':      drawMap(); break;
    case 'brief':    drawBrief(dt); break;
    case 'settings': drawSettings(); break;
    case 'achievements': drawAchievements(); break;
    case 'upgrade':  drawUpgrade(); break;
    case 'fight':    drawFight(); if(G.paused) drawPause(); break;
    case 'clear':    drawClear(dt); break;
    case 'gameover': drawGameOver(dt); break;
    case 'victory':  drawVictory(dt); break;
  }
  flushUI();
}

var last = 0;
function frame(now){
  if(!last) last = now;
  var rdt = Math.min(0.048, (now - last) / 1000);
  last = now;
  var dt = rdt;
  if(G.slow > 0){ G.slow -= rdt; dt = rdt * 0.34; }
  gameTime += dt;
  G.t += dt;
  GFX_HIGH = save.gfx !== false;
  samplePerf(rdt);

  readInput();

  if(G.state === 'fight' && !G.paused){
    if(G.intro > 0) G.intro -= dt;
    if(hitstop > 0) hitstop -= dt;
    else updateFight(dt);
    updateFx(dt);
  } else {
    updateFx(dt * 0.7);
  }

  if(achToastT > 0) achToastT -= rdt;
  render(dt);
  drawAchToast();
  clearTaps();
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);

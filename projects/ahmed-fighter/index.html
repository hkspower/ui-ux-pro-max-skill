<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="AHMED — a Kuwaiti kickboxing beat-'em-up adventure. Playable in any mobile browser.">
<link rel="manifest" href="manifest.webmanifest">
<title>AHMED — Kuwait Fighter</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070b;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:auto;touch-action:none;
    box-shadow:0 0 60px rgba(0,0,0,.9)}
  #rotate{position:fixed;inset:0;display:none;flex-direction:column;gap:18px;
    align-items:center;justify-content:center;background:#05070b;color:#e8e2d4;
    text-align:center;padding:30px;z-index:50}
  #rotate b{font-size:22px;letter-spacing:2px;color:#edbe57}
  #rotate span{font-size:15px;opacity:.7;line-height:1.7}
  #rotate .ph{width:64px;height:104px;border:3px solid #edbe57;border-radius:10px;
    animation:tilt 1.6s ease-in-out infinite}
  @keyframes tilt{0%,40%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait) and (max-width:900px){#rotate{display:flex}#wrap{opacity:.06}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="rotate">
  <div class="ph"></div>
  <b>ROTATE YOUR DEVICE</b>
  <span>Play in landscape for the full arena<br>أدر جهازك أفقياً للعب</span>
</div>
<!-- Game data lives in assets/ so each table can be edited on its own.
     Plain scripts, in dependency order, so the game still opens from disk. -->
<script src="assets/ahmed.js"></script>
<script src="assets/enemies.js"></script>
<script src="assets/hits.js"></script>
<script src="assets/talents.js"></script>
<script src="assets/upgrades.js"></script>
<script src="assets/weapons.js"></script>
<script src="assets/levels.js"></script>
<script src="assets/world.js"></script>
<script src="assets/stages.js"></script>
<script>
(function(){
'use strict';

/* Every table the game runs on is loaded from assets/. Fail loudly rather
   than half-starting with an undefined table. */
var ASSETS = ['ASSET_AHMED','ASSET_ENEMIES','ASSET_HITS','ASSET_TALENTS',
              'ASSET_UPGRADES','ASSET_WEAPONS','ASSET_LEVELS','ASSET_WORLD',
              'ASSET_STAGES'];
for(var ai=0; ai<ASSETS.length; ai++){
  if(!window[ASSETS[ai]]) throw new Error('Missing asset: assets/' +
    ASSETS[ai].replace('ASSET_','').toLowerCase() + '.js');
}

/* ==========================================================================
   AHMED — Kuwait Fighter
   A 2D mobile beat-'em-up. Everything (art, audio, animation) is procedural,
   so the whole game ships as this single file with zero external assets.
   ========================================================================== */

/* ---------------------------------------------------------------- constants */
var W = 1280, H = 720;              // logical canvas resolution
var CAMPAIGN = 9;                   // campaign stages; anything after is a side mode
var FLOOR_TOP = 452, FLOOR_H = 196; // playfield depth band (z = 0..1)

var C = {
  red:'#c8102e', green:'#007a3d', gold:'#edbe57', sand:'#e8dcc0',
  ink:'#0a0c11', dim:'#8a8574', white:'#fdfaf2', hp:'#37c26b', bad:'#e2413f'
};

var cv = document.getElementById('c');
var ctx = cv.getContext('2d', { alpha:false });

function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width  = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
  cv.width  = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });

/* -------------------------------------------------------------------- utils */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rand(a,b){ return a+Math.random()*(b-a); }
function irand(a,b){ return Math.floor(rand(a,b+1)); }
function pick(arr){ return arr[irand(0,arr.length-1)]; }
function chance(p){ return Math.random()<p; }
function approach(v,t,step){ return v<t ? Math.min(v+step,t) : Math.max(v-step,t); }
function ease(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

function txt(s,x,y,size,color,align,weight,alpha){
  ctx.save();
  ctx.globalAlpha = alpha===undefined?1:alpha;
  ctx.font = (weight||800)+' '+size+'px "Segoe UI",Tahoma,Arial,sans-serif';
  ctx.textAlign = align||'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color||C.white;
  ctx.fillText(s,x,y);
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  var rr = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.closePath(); }

/* --------------------------------------------------------------- save state */
var SAVE_KEY = 'ahmed_kuwait_fighter_v1';
var save = { unlocked:1, xp:0, xpTotal:0, best:0, visited:[0], at:0, up:{box:0,kick:0,vit:0,spd:0,stam:0}, sound:true,
             abilities:[], gates:{},
             cleared:[], diff:1, ranks:{}, survBest:0, haptics:true, music:true,
             gfx:2, gfxUser:false, achieved:[], stats:{kills:0, crates:0, parries:0, champClears:0,
                                 fights:0, clears:0, time:0} };
function loadSave(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      var d = JSON.parse(raw);
      if(d && typeof d === 'object'){
        save.unlocked = clamp(d.unlocked|0, 1, CAMPAIGN);
        save.xp = Math.max(0, d.xp|0);
        // Saves from before levels existed carry no xpTotal. Seeding it from
        // the spendable balance under-counts anything already spent, which is
        // the safe direction: a returning player gains levels, never loses one.
        save.xpTotal = Math.max(save.xp, d.xpTotal|0);
        save.best = Math.max(0, d.best|0);
        save.sound = d.sound !== false;
        save.cleared = Array.isArray(d.cleared) ? d.cleared : [];
        save.diff = clamp(d.diff === undefined ? 1 : d.diff|0, 0, 2);
        save.ranks = (d.ranks && typeof d.ranks === 'object') ? d.ranks : {};
        save.survBest = Math.max(0, d.survBest|0);
        save.haptics = d.haptics !== false;
        save.music = d.music !== false;
        // booleans from older saves: true -> cinema, false -> fast
        save.gfx = (d.gfx === true || d.gfx === undefined) ? 2
                 : (d.gfx === false ? 0 : clamp(d.gfx|0, 0, 2));
        save.gfxUser = !!d.gfxUser;
        save.achieved = Array.isArray(d.achieved) ? d.achieved : [];
        if(d.stats) for(var sk in save.stats) save.stats[sk] = Math.max(0, d.stats[sk]|0);
        save.abilities = Array.isArray(d.abilities) ? d.abilities : [];
        save.visited = Array.isArray(d.visited) && d.visited.length ? d.visited : [0];
        save.at = clamp(d.at|0, 0, CAMPAIGN - 1);
        save.gates = (d.gates && typeof d.gates === 'object') ? d.gates : {};
        if(d.up){
          for(var k in save.up) save.up[k] = clamp(d.up[k]|0, 0, 5);
          // older saves had one POWER track — split it across box and kick
          if(d.up.pow !== undefined && !d.up.box && !d.up.kick)
            save.up.box = save.up.kick = clamp(d.up.pow|0, 0, 5);
        }
      }
    }
  }catch(e){ /* private mode / disabled storage — play unsaved */ }
}
function writeSave(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){}
}
loadSave();

/* --------------------------------------------------------------- difficulty */
var DIFF = [
  {n:'ROOKIE',   ar:'مبتدئ',  dmg:0.62, hp:0.78, col:'#37c26b'},
  {n:'PRO',      ar:'محترف',  dmg:1.00, hp:1.00, col:'#edbe57'},
  {n:'CHAMPION', ar:'بطل',    dmg:1.45, hp:1.38, col:'#e2413f'}
];
function diff(){ return DIFF[clamp(save.diff, 0, 2)]; }

/* Short buzz on impact. Silently ignored where the browser has no vibrator. */
function haptic(ms){
  if(!save.haptics || !navigator.vibrate) return;
  try{ navigator.vibrate(ms); }catch(e){}
}

/* Steps through an area edge, carrying the fighter's condition with them. */
function travelTo(to, cameFrom){
  var F = G.fight, p = F.player;
  var keep = { hp:p.hp, mp:p.mp, rage:p.rage, weapon:p.weapon };
  Music.stop();
  startStage(to, cameFrom === 'e' ? 'w' : 'e', keep);
  var st = STAGES[to];
  toast(st.name, st.ar, visited(to) ? 'ARRIVING' : 'NEW GROUND');
}

/* ------------------------------------------------------------------- world
   The areas form a graph, not a list — see assets/world.js. Everything here
   is about moving between them and knowing which routes are shut. */
function areaLinks(idx){ return ASSET_WORLD.areas[idx] || {}; }
function linkOpen(link){
  if(link.needs && !hasAbility(link.needs)) return false;
  // A shortcut is opened from the far side: it does not exist until the area
  // it comes from has been beaten.
  if(link.afterCleared !== undefined && !areaCleared(link.afterCleared)) return false;
  return true;
}
function visited(idx){ return save.visited.indexOf(idx) >= 0; }
function markVisited(idx){
  if(!visited(idx)) save.visited.push(idx);
  save.at = idx;
}
/* An area already beaten is a corridor: no waves, so walking back through it
   costs time and nothing else. Backtracking has to be cheap or the whole
   shape stops being inviting. */
function areaCleared(idx){ return save.cleared.indexOf(idx) >= 0; }

/* ------------------------------------------------------------------ levels
   Earned XP never goes down, so spending in the training camp cannot cost a
   level. The curve lives in assets/levels.js. */
function levelFor(total){
  var L = ASSET_LEVELS, n = 1;
  while(n < L.max && total >= L.need(n + 1)) n++;
  return n;
}
function playerLevel(){ return levelFor(save.xpTotal); }
/* 0..1 through the current level; 1 once the cap is reached. */
function levelProgress(){
  var L = ASSET_LEVELS, n = playerLevel();
  if(n >= L.max) return 1;
  var lo = L.need(n), hi = L.need(n + 1);
  return clamp((save.xpTotal - lo) / Math.max(1, hi - lo), 0, 1);
}
/* Every XP award goes through here, so the earned total can never drift from
   the spendable balance. */
function grantXp(n){
  n = Math.max(0, Math.round(n));
  if(!n) return;
  var before = playerLevel();
  save.xp += n; save.xpTotal += n;
  if(playerLevel() > before){
    var lv = playerLevel();
    toast('LEVEL ' + lv, ASSET_LEVELS.title(lv), 'RANK UP');
    Sfx.power(); haptic(60);
  }
}

/* Abilities are found in the world, never bought — see assets/talents.js. */
var ABILITIES = ASSET_TALENTS.abilities;
function hasAbility(k){ return save.abilities.indexOf(k) >= 0; }
function grantAbility(k){
  if(hasAbility(k)) return false;
  save.abilities.push(k);
  writeSave();
  return true;
}

/* Gates: what opens them, and what they look like. */
var GATES = ASSET_TALENTS.gates;
var GATE_Z = ASSET_TALENTS.gateZ;        // gates sit against the back wall
function gateKey(idx, at){ return idx + ':' + at; }
function gateOpen(idx, at){ return !!save.gates[gateKey(idx, at)]; }

/* ------------------------------------------------------------- achievements */
var ACHIEVEMENTS = [
  {k:'first',    n:'FIRST BLOOD',    ar:'أول ضربة',    d:'Down your first opponent.',
   test:function(){ return save.stats.kills >= 1; }},
  {k:'combo10',  n:'TEN STRAIGHT',   ar:'عشر ضربات',   d:'Land a 10-hit combo.',
   test:function(){ return save.best >= 10; }},
  {k:'combo25',  n:'UNTOUCHABLE',    ar:'لا يُمسّ',     d:'Land a 25-hit combo.',
   test:function(){ return save.best >= 25; }},
  {k:'crates',   n:'DEMOLITION',     ar:'تحطيم',       d:'Smash 50 crates.',
   test:function(){ return save.stats.crates >= 50; }},
  {k:'parry',    n:'READ THE PUNCH', ar:'قراءة اللكمة', d:'Land 25 perfect parries.',
   test:function(){ return save.stats.parries >= 25; }},
  {k:'saqr',     n:'FALCON DOWN',    ar:'سقط الصقر',   d:'Beat AL-SAQR at Marina Crescent.',
   test:function(){ return save.cleared.indexOf(4) >= 0; }},
  {k:'belt',     n:'THE BELT',       ar:'الحزام',      d:'Beat AL-WAHSH and take the title.',
   test:function(){ return save.cleared.indexOf(8) >= 0; }},
  {k:'srank',    n:'FLAWLESS',       ar:'بلا أخطاء',   d:'Earn an S rank on any stage.',
   test:function(){ for(var k in save.ranks) if(save.ranks[k] === 'S') return true; return false; }},
  {k:'champion', n:'NO MERCY',       ar:'بلا رحمة',    d:'Clear a stage on CHAMPION.',
   test:function(){ return save.stats.champClears >= 1; }},
  {k:'maxed',    n:'PEAK CONDITION', ar:'قمة اللياقة', d:'Max out any training track.',
   test:function(){ for(var u in save.up) if(save.up[u] >= 5) return true; return false; }},
  {k:'explorer', n:'NO WAY BARRED', ar:'لا حواجز', d:'Find all five talents.',
   test:function(){ return save.abilities.length >= 5; }},
  {k:'surv10',   n:'LAST MAN UP',    ar:'آخر الواقفين', d:'Reach wave 10 in Survival.',
   test:function(){ return save.survBest >= 10; }},
  {k:'allstage', n:'ALL OF KUWAIT',  ar:'كل الكويت',   d:'Clear all nine stages.',
   test:function(){ return save.cleared.length >= CAMPAIGN; }}
];
var achToast = null, achToastT = 0;
function toast(name, ar, head){
  achToast = { n:name, ar:ar, head:head || 'ACHIEVEMENT UNLOCKED' };
  achToastT = 3.4;
}

function bump(stat, by){
  save.stats[stat] = (save.stats[stat] || 0) + (by === undefined ? 1 : by);
}
function checkAchievements(){
  for(var i=0;i<ACHIEVEMENTS.length;i++){
    var a = ACHIEVEMENTS[i];
    if(save.achieved.indexOf(a.k) >= 0) continue;
    if(a.test()){
      save.achieved.push(a.k);
      toast(a.n, a.ar);
      writeSave();
      if(Sfx.ac) Sfx.power();
    }
  }
}

/* -------------------------------------------------------------------- audio */
var Sfx = {
  ac:null, master:null,
  init:function(){
    if(this.ac) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain();
    this.master.gain.value = save.sound ? 0.5 : 0;
    this.master.connect(this.ac.destination);
  },
  resume:function(){ if(this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  setOn:function(on){ save.sound = on; if(this.master) this.master.gain.value = on?0.5:0; writeSave(); },
  noiseBuf:null,
  noise:function(){
    if(!this.noiseBuf){
      var n = this.ac.sampleRate * 0.6, b = this.ac.createBuffer(1, n, this.ac.sampleRate), d = b.getChannelData(0);
      for(var i=0;i<n;i++) d[i] = Math.random()*2-1;
      this.noiseBuf = b;
    }
    var s = this.ac.createBufferSource(); s.buffer = this.noiseBuf; return s;
  },
  // generic percussive noise hit
  thud:function(freq, dur, q, vol, type){
    if(!this.ac || !save.sound) return;
    var t = this.ac.currentTime;
    var src = this.noise();
    var f = this.ac.createBiquadFilter();
    f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
    var g = this.ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.02);
  },
  tone:function(f0, f1, dur, vol, type){
    if(!this.ac || !save.sound) return;
    var t = this.ac.currentTime;
    var o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  punch:function(){ this.thud(420, 0.10, 1.4, 0.35); this.tone(150, 60, 0.09, 0.22, 'triangle'); },
  kick :function(){ this.thud(240, 0.16, 1.0, 0.42); this.tone(110, 42, 0.15, 0.30, 'triangle'); },
  whoosh:function(){ this.thud(1400, 0.13, 0.8, 0.10, 'highpass'); },
  block:function(){ this.thud(2600, 0.07, 3.0, 0.22, 'bandpass'); },
  hurt :function(){ this.tone(320, 120, 0.16, 0.16, 'sawtooth'); },
  down :function(){ this.thud(120, 0.32, 0.7, 0.40, 'lowpass'); this.tone(90, 40, 0.3, 0.25,'sine'); },
  ui   :function(){ this.tone(660, 660, 0.05, 0.14, 'square'); },
  ok   :function(){ this.tone(520, 1040, 0.16, 0.16, 'square'); },
  ko   :function(){ this.tone(420, 60, 0.9, 0.30, 'sawtooth'); },
  power:function(){ this.tone(180, 900, 0.42, 0.24, 'sawtooth'); this.thud(900,0.4,0.6,0.16); }
};

/* Simple procedural beat — Hijaz-flavoured bassline over a darbuka-ish groove. */
var Music = {
  timer:null, step:0, tempo:104, on:false,
  scale:[0,1,4,5,7,8,10],      // Hijaz
  root:73.42,                   // D2
  start:function(intense, root){
    if(!Sfx.ac || this.on || !save.music) return;
    this.on = true; this.step = 0; this.tempo = intense ? 118 : 100;
    this.root = root || 73.42;
    var self = this;
    this.timer = setInterval(function(){ self.tick(); }, (60000/this.tempo)/4);
  },
  stop:function(){ if(this.timer) clearInterval(this.timer); this.timer=null; this.on=false; },
  note:function(semi, dur, vol, type){
    var f = this.root * Math.pow(2, semi/12);
    Sfx.tone(f, f, dur, vol, type||'sawtooth');
  },
  tick:function(){
    if(!save.sound || !save.music || !Sfx.ac) return;
    var s = this.step % 16;
    if(s===0||s===6||s===10) Sfx.thud(90, 0.16, 0.6, 0.30, 'lowpass');           // dum
    if(s===4||s===12||s===14) Sfx.thud(1500, 0.05, 1.2, 0.10, 'highpass');       // tak
    if(s%2===0){
      var deg = this.scale[[0,0,3,2,0,4,3,1][(s/2)|0]];
      this.note(deg, 0.16, 0.055, 'sawtooth');
    }
    this.step++;
  }
};

/* -------------------------------------------------------------------- input */
var In = {
  ax:0, az:0,                                   // analog movement
  hold:{punch:0,kick:0,block:0,special:0},      // held state
  tap:{punch:false,kick:false,block:false,special:false},
  joy:{id:null, ox:0, oy:0, x:0, y:0, active:false},
  pointers:{},
  uiTap:null,                                   // {x,y} consumed by UI once
  keys:{}
};

var BTN = {
  punch  :{x:W-96,  y:H-92,  r:52, label:'PUNCH', ar:'لكمة',  col:'#e2413f', key:'punch'},
  kick   :{x:W-96,  y:H-212, r:50, label:'KICK',  ar:'ركلة',  col:'#edbe57', key:'kick'},
  block  :{x:W-216, y:H-108, r:44, label:'BLOCK', ar:'صد',    col:'#5aa9e6', key:'block'},
  special:{x:W-208, y:H-224, r:44, label:'RAGE',  ar:'غضب',   col:'#b46ce0', key:'special'}
};

function toLocal(e){
  var r = cv.getBoundingClientRect();
  return { x:(e.clientX - r.left) / (r.width / W), y:(e.clientY - r.top) / (r.height / H) };
}
function hitBtn(p){
  for(var k in BTN){
    var b = BTN[k], dx = p.x-b.x, dy = p.y-b.y;
    if(dx*dx + dy*dy < (b.r+10)*(b.r+10)) return b;
  }
  return null;
}
function onDown(e){
  Sfx.init(); Sfx.resume();
  var p = toLocal(e);
  var rec = { x:p.x, y:p.y, btn:null, joy:false };

  if(G.state === 'fight' && !G.paused){
    var b = hitBtn(p);
    if(b){
      rec.btn = b.key;
      In.hold[b.key]++; In.tap[b.key] = true;
    } else if(p.x < W*0.5){
      rec.joy = true;
      In.joy.id = e.pointerId; In.joy.active = true;
      In.joy.ox = p.x; In.joy.oy = p.y; In.joy.x = p.x; In.joy.y = p.y;
    }
  }
  In.pointers[e.pointerId] = rec;
  if(!rec.btn && !rec.joy) In.uiTap = { x:p.x, y:p.y };
  if(cv.setPointerCapture) { try{ cv.setPointerCapture(e.pointerId); }catch(err){} }
  e.preventDefault();
}
function onMove(e){
  var rec = In.pointers[e.pointerId];
  if(!rec) return;
  var p = toLocal(e);
  if(rec.joy && In.joy.id === e.pointerId){ In.joy.x = p.x; In.joy.y = p.y; }
  e.preventDefault();
}
function onUp(e){
  var rec = In.pointers[e.pointerId];
  if(rec){
    if(rec.btn && In.hold[rec.btn] > 0) In.hold[rec.btn]--;
    if(rec.joy && In.joy.id === e.pointerId){ In.joy.active = false; In.joy.id = null; }
    delete In.pointers[e.pointerId];
  }
  e.preventDefault();
}
cv.addEventListener('pointerdown', onDown);

  if(In.keys.KeyD || In.keys.ArrowRight) kx += 1;
  if(In.keys.KeyW || In.keys.ArrowUp)    kz -= 1;
  if(In.keys.KeyS || In.keys.ArrowDown)  kz += 1;

    var d = Math.sqrt(dx*dx + dy*dy), max = 78;
    if(d > 6){

/* ------------------------------------------------------------ post-processing
   A tiled noise pattern and a split-tone gradient, both cheap: the noise is
   generated once and painted as a single fillRect. */
var noisePat = null, gradeGrad = null, vignGrad = null, vignH = 0;
function grainPattern(){
  if(noisePat) return noisePat;
  var c = document.createElement('canvas');
  c.width = c.height = 128;
  var g2 = c.getContext('2d');
  var img = g2.createImageData(128, 128);
  for(var i=0;i<img.data.length;i+=4){
    var v = (Math.random() - 0.5) * 255;
    // pre-tinted: light specks stay light, dark specks stay dark, alpha carries it
    img.data[i] = img.data[i+1] = img.data[i+2] = v > 0 ? 255 : 0;
    img.data[i+3] = Math.abs(v) * 0.55;
  }
  g2.putImageData(img, 0, 0);
  noisePat = ctx.createPattern(c, 'repeat');
  return noisePat;
}
/* ==========================================================================
   THE POST CHAIN
   What an engine does after the scene is drawn and before you see it. The
   order matters and is the same order Unreal runs: bloom is gathered from the
   rendered frame, the film curve is applied, the grade sits on top of that,
   and grain goes last because grain is the lens, not the scene.

     1  bloom       bright things bleed into what is next to them
     2  tone map    exposure, the S-curve, and the film stock's saturation
     3  toe         black stops being black
     4  shoulder    white stops clipping
     5  grade       the stage's colour identity
     6  vignette    the lens, so it sits on top of the grade
     7  grain       the film the whole thing was shot on

   Bloom is the expensive one, so it is gathered at quarter resolution -- the
   downsample IS the first blur, which is why every engine does it that way --
   and the bright-pass and blur are handed to the GPU as one canvas filter.
   ========================================================================== */
var CAN_FILTER = (function(){
  try {
    var c = document.createElement('canvas').getContext('2d');
    c.filter = 'blur(2px)';
    return c.filter === 'blur(2px)';
  } catch(e){ return false; }
})();

/* The scale baked into the main context by resize(): logical units -> device
   pixels. Offscreen buffers have to match it or they are the wrong size on
   every display but the one they were written on. */
function canvasScale(){ return cv.width / W; }

/* The far-layer buffer, at half resolution -- the downsample is free blur, so
   the filter only has to add the rest. */
var farCv = null, farCtx = null, farW = 0, farH = 0;
function farBlurred(T, camX){
  // Half the canvas's REAL resolution, not half of 1280 -- the context carries
  // a devicePixelRatio scale, so a fixed logical size would render this layer
  // at a quarter resolution on a retina phone and at double on a small one.
  var k = canvasScale() * 0.5;
  var w = Math.max(64, Math.round(W * k)), h = Math.max(48, Math.round((FLOOR_TOP + 30) * k));
  if(!farCv){ farCv = document.createElement('canvas'); farCtx = farCv.getContext('2d'); }
  if(w !== farW || h !== farH){ farCv.width = farW = w; farCv.height = farH = h; }
  var g = farCtx, saveCtx = ctx;
  g.setTransform(k, 0, 0, k, 0, 0);
  g.clearRect(0, 0, W, FLOOR_TOP + 30);
  ctx = g;                       // the backdrop draws through the same name
  try { T.far(camX); } finally { ctx = saveCtx; }
  // Blur inside the buffer rather than on the composite: a filter's radius is
  // in the destination's own pixels, and the buffer's are the ones whose size
  // we know. haze is in logical units, and one buffer pixel is 1/k of those.
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.filter = 'blur(' + (RIG.haze * k).toFixed(2) + 'px)';
  g.globalCompositeOperation = 'copy';
  g.drawImage(farCv, 0, 0);
  g.filter = 'none';
  g.globalCompositeOperation = 'source-over';
  ctx.drawImage(farCv, 0, 0, W, FLOOR_TOP + 30);
}

var bloomCv = null, bloomCtx = null, bloomW = 0, bloomH = 0, bloomTick = 0, bloomWarm = false;
function bloomBuffer(){
  var k = canvasScale() / 6;
  var w = Math.max(48, Math.round(W * k)), h = Math.max(28, Math.round(H * k));
  if(!bloomCv){ bloomCv = document.createElement('canvas'); bloomCtx = bloomCv.getContext('2d'); }
  if(w !== bloomW || h !== bloomH){
    bloomCv.width = bloomW = w; bloomCv.height = bloomH = h; bloomWarm = false;
  }
  return bloomCtx;
}

/* Gather the bright end of the frame and add it back over itself.
   `brightness(b) contrast(c)` is an affine ramp: x -> (x*b - 0.5)*c + 0.5.
   Solving it so that BLOOM_T maps to 0 and full white maps to 1 gives an
   exact highlight threshold -- everything below the knee is driven to black
   and drops out, everything above keeps its relative brightness. Getting this
   wrong is how bloom turns into fog: a threshold that lets mid-tones through
   adds a white veil to the whole frame instead of a glow around the lights. */
//   want:  (x*b - .5)*c + .5  =  0 at x = T,  and  1 at x = 1
//   slope: (1-T)*b*c = 1          =>  b*c = 1/(1-T)
//   knee:  (T*b - .5)*c = -.5     =>  c = 1 + 2T/(1-T)
var BLOOM_T = 0.84;                                   // highlight threshold
var BLOOM_C = 1 + 2*BLOOM_T/(1 - BLOOM_T);            // contrast  ~8.1
var BLOOM_B = 1/((1 - BLOOM_T) * BLOOM_C);            // brightness ~0.56

function bloomPass(amount){
  if(!GFX_CINE || amount <= 0.02) return;
  var b = bloomBuffer();
  // Gathering is the expensive half -- it reads the frame back. Bloom is the
  // lowest-frequency thing on screen, so it is gathered on alternate frames
  // and the buffer reused in between. Nobody has ever seen bloom update at
  // half rate; everybody notices the frames it costs.
  bloomTick++;
  if(bloomTick & 1 || !bloomWarm){
    bloomWarm = true;
    b.setTransform(1,0,0,1,0,0);
    b.filter = 'none';
    b.globalCompositeOperation = 'copy';
    b.drawImage(cv, 0, 0, bloomW, bloomH);    // the downsample is the first blur
    // threshold + spread, in one pass over a thirty-sixth of the pixels
    b.filter = 'brightness(' + BLOOM_B.toFixed(3) + ') contrast(' + BLOOM_C.toFixed(2) +
               ') saturate(1.3) blur(1.8px)';
    b.drawImage(bloomCv, 0, 0);
    b.filter = 'none';
    b.globalCompositeOperation = 'source-over';
  }

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = clamp(amount, 0, 1);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(bloomCv, 0, 0, W, H);
  ctx.restore();
}

/* The tone map proper. One full-frame pass through the GPU's own colour
   pipeline: exposure sets where mid grey lands, contrast is the S-curve
   pivoting on it, and saturation is the film stock. Drawing the canvas onto
   itself with `copy` is a legal self-blit -- the source is snapshotted first
   -- and it is the only way to get a real per-pixel curve at this price. */
function toneMap(R){
  if(!GFX_CINE) return;
  var e = R.exposure || 1, c = R.contrast || 1, sat = R.saturate || 1;
  if(Math.abs(e-1) < 0.01 && Math.abs(c-1) < 0.01 && Math.abs(sat-1) < 0.01) return;
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.filter = 'brightness(' + e + ') contrast(' + c + ') saturate(' + sat + ')';
  ctx.globalCompositeOperation = 'copy';
  ctx.drawImage(cv, 0, 0);
  ctx.restore();
}

function postProcess(){
  if(!GFX_HIGH) return;
  var R = RIG;

  // 1 — bloom, gathered from the frame as it stands
  bloomPass(R.bloom);

  // 2 — the curve: exposure, contrast, saturation
  toneMap(R);

  // 3 — the toe. `lighten` only ever raises a pixel, so a dark tinted fill
  // lifts the blacks to that tint and leaves everything above it untouched.
  // That is the bottom of the film curve, and it is one fill.
  ctx.save();
  ctx.globalCompositeOperation = 'lighten';
  ctx.fillStyle = R.toe; ctx.fillRect(0, 0, W, H);
  // 4 — the shoulder. `darken` only ever lowers a pixel, so a near-white
  // tinted fill stops highlights at that colour instead of clipping to paper.
  ctx.globalCompositeOperation = 'darken';
  ctx.fillStyle = R.shoulder; ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // 5 — the stage's grade, cached per rig
  if(R._grad === undefined || R._gradH !== H){
    var gg = ctx.createLinearGradient(0, 0, 0, H);
    for(var i=0;i<R.grade.length;i++) gg.addColorStop(R.grade[i][0], R.grade[i][1]);
    R._grad = gg; R._gradH = H;
  }
  ctx.fillStyle = R._grad; ctx.fillRect(0, 0, W, H);

  // 6 — vignette. A lens effect, so it goes after the grade rather than
  // being graded itself.
  if(!vignGrad || vignH !== H){
    vignGrad = ctx.createRadialGradient(W/2, H/2, H*0.34, W/2, H/2, H*0.92);
    vignGrad.addColorStop(0, 'rgba(0,0,0,0)');
    vignGrad.addColorStop(1, 'rgba(0,0,0,.42)');
    vignH = H;
  }
  ctx.fillStyle = vignGrad; ctx.fillRect(0, 0, W, H);

  // 7 — film grain
  ctx.save();
  ctx.globalAlpha = 0.10;
  ctx.translate((gameTime*37) % 128 - 128, (gameTime*23) % 128 - 128);
  ctx.fillStyle = grainPattern();
  ctx.fillRect(0, 0, W + 128, H + 128);
  ctx.restore();
}

/* ----------------------------------------------------------------- fx pools */
var parts = [], nums = [], rings = [], shake = 0, hitstop = 0, flashScreen = 0;

/* ==========================================================================
   THE CAMERA
   Engines do not hold a fight at a fixed distance. A heavy landing punches the
   lens in toward the impact and eases back out, and between hits the frame
   never sits perfectly still -- a slow, low-frequency drift, the operator
   breathing. Both are tiny. Both are the difference between watching a fight
   and watching a diagram of one.
   ========================================================================== */
var camPunch = 0, camPunchX = 0, camPunchY = 0, camSway = 0;
function punchIn(amount, x, y){
  if(amount <= camPunch) return;
  camPunch = amount; camPunchX = x; camPunchY = y;
}
function updateCam(dt){
  camPunch = Math.max(0, camPunch - dt * 3.4);
  camSway += dt;
}
/* Applied around the impact point so the push reads as moving toward the hit
   rather than as the whole scene growing. */
function applyCam(){
  // A hair of overscan so the sway never drags an empty edge into frame.
  ctx.translate(W/2, H/2); ctx.scale(1.008, 1.008); ctx.translate(-W/2, -H/2);
  var sw = Math.sin(camSway * 0.63) * 1.5, sw2 = Math.cos(camSway * 0.41) * 1.1;
  ctx.translate(sw, sw2);
  if(camPunch > 0.001){
    var k = ease(clamp(camPunch, 0, 1)), z = 1 + k * 0.045;
    var px = clamp(camPunchX, W*0.2, W*0.8), py = clamp(camPunchY, H*0.2, H*0.8);
    ctx.translate(px, py); ctx.scale(z, z); ctx.translate(-px, -py);
  }
}

function ring(x, y, col, r0, r1, life){
  rings.push({ x:x, y:y, col:col, r0:r0, r1:r1, life:life || 0.30, max:life || 0.30 });
}
function streak(x, y, n, col, spd, dir){
  for(var i=0;i<n;i++){
    var a = dir + rand(-0.7, 0.7), s = rand(spd*0.5, spd*1.3);
    parts.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 30,
                 life:rand(.18,.34), max:.34, col:col, r:rand(1.6,3.4), line:true });
  }
}
function burst(x, y, n, col, spd){
  for(var i=0;i<n;i++){
    var a = rand(0, 6.2832), s = rand(spd*0.3, spd);
    parts.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 40,
                 life:rand(.25,.55), max:.55, col:col, r:rand(2,5) });
  }
}
function popNum(x, y, v, kind){
  nums.push({ x:x, y:y, v:v, life:.85, kind:kind||'dmg' });
}
function updateFx(dt){
  var i;
  for(i=parts.length-1;i>=0;i--){
    var p = parts[i];
    p.life -= dt;
    if(p.life <= 0){ parts.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 460*dt; p.vx *= 0.96;
  }
  for(i=nums.length-1;i>=0;i--){
    var n = nums[i];
    n.life -= dt; n.y -= 42*dt;
    if(n.life <= 0) nums.splice(i,1);
  }
  for(i=rings.length-1;i>=0;i--){
    rings[i].life -= dt;
    if(rings[i].life <= 0) rings.splice(i,1);
  }
  shake = Math.max(0, shake - dt*46);
  flashScreen = Math.max(0, flashScreen - dt*3.2);
  updateCam(dt);
}
function drawFx(camX){
  var i;
  for(i=0;i<rings.length;i++){
    var rg = rings[i];
    var k = 1 - rg.life / rg.max;
    ctx.globalAlpha = (1 - k) * 0.85;
    ctx.strokeStyle = rg.col;
    ctx.lineWidth = 6 * (1 - k) + 1;
    ctx.beginPath();
    ctx.ellipse(rg.x - camX, rg.y, lerp(rg.r0, rg.r1, k), lerp(rg.r0, rg.r1, k) * 0.62,
                0, 0, 6.2832);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for(i=0;i<parts.length;i++){
    var p = parts[i];
    ctx.globalAlpha = clamp(p.life/p.max, 0, 1);
    if(p.line){
      ctx.strokeStyle = p.col; ctx.lineWidth = p.r; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x - camX, p.y);
      ctx.lineTo(p.x - camX - p.vx*0.035, p.y - p.vy*0.035);
      ctx.stroke();
      continue;
    }
    ctx.fillStyle = p.col;
    circle(p.x - camX, p.y, p.r); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for(i=0;i<nums.length;i++){
    var n = nums[i];
    var a = clamp(n.life/0.85, 0, 1);
    var big = n.kind === 'crit';
    txt(n.kind==='heal' ? '+'+n.v : n.v,
        n.x - camX, n.y, big?34:24,
        n.kind==='crit' ? C.gold : (n.kind==='heal' ? C.hp : C.white),
        'center', 900, a);
  }
}

var ATK = ASSET_HITS;

var TYPES = ASSET_ENEMIES;

function makeFighter(o){
  var f = {
    x:0, z:0.55, h:0, vh:0, facing:1,
    hp:100, maxHp:100, stam:100, maxStam:100, rage:0,
    state:'idle', anim:0, moving:false,
    atk:null, atkKey:'', atkT:0, hitDone:false, hitTargets:null,
    hitT:0, downT:0, invuln:0, flash:0, blocking:false, blockLock:0,
    vx:0, vz:0, combo:0, comboT:0, cd:0, think:0, orbit:rand(-.1,.1),

/* ------------------------------------------------------------ pose helpers */
/* ==========================================================================
   Physically-flavoured fighter rendering.
   One key light from the upper left drives every gradient: limbs are shaded as
   lit cylinders, bodies and heads as lit volumes, with ambient occlusion at the
   joints and a bounce-light rim on the shadow side. GFX_HIGH swaps the whole
   thing for flat fills on slower devices.
   ========================================================================== */
var LIGHT = { x:-0.48, y:-0.88 };      // key light direction (normalised)
/* Three tiers, the way an engine ships scalability settings rather than one
   on/off switch.

     CINEMA  the full post chain -- bloom, the tone curve, depth of field.
             These read the rendered frame back per-pixel, which is cheap on a
             GPU and ruinous without one, so the tier can be taken away without
             taking the lighting with it.
     HIGH    the lighting rig: rim lights, lit volumes, lit props, directional
             contact shadows, the grade, the camera. All ordinary 2D drawing.
     FAST    flat fills.

   `save.gfx` is 2 / 1 / 0. Old saves stored a boolean, so `true` migrates to
   CINEMA and `false` to FAST. */
function gfxTier(){
  var g = save.gfx;
  if(g === true) return 2;
  if(g === false) return 0;
  return clamp(g|0, 0, 2);
}
var GFX_HIGH = true;                   // tiers 1 and 2, refreshed per frame
var GFX_CINE = true;                   // tier 2 only
var EDGE = 'rgba(6,9,15,.55)', EDGE_W = 1.7;

/* ==========================================================================
   THE LIGHTING RIG
   A game engine does not shade a character with one hardcoded gradient; it
   lights a scene, and every surface answers to that scene's lights. This is
   the same idea in 2D. Each stage owns a rig -- a key, a fill, a rim, an
   exposure and a film response -- and every fighter, prop and post pass reads
   from it. Change the rig and the whole stage changes with it, which is why
   Marina at sunset and Failaka at night cannot look like the same fight in a
   different wallpaper.

     key    the sun, or the strip light overhead. Direction + colour.
     fill   the sky bouncing back into the shadow side. Always cooler, always
            weaker; this is what stops shadows going dead black.
     rim    a light behind the fighter catching the silhouette edge. This is
            the single biggest reason engine characters read as solid rather
            than as stickers, so every stage has one.
     toe    where black actually sits. Film never reaches 0,0,0 -- it lands on
            a tinted near-black, and lifting the toe is most of what makes an
            image look photographed instead of drawn.
     shoulder  where white rolls off. Highlights bend toward the key's colour
            instead of clipping to paper white.
     bloom  how much the bright end bleeds.
     haze   distance blur on the far layer -- depth of field, cheaply.
   ========================================================================== */
var RIG_DEFAULT = {
  key:  { x:-0.48, y:-0.88, col:'#fff4de', power:1.00 },
  fill: { col:'#7d93c8', power:0.34 },
  rim:  { col:'#ffe3ad', power:0.55 },
  toe:      'rgba(14,18,30,.34)',
  shoulder: 'rgba(255,247,232,.90)',
  grade: [[0,'rgba(84,132,235,.13)'], [0.5,'rgba(150,150,175,.02)'], [1,'rgba(255,150,66,.12)']],
  bloom: 0.40, exposure: 1.03, contrast: 1.12, saturate: 1.10, haze: 2.0

var RIG = RIG_DEFAULT;

/* Set once per frame from the stage's theme, so nothing downstream has to
   know which stage it is drawing -- it just asks the rig. */
function useRig(r){
  RIG = r || RIG_DEFAULT;
  LIGHT.x = RIG.key.x; LIGHT.y = RIG.key.y;
  if(!RIG._lit) RIG._lit = {};
}

/* How one base colour answers this rig: the five stops a lit surface needs,
   worked out once per colour per stage rather than per limb per frame. The
   rig does not change during a fight, so neither do these, and a fight draws
   the same two dozen colours a few hundred times a second. */
function litOf(col){
  if(!RIG._lit) RIG._lit = {};
  var c = RIG._lit[col];
  if(c) return c;
  var K = RIG.key, FL = RIG.fill, RM = RIG.rim;
  c = {
    key:   mix(shade(col, 0.30 * K.power), K.col, 0.24),
    keyR:  mix(shade(col, 0.34 * K.power), K.col, 0.26),
    core:  shade(col, -0.36),
    coreR: shade(col, -0.46),
    fill:  mix(shade(col, -0.22), FL.col, 0.34 * FL.power),
    rim1:  mix(col, RM.col, 0.66 * RM.power),
    rim2:  mix(col, RM.col, 0.38 * RM.power),
    rimS1: mix(col, RM.col, 0.26 * RM.power),
    rimS2: mix(col, RM.col, 0.13 * RM.power),
    mid:   shade(col, -0.02)
  };
  RIG._lit[col] = c;
  return c;
}

function capsule(x1,y1,x2,y2,r1,r2){
  var n = Math.atan2(y2-y1, x2-x1) + Math.PI/2;
  ctx.beginPath();
  ctx.arc(x1, y1, r1, n, n + Math.PI, false);
  ctx.arc(x2, y2, r2, n + Math.PI, n + Math.PI*2, false);
  ctx.closePath();
}

/* A limb segment shaded as a lit cylinder, tapering r1 -> r2. */
function tube(x1,y1,x2,y2,r1,r2,col,bounce){
  capsule(x1,y1,x2,y2,r1,r2);
  if(!GFX_HIGH){ ctx.fillStyle = col; ctx.fill(); }
  else {
    var a = Math.atan2(y2-y1, x2-x1);
    var nx = Math.cos(a + Math.PI/2), ny = Math.sin(a + Math.PI/2);
    if(nx*LIGHT.x + ny*LIGHT.y < 0){ nx = -nx; ny = -ny; }      // face the light
    var mx = (x1+x2)/2, my = (y1+y2)/2, r = Math.max(r1,r2) * 1.05;
    var g = ctx.createLinearGradient(mx + nx*r, my + ny*r, mx - nx*r, my - ny*r);
    // Stop 0 faces the key, stop 1 is the silhouette edge in shadow. Between
    // them the surface turns away from one light and into the next.
    var L = litOf(col);
    g.addColorStop(0,    L.key);
    g.addColorStop(0.50, col);
    g.addColorStop(0.78, L.core);                                // core shadow
    g.addColorStop(0.88, bounce === undefined ? L.fill
                       : mix(shade(col, bounce), RIG.fill.col, 0.34 * RIG.fill.power));
    // The rim is a band, not a stop. A single stop at 1.0 lands entirely under
    // the edge stroke and vanishes -- which is exactly what happened the first
    // time. Peaking at 0.95 leaves the bright edge visible either side of it.
    g.addColorStop(0.95, L.rim1);
    g.addColorStop(1,    L.rim2);
    ctx.fillStyle = g; ctx.fill();
  }
  ctx.strokeStyle = EDGE; ctx.lineWidth = EDGE_W; ctx.stroke();
}

/* A filled shape lit as a volume — the light sits off-centre toward LIGHT. */
function litShape(path, col, cx, cy, r){
  path();
  if(!GFX_HIGH){ ctx.fillStyle = col; ctx.fill(); }
  else {
    var g = ctx.createRadialGradient(cx + LIGHT.x*r*0.5, cy + LIGHT.y*r*0.5, r*0.10,
                                     cx, cy, r*1.18);
    var LS = litOf(col);
    g.addColorStop(0,    LS.keyR);
    g.addColorStop(0.55, LS.mid);
    g.addColorStop(0.82, LS.coreR);
    g.addColorStop(0.94, LS.rimS1);
    g.addColorStop(1,    LS.rimS2);
    ctx.fillStyle = g; ctx.fill();
  }
  ctx.strokeStyle = EDGE; ctx.lineWidth = EDGE_W; ctx.stroke();
}

/* Contact darkening where two forms meet. */
/* Occlusion is light that did not arrive, so it is the colour of the light
   that would have -- the ambient fill, minus itself. Pure black occlusion is
   the tell that a scene was drawn rather than lit, and it is why the joints
   used to read as holes rather than as creases. The offset puts the crease
   on the side the key cannot reach. */
function ao(x, y, r, amt){
  if(!GFX_HIGH) return;
  var a = amt || 0.32;
  var ox = -LIGHT.x * r * 0.18, oy = -LIGHT.y * r * 0.18;
  var c = aoCol();
  var g = ctx.createRadialGradient(x + ox, y + oy, r*0.15, x + ox, y + oy, r);
  g.addColorStop(0, 'rgba(' + c + ',' + a + ')');
  g.addColorStop(1, 'rgba(' + c + ',0)');
  ctx.fillStyle = g;
  circle(x + ox, y + oy, r); ctx.fill();
}
function aoCol(){
  if(RIG._ao) return RIG._ao;
  var c = rgbOf(RIG.fill.col) || [0,0,0];
  // a fifth of the fill: dark enough to read as contact, coloured enough to
  // belong to the same scene as everything else
  RIG._ao = ((c[0]*0.2)|0) + ',' + ((c[1]*0.2)|0) + ',' + ((c[2]*0.2)|0);
  return RIG._ao;
}
function softLine(x1,y1,x2,y2,w,col){
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}

function limbEnd(x,y,a1,l1,a2,l2){
  var ex = x + Math.cos(a1)*l1, ey = y + Math.sin(a1)*l1;
  return { x:ex + Math.cos(a1+a2)*l2, y:ey + Math.sin(a1+a2)*l2 };
}
/* Two-bone limb with tapering thickness and a muscle belly on the upper bone.
   `sleeve` draws a short shirt sleeve over the top of the upper bone. */
function bone(x,y,a1,l1,a2,l2,r0,r1,r2,col,muscle,sleeve){
  var ex = x + Math.cos(a1)*l1, ey = y + Math.sin(a1)*l1;
  var hx = ex + Math.cos(a1+a2)*l2, hy = ey + Math.sin(a1+a2)*l2;
  tube(x, y, ex, ey, r0, r1, col);
  if(muscle && GFX_HIGH){
    var t = 0.42;
    var bx = x + (ex-x)*t, by = y + (ey-y)*t;
    var n = a1 + Math.PI/2;
    ctx.save();
    ctx.globalAlpha = 0.22;
    tube(x + (ex-x)*0.20, y + (ey-y)*0.20, bx, by, r0*0.40, r0*0.80, shade(col, 0.14));
    ctx.restore();
  }
  if(sleeve){
    var st = 0.46;                                    // sleeve ends high on the bicep
    var sx = x + (ex-x)*st, sy = y + (ey-y)*st;
    var sr = lerp(r0, r1, st);
    tube(x - Math.cos(a1)*2, y - Math.sin(a1)*2, sx, sy, r0 + 2.2, sr + 1.4, sleeve);
    if(GFX_HIGH){
      ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1.6;
      var n2 = a1 + Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(sx + Math.cos(n2)*(sr+1.4), sy + Math.sin(n2)*(sr+1.4));
      ctx.lineTo(sx - Math.cos(n2)*(sr+1.4), sy - Math.sin(n2)*(sr+1.4));
      ctx.stroke();
    }
    if(GFX_HIGH){
      ctx.fillStyle = 'rgba(255,255,255,.09)';        // deltoid under the sleeve
      ctx.beginPath();
      ctx.ellipse(x + (ex-x)*0.22, y + (ey-y)*0.22, r0*0.42, r0*0.72, a1, 0, 6.2832);
      ctx.fill();
    }
    ao(sx, sy, sr*2.0, 0.20);
  }
  if(r1 > 6) ao(ex, ey, r1*2.1, 0.26);
  tube(ex, ey, hx, hy, r1, r2, col);
  if(muscle && GFX_HIGH && r1 > 6){
    // forearm: a tendon line and a brachioradialis swell under the elbow
    var fa = a1 + a2, fn = fa - Math.PI/2;
    var fx = ex + Math.cos(fa)*l2*0.34, fy = ey + Math.sin(fa)*l2*0.34;
    ctx.save();
    ctx.globalAlpha = 0.20;
    tube(ex + Math.cos(fa)*l2*0.06, ey + Math.sin(fa)*l2*0.06, fx, fy, r1*0.36, r1*0.62, shade(col, 0.16));
    ctx.restore();
    ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(ex + Math.cos(fn)*r1*0.25 + Math.cos(fa)*l2*0.30, ey + Math.sin(fn)*r1*0.25 + Math.sin(fa)*l2*0.30);
    ctx.lineTo(hx + Math.cos(fn)*r2*0.35 - Math.cos(fa)*l2*0.12, hy + Math.sin(fn)*r2*0.35 - Math.sin(fa)*l2*0.12);
    ctx.stroke();
  }
  return { x:hx, y:hy, ex:ex, ey:ey };
}

/* Whatever Ahmed picked up, held in the lead hand and pointing the way the
   forearm does, so it swings with the punch rather than floating beside it. */
function weaponInHand(x, y, ang, key){
  var W = ASSET_WEAPONS[key];
  if(!W) return;

/* The Hawk Fist burning. Three tongues on a shared wobble, brightest at the
   core, so it reads as fire rather than an orange blob — and it sits behind
   the hand so the knuckles stay legible through it. */
function handFlame(x, y, ang, heat){
  var t = gameTime * 11;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  var g = ctx.createRadialGradient(2, 0, 1, 2, 0, 26 * heat);
  g.addColorStop(0, 'rgba(255,238,190,.85)');
  g.addColorStop(0.45, 'rgba(255,150,44,.42)');
  g.addColorStop(1, 'rgba(200,40,10,0)');
  ctx.fillStyle = g;
  circle(2, 0, 26 * heat); ctx.fill();
  var cols = ['rgba(255,196,72,.92)', 'rgba(255,124,32,.86)', 'rgba(255,238,196,.95)'];
  for(var i = 0; i < 3; i++){
    var w = 5.2 - i * 1.1, len = (20 - i * 4.5) * heat;
    var sway = Math.sin(t + i * 2.1) * 3.2;
    ctx.fillStyle = cols[i];
    ctx.beginPath();
    ctx.moveTo(-3, -w);
    ctx.quadraticCurveTo(len * 0.55, -w * 0.8 + sway, len, sway * 0.5);
    ctx.quadraticCurveTo(len * 0.55, w * 0.8 + sway, -3, w);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* Muay-Thai shin wraps: cloth over the lower leg with the binding showing.
   Drawn between the leg and the shoe so the shoe still covers the ankle. */
function shinWrap(x,y,a1,l1,a2,l2,r1,r2,col){
  var kx = x + Math.cos(a1)*l1, ky = y + Math.sin(a1)*l1;
  var a = a1 + a2;
  var t0 = 0.16, t1 = 0.90;
  var sx = kx + Math.cos(a)*l2*t0, sy = ky + Math.sin(a)*l2*t0;
  var ex = kx + Math.cos(a)*l2*t1, ey = ky + Math.sin(a)*l2*t1;
  tube(sx, sy, ex, ey, lerp(r1,r2,t0)+1.4, lerp(r1,r2,t1)+1.0, col);
  if(!GFX_HIGH) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,.24)'; ctx.lineCap = 'round';
  var n = a - Math.PI/2;
  for(var i=0;i<4;i++){
    var t = t0 + (t1-t0) * (0.18 + i*0.22);
    var px = kx + Math.cos(a)*l2*t, py = ky + Math.sin(a)*l2*t;
    var rr = lerp(r1, r2, t) + 1.2;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(px + Math.cos(n)*rr, py + Math.sin(n)*rr);
    ctx.lineTo(px - Math.cos(n)*rr, py - Math.sin(n)*rr);
    ctx.stroke();
  }
  ctx.restore();
}

/* Sportswear detail for a trouser leg: a stripe down the outer seam, a crease
   at the knee and a cuff at the ankle. Called after bone() and before shoe(),
   so the shoe covers the stripe's end and the waistband covers its start. */
function trouserStripe(x,y,a1,l1,a2,l2,r0,r1,r2,col){
  var kx = x + Math.cos(a1)*l1, ky = y + Math.sin(a1)*l1;
  var ex = kx + Math.cos(a1+a2)*l2, ey = ky + Math.sin(a1+a2)*l2;
  var n1 = a1 - Math.PI/2, n2 = a1 + a2 - Math.PI/2;       // toward the front of the leg
  var o1 = r0*0.26, o2 = r1*0.26, o3 = r2*0.30;
  var sx = x + Math.cos(a1)*l1*0.16, sy = y + Math.sin(a1)*l1*0.16;
  var fx = kx + Math.cos(a1+a2)*l2*0.86, fy = ky + Math.sin(a1+a2)*l2*0.86;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = col; ctx.lineWidth = 2.1; ctx.globalAlpha = 0.86;
  ctx.beginPath();
  ctx.moveTo(sx + Math.cos(n1)*o1, sy + Math.sin(n1)*o1);
  ctx.lineTo(kx + Math.cos(n1)*o2*0.7 + Math.cos(n2)*o2*0.3, ky + Math.sin(n1)*o2*0.7 + Math.sin(n2)*o2*0.3);
  ctx.lineTo(fx + Math.cos(n2)*o3, fy + Math.sin(n2)*o3);
  ctx.stroke();
  if(GFX_HIGH){
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(0,0,0,.26)'; ctx.lineWidth = 1.3;      // knee crease
    ctx.beginPath();
    ctx.moveTo(kx + Math.cos(n1)*r1*0.55, ky + Math.sin(n1)*r1*0.55);
    ctx.quadraticCurveTo(kx + Math.cos(a1)*3, ky + Math.sin(a1)*3,
                         kx - Math.cos(n1)*r1*0.55, ky - Math.sin(n1)*r1*0.55);
    ctx.stroke();
    var cx = kx + Math.cos(a1+a2)*l2*0.80, cy = ky + Math.sin(a1+a2)*l2*0.80;
    ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1.4;  // ankle cuff
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(n2)*r2*0.95, cy + Math.sin(n2)*r2*0.95);
    ctx.lineTo(cx - Math.cos(n2)*r2*0.95, cy - Math.sin(n2)*r2*0.95);
    ctx.stroke();
  }
  ctx.restore();
}

function shoe(end, ang, colr){
  ctx.save();

    ctx.quadraticCurveTo(18, 5, 12, 6);
    ctx.lineTo(-4, 6);
    ctx.quadraticCurveTo(-8, 5, -7, -6);

    roundRect(-6, 2, 22, 3.2, 1.6); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.22)';         // laces
    ctx.lineWidth = 1.1;
    for(var i=0;i<3;i++){
      ctx.beginPath(); ctx.moveTo(1 + i*4, -5.5); ctx.lineTo(4 + i*4, -1.5); ctx.stroke();
    }

/* Blend a colour toward the stage haze so distant fighters sit back. */
var _mixCache = {}, _mixN = 0;
function mixc(hex, other, amt){
  var key = hex + '|' + other + '|' + amt;
  var hit = _mixCache[key];
  if(hit !== undefined) return hit;
  var out = mixCalc(hex, other, amt);
  if(_mixN > 2000){ _mixCache = {}; _mixN = 0; }
  _mixCache[key] = out; _mixN++;
  return out;
}
function mixCalc(hex, other, amt){
  function rgb(c){
    if(c[0] === '#'){
      var n = parseInt(c.slice(1), 16);
      return [(n>>16)&255, (n>>8)&255, n&255];
    }
    var m = c.match(/-?\d+/g);
    return m ? [+m[0], +m[1], +m[2]] : [128,128,128];
  }
  var A = rgb(hex), B = rgb(other);
  return 'rgb(' + Math.round(A[0]+(B[0]-A[0])*amt) + ',' +
                  Math.round(A[1]+(B[1]-A[1])*amt) + ',' +
                  Math.round(A[2]+(B[2]-A[2])*amt) + ')';
}

/* Poses are authored facing right. Each returns joint angles in radians. */
var P_GUARD = { armLead:[0.75,-1.95], armRear:[0.95,-2.15], lean:0.06, hipY:0 };

function attackPose(key, k, t){
  var p = {
    armLead:[0.75,-1.95], armRear:[0.95,-2.15], legLead:null, legRear:null,
    lean:0.06, hipY:0, shift:0, spin:0
  };
  if(key === 'jab'){
    p.armLead = [lerp(0.75, -0.02, k), lerp(-1.95, 0.02, k)];
    p.shift = k*9; p.lean = 0.06 + k*0.10;
  } else if(key === 'cross'){
    p.armRear = [lerp(0.95, 0.02, k), lerp(-2.15, 0.0, k)];
    p.shift = k*14; p.lean = 0.06 + k*0.16;
  } else if(key === 'hook'){
    var sw = lerp(-1.1, 0.55, k);
    p.armRear = [sw, lerp(-0.9, 0.35, k)];
    p.shift = k*12; p.lean = 0.06 + k*0.22;
  } else if(key === 'kick'){
    p.legRear = [lerp(1.75, -0.16, k), lerp(-0.20, 0.02, k)];
    p.lean = 0.06 - k*0.42; p.hipY = -k*7; p.armLead = [1.35,-1.1]; p.armRear=[2.2,-0.5];
  } else if(key === 'knee'){
    p.legRear = [lerp(1.75, -0.85, k), lerp(-0.20, 1.65, k)];
    p.lean = 0.06 + k*0.24; p.hipY = -k*10; p.armRear = [0.4,-0.3]; p.armLead=[0.55,-0.4];
  } else if(key === 'special'){
    p.legRear = [lerp(1.75, -0.10, k), lerp(-0.20, 0.0, k)];
    p.spin = t * 6.2832 * 1.15;
    p.lean = 0.06 - k*0.3; p.hipY = -k*14;
    p.armLead = [2.0,-0.6]; p.armRear = [-1.4,-0.5];
  }
  return p;
}

/* ------------------------------------------------------------------- render */
function screenOf(f){
  var s = (0.98 + f.z * 0.40) * f.sc;
  return { x:f.x, y:FLOOR_TOP + f.z * FLOOR_H - f.h, s:s };
}

var STRIKE_LIMB = { jab:'lead', cross:'rear', hook:'rear',
                    kick:'foot', knee:'foot', special:'foot' };

/* ---- boxing glove: pad, thumb, cuff, specular ---------------------------- */
/* The hand. `hand` picks the style: a bare fist for street clothes, a taped
   fist for someone who still wraps up, or the boxing glove for a gym fight. */
function hand(x, y, ang, style, r, skinCol, tapeCol){
  if(!style || style === 'glove') return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  litShape(function(){
    ctx.beginPath();
    ctx.moveTo(-r*0.85, -r*0.46);
    ctx.quadraticCurveTo(r*0.30, -r*0.92, r*0.86, -r*0.30);
    ctx.quadraticCurveTo(r*1.02, r*0.36, r*0.28, r*0.74);
    ctx.quadraticCurveTo(-r*0.55, r*0.84, -r*0.85, r*0.16);
    ctx.closePath();
  }, skinCol, 0, 0, r*1.25);
  if(GFX_HIGH){
    ctx.strokeStyle = 'rgba(0,0,0,.24)'; ctx.lineWidth = 1.1;   // knuckles
    for(var k=0;k<3;k++){
      var ky = -r*0.30 + k*r*0.34;
      ctx.beginPath();
      ctx.moveTo(r*0.30, ky); ctx.quadraticCurveTo(r*0.68, ky+r*0.06, r*0.80, ky+r*0.02);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,.20)';                          // thumb across
    ctx.beginPath();
    ctx.ellipse(-r*0.10, r*0.50, r*0.40, r*0.22, 0.42, 0, 6.2832); ctx.fill();
  }
  if(style === 'wraps'){
    ctx.save();
    ctx.strokeStyle = tapeCol || '#e8e2d4'; ctx.lineCap = 'round';
    ctx.lineWidth = r*0.22;
    for(var w=0;w<3;w++){                                        // tape over the knuckles
      var wx = -r*0.58 + w*r*0.36;
      ctx.beginPath();
      ctx.moveTo(wx, -r*0.52); ctx.lineTo(wx + r*0.14, r*0.62);
      ctx.stroke();
    }
    if(GFX_HIGH){
      ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-r*0.70, -r*0.10); ctx.lineTo(r*0.10, r*0.02); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

function glove(x, y, ang, col, r){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  litShape(function(){
    ctx.beginPath();
    ctx.moveTo(-r*0.9, -r*0.5);
    ctx.quadraticCurveTo(r*0.5, -r*1.15, r*1.05, -r*0.25);
    ctx.quadraticCurveTo(r*1.25, r*0.55, r*0.35, r*0.9);
    ctx.quadraticCurveTo(-r*0.6, r*1.0, -r*0.9, r*0.2);
    ctx.closePath();
  }, col, 0, 0, r*1.4);
  if(GFX_HIGH){
    ctx.fillStyle = shade(col, -0.30);                    // thumb
    ctx.beginPath();
    ctx.ellipse(-r*0.15, r*0.62, r*0.42, r*0.30, 0.5, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1.2;   // seam
    ctx.beginPath();
    ctx.moveTo(-r*0.5, -r*0.15);
    ctx.quadraticCurveTo(r*0.2, r*0.1, r*0.85, -r*0.2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.30)';              // specular
    ctx.beginPath();
    ctx.ellipse(-r*0.25, -r*0.48, r*0.38, r*0.22, -0.35, 0, 6.2832); ctx.fill();
    ctx.fillStyle = shade(col, -0.42);                    // wrist cuff
    roundRect(-r*1.35, -r*0.42, r*0.55, r*0.86, r*0.2); ctx.fill();
  }
  ctx.restore();
}

function drawFighter(f, camX){
  var sp = screenOf(f);
  var X = sp.x - camX, Y = sp.y, S = sp.s;
  var groundY = FLOOR_TOP + f.z*FLOOR_H;

  // ---- contact shadow -----------------------------------------------------
  // Cast away from the key, tight and dark at the feet, wide and weak in the
  // air. Two ellipses: the hard contact patch and the soft penumbra. A shadow
  // is never black -- it is the fill light minus the key, so it takes the
  // rig's fill colour and only the contact patch approaches neutral.
  var lift = clamp(1 - f.h/260, 0.30, 1);
  if(GFX_HIGH){
    var off = -LIGHT.x * 26 * S * (1.25 - lift*0.55);   // longer when airborne
    var soft = 1 + (1 - lift) * 1.35;
    ctx.globalAlpha = 0.30 * lift;
    ctx.fillStyle = shade(RIG.fill.col, -0.72);
    ctx.beginPath(); ctx.ellipse(X + off*0.6, groundY + 4, 36*S*soft, 11*S*soft, 0, 0, 6.2832); ctx.fill();
    // the contact patch itself: only where the foot actually meets the ground
    ctx.globalAlpha = 0.34 * lift * lift;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(X, groundY + 3, 17*S, 5.2*S, 0, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  } else {
    ctx.globalAlpha = 0.30 * lift; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(X, groundY + 4, 26*S, 8*S, 0, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }

  var down = (f.state === 'down');
  var t = f.anim;
  var p, k = 0, striking = false;

  if(f.state === 'attack' && f.atk){
    var total = f.atk.su + f.atk.ac + f.atk.rc;
    if(f.atkT < f.atk.su)                 k = ease(f.atkT / f.atk.su);
    else if(f.atkT < f.atk.su + f.atk.ac) k = 1;
    else                                  k = 1 - ease(clamp((f.atkT - f.atk.su - f.atk.ac)/f.atk.rc,0,1));
    p = attackPose(f.atkKey, k, clamp(f.atkT/total,0,1));
    striking = f.atkT > f.atk.su * 0.45 && f.atkT < f.atk.su + f.atk.ac + f.atk.rc * 0.35;
  } else {
    p = { armLead:P_GUARD.armLead.slice(), armRear:P_GUARD.armRear.slice(),
          legLead:null, legRear:null, lean:P_GUARD.lean, hipY:0, shift:0, spin:0 };
    if(f.blocking && f.state !== 'hit'){
      p.armLead = [1.30,-2.05]; p.armRear = [1.42,-2.15]; p.lean = 0.16; p.hipY = 3;
    }
    if(f.state === 'hit'){
      var hk = clamp(f.hitT/0.28, 0, 1);
      p.lean = 0.06 - hk*0.5; p.armLead = [-0.5,-0.5]; p.armRear = [-0.9,-0.4]; p.hipY = hk*4;
    }
  }

  var bob = (f.moving && !down) ? Math.sin(t*11)*2.2 : Math.sin(t*2.4)*1.1;
  var hipY = -62 + p.hipY + bob;
  var shY  = -106 + p.hipY*0.6 + bob;
  var lean = p.lean;
  var shX  = p.shift + lean*22;
  var swing = f.moving ? Math.sin(t*11)*0.42 : 0;
  var legRear = p.legRear || [2.05 - swing, -0.42];
  var legLead = p.legLead || [1.10 + swing,  0.45];

  // ---- motion trail on the striking limb ---------------------------------
  var lim = STRIKE_LIMB[f.atkKey];
  if(striking && lim){
    var e = (lim === 'foot') ? limbEnd(-6, hipY, legRear[0], 34, legRear[1], 32)
          : (lim === 'lead') ? limbEnd(shX+4, shY+2, p.armLead[0], 26, p.armLead[1], 25)
                             : limbEnd(shX-6, shY, p.armRear[0], 26, p.armRear[1], 25);
    if(!f.trail) f.trail = [];
    f.trail.push({ x:sp.x + e.x*S*f.facing, y:Y + e.y*S, t:gameTime, s:S });
    if(f.trail.length > 16) f.trail.shift();
  }
  if(f.trail && f.trail.length){
    while(f.trail.length && gameTime - f.trail[0].t > 0.19) f.trail.shift();
    if(f.trail.length > 2){
      var tc = f.isPlayer ? '#ffe9a8' : shade(f.col.band, 0.35);
      for(var i=1;i<f.trail.length;i++){
        var a0 = f.trail[i-1], a1 = f.trail[i];
        var frac = i / f.trail.length;
        ctx.globalAlpha = frac * 0.5 * clamp(1 - (gameTime - a1.t)/0.19, 0, 1);
        ctx.strokeStyle = tc;
        ctx.lineWidth = 3 + frac * 12 * a1.s;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(a0.x - camX, a0.y); ctx.lineTo(a1.x - camX, a1.y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }

  // ---- palette, hazed by depth -------------------------------------------
  var col = f.col;
  var haze = (G.fight && THEME[G.fight.st.theme]) ? THEME[G.fight.st.theme].sky[1] : '#20283a';
  var hz = (1 - f.z) * 0.12;
  var skin = f.flash > 0 ? '#ffffff' : mixc(col.skin, haze, hz);
  var top  = f.flash > 0 ? '#ffe9e9' : mixc(col.top,  haze, hz);
  var bot  = f.flash > 0 ? '#ffe9e9' : mixc(col.bottom, haze, hz);
  var band = f.flash > 0 ? '#ffffff' : mixc(col.band, haze, hz);
  var skinDark = shade(skin, -0.16);
  var gloveCol = f.isPlayer ? C.red : band;
  // Trousers mean the legs are cloth, not skin; everyone else stays in shorts.
  var legCol     = f.pants ? bot : skin;
  var legColDark = f.pants ? shade(bot, -0.10) : skinDark;
  var shoeCol    = f.pants ? shade(bot, 0.34) : shade(bot, -0.34);
  var bd = f.build || 1;                    // limb thickness: 1 is lean

  ctx.save();
  ctx.translate(X, Y);
  ctx.scale(S * f.facing, S);
  if(down){
    var dk = clamp(1 - f.downT/0.9, 0, 1);
    ctx.translate(-14 - 16*dk, 0);
    ctx.rotate(-1.30 * dk);
  }
  if(p.spin) ctx.rotate(Math.sin(p.spin)*0.14);

  // ---- rear leg -----------------------------------------------------------
  var rf = bone(-6, hipY, legRear[0], 34, legRear[1], 32,
                12.0*bd, 8.6*bd, 6.0*bd, legColDark, true);
  if(f.stripe) trouserStripe(-6, hipY, legRear[0], 34, legRear[1], 32,
                            12.0*bd, 8.6*bd, 6.0*bd, shade(band, -0.28));
  if(f.shin) shinWrap(-6, hipY, legRear[0], 34, legRear[1], 32,
                      8.6*bd, 6.0*bd, shade(f.shin, -0.12));
  shoe(rf, legRear[0] + legRear[1], f.pants ? shade(shoeCol, -0.30) : shade(bot, -0.5));

  // ---- rear arm (behind the torso) ---------------------------------------
  var ra = bone(shX-6, shY, p.armRear[0], 26, p.armRear[1], 25,
                9.6*bd, 7.4*bd, 5.8*bd,
                skinDark, true, f.tee ? shade(top, -0.12) : null);
  if(f.hands) hand(ra.x, ra.y, p.armRear[0] + p.armRear[1], f.hands, 8.6,
                   shade(skinDark, -0.06), shade(band, -0.10));
  else glove(ra.x, ra.y, p.armRear[0] + p.armRear[1], shade(gloveCol, -0.22), 8.6);

  // ---- torso --------------------------------------------------------------
  ctx.save();
  ctx.translate(0, hipY);
  ctx.rotate(-lean);
  if(bd !== 1) ctx.scale(1 + (bd - 1) * 0.7, 1);   // widen chest, keep height
  var torsoPath = function(){
    ctx.beginPath();
    ctx.moveTo(-10, 4);
    ctx.bezierCurveTo(-15, -12, -19, -33, -14, -44);       // lat sweep
    ctx.quadraticCurveTo(-8, -51, 2, -51);                 // trap / shoulder
    ctx.bezierCurveTo(14, -51, 22, -44, 22, -33);          // deltoid cap
    ctx.bezierCurveTo(21, -22, 15, -9, 13, 4);             // hard taper to the waist
    ctx.closePath();
  };
  if(f.hoodie) hoodShape(top, band);
  litShape(torsoPath, top, 2, -26, 29);
  if(GFX_HIGH){
    ctx.save(); torsoPath(); ctx.clip();
    // chest fills the shirt — pec shelf and the split between them
    ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(-9, -30); ctx.quadraticCurveTo(3, -25, 19, -31); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,.30)'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(-8, -28); ctx.quadraticCurveTo(3, -23, 19, -29); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, -46); ctx.lineTo(4, -28); ctx.stroke();   // sternum
    ctx.strokeStyle = 'rgba(0,0,0,.20)'; ctx.lineWidth = 1.5;                // fabric folds
    ctx.beginPath(); ctx.moveTo(-11, -12); ctx.quadraticCurveTo(2, -6, 14, -11); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-9, -3); ctx.quadraticCurveTo(3, 1, 12, -2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.07)';                                 // sheen
    ctx.beginPath(); ctx.ellipse(12, -34, 7, 14, -0.25, 0, 6.2832); ctx.fill();
    if(f.patch){                                                              // flag patch on the pec
      var px = 7.5, py = -40.5;
      ctx.fillStyle = '#007a3d'; ctx.fillRect(px, py,       7.5, 1.6);
      ctx.fillStyle = '#f3f5f8'; ctx.fillRect(px, py + 1.6, 7.5, 1.6);
      ctx.fillStyle = '#c8102e'; ctx.fillRect(px, py + 3.2, 7.5, 1.6);
      ctx.fillStyle = '#101216';
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px+2.4, py+1.6); ctx.lineTo(px+2.4, py+3.2);
      ctx.lineTo(px, py+4.8); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 0.6;
      ctx.strokeRect(px, py, 7.5, 4.8);
    }
    ctx.fillStyle = 'rgba(0,0,0,.26)';                                       // armhole
    ctx.beginPath(); ctx.ellipse(20, -40, 5, 10, -0.3, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1.6;          // hem
    ctx.beginPath(); ctx.moveTo(-10, 2); ctx.quadraticCurveTo(2, 6, 13, 2); ctx.stroke();
    // crew neckline
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-4, -49); ctx.quadraticCurveTo(4, -43, 12, -48); ctx.stroke();
    ctx.restore();
  }
  if(f.jacket) jacketShape(top);
  ctx.restore();

  // ---- shorts -------------------------------------------------------------
  litShape(function(){
    ctx.beginPath();
    ctx.moveTo(-14, hipY-8);
    ctx.lineTo(15, hipY-8);
    ctx.quadraticCurveTo(20, hipY+10, 18, hipY+29);        // longer, mid-thigh cut
    ctx.quadraticCurveTo(9, hipY+33, 1, hipY+25);
    ctx.quadraticCurveTo(-7, hipY+33, -16, hipY+29);
    ctx.quadraticCurveTo(-19, hipY+10, -14, hipY-8);
    ctx.closePath();
  }, bot, 0, hipY+6, 24);
  if(GFX_HIGH){
    ctx.fillStyle = band;                                    // waistband accent
    roundRect(-14, hipY-9, 29, 5, 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.20)';
    roundRect(-13, hipY-8.4, 10, 1.6, 0.8); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.30)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(1, hipY-2); ctx.lineTo(1, hipY+26); ctx.stroke();
    if(!f.pants){                                  // shorts have a hem; trousers do not
      ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-16, hipY+28); ctx.quadraticCurveTo(-9, hipY+31, -2, hipY+26); ctx.stroke();
    }
    ao(0, hipY-6, 20, 0.20);
  }

  // ---- lead leg -----------------------------------------------------------
  var lf = bone(6, hipY+4, legLead[0], 34, legLead[1], 32,
                12.8*bd, 9.2*bd, 6.4*bd, legCol, true);
  if(f.stripe) trouserStripe(6, hipY+4, legLead[0], 34, legLead[1], 32,
                            12.8*bd, 9.2*bd, 6.4*bd, band);
  if(f.shin) shinWrap(6, hipY+4, legLead[0], 34, legLead[1], 32,
                      9.2*bd, 6.4*bd, f.shin);
  shoe(lf, legLead[0] + legLead[1], shoeCol);

  // ---- head ---------------------------------------------------------------
  var hx = shX + lean*10, hy = shY - 24;
  tube(shX, shY - 4, hx + 1, hy + 12, 7.4, 6.2, skinDark);      // neck
  ao(hx + 1, hy + 13, 9, 0.30);

  var skullPath = function(){
    ctx.beginPath();
    ctx.moveTo(hx-12, hy-1);
    ctx.bezierCurveTo(hx-13, hy-14, hx-6, hy-18, hx+2, hy-18);
    ctx.bezierCurveTo(hx+11, hy-18, hx+15, hy-10, hx+15, hy-1);
    ctx.bezierCurveTo(hx+15, hy+6, hx+12, hy+13, hx+4, hy+15);
    ctx.bezierCurveTo(hx-4, hy+16, hx-11, hy+9, hx-12, hy-1);
    ctx.closePath();
  };
  litShape(skullPath, skin, hx+1, hy-2, 17);

  // ear
  litShape(function(){
    ctx.beginPath(); ctx.ellipse(hx-9, hy+2, 3.6, 5, 0.15, 0, 6.2832); ctx.closePath();
  }, shade(skin, -0.10), hx-9, hy+2, 5);

  if(GFX_HIGH && !f.sil){          // f.sil renders a featureless silhouette
    ctx.save(); skullPath(); ctx.clip();
    ctx.fillStyle = 'rgba(0,0,0,.16)';                       // temple / cheek hollow
    ctx.beginPath(); ctx.ellipse(hx+1, hy+8, 9, 5, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.10)';                 // cheekbone
    ctx.beginPath(); ctx.ellipse(hx+8, hy+4, 4.5, 2.6, -0.3, 0, 6.2832); ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(0,0,0,.26)';                       // brow ridge
    ctx.beginPath();
    ctx.moveTo(hx+5, hy-2.6); ctx.quadraticCurveTo(hx+10, hy-4.2, hx+13.5, hy-1.6);
    ctx.quadraticCurveTo(hx+10, hy-2.4, hx+5, hy-1.2); ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#f2ece1';                               // eye
    ctx.beginPath(); ctx.ellipse(hx+9.6, hy+1.2, 2.4, 1.8, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#2d1f14';
    circle(hx+10.4, hy+1.2, 1.35); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    circle(hx+9.9, hy+0.6, 0.5); ctx.fill();

    ctx.strokeStyle = 'rgba(0,0,0,.30)'; ctx.lineWidth = 1.2;  // nose bridge + tip
    ctx.beginPath();
    ctx.moveTo(hx+12.5, hy+0.5); ctx.quadraticCurveTo(hx+15.4, hy+4, hx+11.8, hy+5.6);
    ctx.stroke();
    ctx.strokeStyle = f.beard ? 'rgba(0,0,0,.45)' : 'rgba(70,35,28,.5)';
    ctx.lineWidth = 1.3;                                        // mouth
    ctx.beginPath();
    ctx.moveTo(hx+6.5, hy+10.2); ctx.quadraticCurveTo(hx+10, hy+11, hx+12.4, hy+9.6);
    ctx.stroke();

    var hair = f.hair || (f.isPlayer ? '#241a12' : shade(col.band, -0.5));
    if(f.bald){
      // Nothing to draw but the light on the scalp -- and a tan line, since a
      // shaved head still shows where the hair used to stop.
      ctx.save(); skullPath(); ctx.clip();
      ctx.fillStyle = 'rgba(255,255,255,.13)';
      ctx.beginPath(); ctx.ellipse(hx+1, hy-11, 8, 4.5, -0.25, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.10)';
      ctx.beginPath();
      ctx.moveTo(hx-13, hy-6); ctx.quadraticCurveTo(hx+2, hy-13, hx+16, hy-7);
      ctx.lineTo(hx+16, hy-20); ctx.lineTo(hx-13, hy-20); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if(f.quiff){
      // swept-up quiff with faded sides
      ctx.fillStyle = 'rgba(0,0,0,.30)';                      // fade at the temple
      ctx.beginPath();
      ctx.moveTo(hx-11, hy-3);
      ctx.quadraticCurveTo(hx-10, hy-11, hx-2, hy-12.5);
      ctx.quadraticCurveTo(hx-7, hy-8, hx-8, hy-2);
      ctx.closePath(); ctx.fill();
      litShape(function(){
        ctx.beginPath();
        ctx.moveTo(hx-12, hy-4);
        ctx.bezierCurveTo(hx-14, hy-15, hx-7, hy-22, hx+2, hy-22);
        ctx.bezierCurveTo(hx+11, hy-23, hx+17, hy-19, hx+16.5, hy-11);   // quiff peak
        ctx.lineTo(hx+14.5, hy-9);
        ctx.quadraticCurveTo(hx+12, hy-14, hx+3, hy-14);                 // hairline
        ctx.quadraticCurveTo(hx-6, hy-13.5, hx-9, hy-5);
        ctx.closePath();
      }, hair, hx+2, hy-17, 17);
      ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1.3;
      ctx.beginPath();                                        // quiff sweep
      ctx.moveTo(hx-4, hy-18); ctx.quadraticCurveTo(hx+6, hy-21, hx+14, hy-14); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.09)'; ctx.lineWidth = 1.1;
      ctx.beginPath();                                        // a second, lower strand
      ctx.moveTo(hx-7, hy-14); ctx.quadraticCurveTo(hx+3, hy-17.5, hx+11, hy-12); ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 1.2;
      ctx.beginPath();                                        // roots along the hairline
      ctx.moveTo(hx+13.5, hy-9.5); ctx.quadraticCurveTo(hx+11, hy-13.2, hx+3, hy-13.2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(hx-6, hy-14); ctx.quadraticCurveTo(hx+3, hy-18, hx+11, hy-13); ctx.stroke();
    } else {
      litShape(function(){
        ctx.beginPath();
        ctx.moveTo(hx-12.5, hy-3);
        ctx.bezierCurveTo(hx-14, hy-16, hx-5, hy-20, hx+3, hy-19);
        ctx.bezierCurveTo(hx+12, hy-19, hx+15.6, hy-13, hx+15, hy-9);
        ctx.quadraticCurveTo(hx+11, hy-13.5, hx+3, hy-13);
        ctx.quadraticCurveTo(hx-6, hy-12.5, hx-9.5, hy-4);
        ctx.closePath();
      }, hair, hx, hy-13, 16);
      ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 1;
      for(var hs=0; hs<3; hs++){
        ctx.beginPath();
        ctx.moveTo(hx-8+hs*5, hy-17); ctx.quadraticCurveTo(hx-4+hs*5, hy-14, hx-1+hs*5, hy-12.5);
        ctx.stroke();
      }
    }

    if(f.headband){
      litShape(function(){
        ctx.beginPath();
        ctx.moveTo(hx-13, hy-6.5);
        ctx.quadraticCurveTo(hx+2, hy-14.5, hx+16, hy-8);
        ctx.lineTo(hx+15.5, hy-2.5);
        ctx.quadraticCurveTo(hx+2, hy-9, hx-12.5, hy-1);
        ctx.closePath();
      }, f.headband, hx+1, hy-8, 16);
      if(GFX_HIGH){
        ctx.fillStyle = shade(f.headband, -0.35);       // knot trailing behind
        ctx.beginPath();
        ctx.moveTo(hx-12, hy-4); ctx.lineTo(hx-22, hy+2);
        ctx.lineTo(hx-21, hy+6); ctx.lineTo(hx-12, hy+1);
        ctx.closePath(); ctx.fill();
      }
    }

    if(f.cap){
      litShape(function(){                              // crown
        ctx.beginPath();
        ctx.moveTo(hx-12.5, hy-7);
        ctx.bezierCurveTo(hx-13, hy-21, hx-2, hy-24, hx+7, hy-21);
        ctx.bezierCurveTo(hx+14, hy-18, hx+16, hy-12, hx+15.5, hy-7);
        ctx.closePath();
      }, f.cap, hx, hy-16, 17);
      litShape(function(){                              // peak, over the brow
        ctx.beginPath();
        ctx.moveTo(hx+13, hy-9);
        ctx.quadraticCurveTo(hx+26, hy-8, hx+29, hy-3.5);
        ctx.quadraticCurveTo(hx+24, hy-4.6, hx+13, hy-5);
        ctx.closePath();
      }, shade(f.cap, -0.26), hx+20, hy-7, 12);
    }

    if(f.shades){

var _shadeCache = {}, _shadeN = 0;
function shade(hex, amt){
  var key = hex + '|' + amt;
  var hit = _shadeCache[key];
  if(hit !== undefined) return hit;
  var out = shadeCalc(hex, amt);
  if(_shadeN > 3000){ _shadeCache = {}; _shadeN = 0; }
  _shadeCache[key] = out; _shadeN++;
  return out;
}
/* Blend two colours. Lights have colour, so shading has to be able to push a
   surface toward a light rather than only lighter or darker. */
var _mixCache = {}, _mixN = 0;
function mix(a, b, t){
  var key = a + '~' + b + '~' + t;
  var hit = _mixCache[key];
  if(hit !== undefined) return hit;
  var A = rgbOf(a), B = rgbOf(b);
  if(!A || !B) return a;
  var out = 'rgb(' + ((A[0] + (B[0]-A[0])*t)|0) + ',' +
                     ((A[1] + (B[1]-A[1])*t)|0) + ',' +
                     ((A[2] + (B[2]-A[2])*t)|0) + ')';
  if(_mixN > 3000){ _mixCache = {}; _mixN = 0; }
  _mixCache[key] = out; _mixN++;
  return out;
}
function rgbOf(hex){
  if(hex[0] === '#'){
    var h = hex.slice(1);
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n = parseInt(h, 16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  }
  var m = hex.match(/-?\d+/g);
  return (m && m.length >= 3) ? [+m[0], +m[1], +m[2]] : null;
}

function shadeCalc(hex, amt){
  var r, g, b;
  if(hex[0] === '#'){
    var n = parseInt(hex.slice(1), 16);
    r = (n>>16)&255; g = (n>>8)&255; b = n&255;
  } else {
    var m = hex.match(/-?\d+/g);
    if(!m || m.length < 3) return hex;
    r = +m[0]; g = +m[1]; b = +m[2];
  }
  if(amt < 0){ r*= (1+amt); g*= (1+amt); b*= (1+amt); }
  else { r += (255-r)*amt; g += (255-g)*amt; b += (255-b)*amt; }
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}

var STAGES = ASSET_STAGES;

function genSurvivalWave(n){
  var pool = ['thug','brawler'];
  if(n >= 2) pool.push('runner');
  if(n >= 3) pool.push('kicker');
  if(n >= 5) pool.push('grappler');
  if(n >= 6) pool.push('bouncer');
  if(n >= 7) pool.push('capo');
  if(n >= 9) pool.push('champ');
  if(n >= 13) pool.push('champ');
  var count = Math.min(6, 2 + Math.floor(n / 2));
  var e = [];
  for(var i=0;i<count;i++) e.push([pick(pool), 1]);
  if(n % 10 === 0) e.push(['boss', 1]);
  else if(n % 5 === 0) e.push(['saqr', 1]);
  return { at:-1, e:e, tier: Math.floor(n / 2) };
}

/* --------------------------------------------------------- parallax helpers */
function repeatX(spacing, par, camX, fn){
  var off = camX * par;
  var i0 = Math.floor(off / spacing) - 1;
  var n = Math.ceil(W / spacing) + 3;
  for(var i = i0; i < i0 + n; i++) fn(i * spacing - off, i);
}
function hashv(i, seed){
  var x = Math.sin(i * 127.1 + (seed||0) * 311.7) * 43758.5453;
  return x - Math.floor(x);
}

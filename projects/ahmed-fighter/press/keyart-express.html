<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AHMED — Kuwait Fighter · Key Art</title>
<meta name="hz:slide-selector" content=".poster">
<meta name="hz:canvas-width" content="1920">
<meta name="hz:canvas-height" content="1080">
<link rel="stylesheet" href="https://use.typekit.net/jgp0lrt.css">
<style>
  html, body { margin: 0; padding: 0; background: #05070b; }

  .poster {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background-color: #070910;
  }

  /* ---------------------------------------------------------- background */

  .bg-base {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    background-image: radial-gradient(1100px 780px at 68% 44%, #2b1b18 0%, #14121a 46%, #070910 100%);
  }

  .bg-warm {
    position: absolute; left: 780px; top: -60px; width: 1200px; height: 1200px;
    background-image: radial-gradient(circle at 50% 50%, rgba(232,184,73,0.30) 0%, rgba(200,16,46,0.14) 38%, rgba(0,0,0,0) 68%);
  }

  .bg-floor {
    position: absolute; left: 0; top: 828px; width: 1920px; height: 252px;
    background-image: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.62) 55%, rgba(0,0,0,0.92) 100%);
  }

  .bg-vignette {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    background-image: radial-gradient(1400px 900px at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 82%, rgba(0,0,0,0.86) 100%);
  }

  /* ------------------------------------------------------- flag hoist bar */

  .flag-black { position: absolute; left: 96px; top: 176px; width: 18px; height: 96px; background-color: #101216; }
  .flag-green { position: absolute; left: 96px; top: 272px; width: 18px; height: 96px; background-color: #007a3d; }
  .flag-white { position: absolute; left: 96px; top: 368px; width: 18px; height: 96px; background-color: #f3f5f8; }
  .flag-red   { position: absolute; left: 96px; top: 464px; width: 18px; height: 96px; background-color: #c8102e; }

  /* ----------------------------------------------------------- type block */

  .kicker {
    position: absolute; left: 160px; top: 186px; width: 900px;
    font-family: "acumin-pro", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500; font-size: 24px; letter-spacing: 9px;
    color: #8d93a1; text-transform: uppercase; margin: 0;
  }

  .wordmark {
    position: absolute; left: 152px; top: 232px; width: 1000px;
    font-family: "chamfer-gothic-ludlow", "acumin-pro", Impact, sans-serif;
    font-weight: 700; font-size: 268px; line-height: 268px; letter-spacing: 4px;
    color: #edbe57; margin: 0;
    text-shadow: 0 10px 42px rgba(200,16,46,0.42);
  }

  .rule {
    position: absolute; left: 160px; top: 528px; width: 268px; height: 5px;
    background-image: linear-gradient(90deg, #c8102e 0%, #edbe57 100%);
  }

  .headline {
    position: absolute; left: 158px; top: 560px; width: 940px;
    font-family: "oaks", "acumin-pro", Arial, sans-serif;
    font-weight: 700; font-size: 82px; line-height: 88px; letter-spacing: 7px;
    color: #f2f4f8; text-transform: uppercase; margin: 0;
  }

  .arabic {
    position: absolute; left: 158px; top: 668px; width: 940px;
    font-family: "co-arabic", "Segoe UI", Tahoma, sans-serif;
    font-weight: 700; font-size: 72px; line-height: 96px;
    color: #d6dbe4; margin: 0; direction: rtl; text-align: left;
  }

  .logline {
    position: absolute; left: 160px; top: 794px; width: 900px;
    font-family: "acumin-pro", "Helvetica Neue", Arial, sans-serif;
    font-weight: 400; font-size: 27px; line-height: 42px; letter-spacing: 1px;
    color: #a2a8b5; margin: 0;
  }

  .features {
    position: absolute; left: 160px; top: 900px; width: 1000px;
    font-family: "acumin-pro", "Helvetica Neue", Arial, sans-serif;
    font-weight: 600; font-size: 25px; letter-spacing: 6px;
    color: #edbe57; text-transform: uppercase; margin: 0;
  }

  .credit {
    position: absolute; left: 160px; top: 960px; width: 1000px;
    font-family: "acumin-pro", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500; font-size: 21px; letter-spacing: 5px;
    color: #6f7583; text-transform: uppercase; margin: 0;
  }

  .rating {
    position: absolute; left: 1690px; top: 936px; width: 132px; height: 84px;
    border: 3px solid #4a5060;
  }

  .rating-mark {
    position: absolute; left: 1690px; top: 946px; width: 132px;
    font-family: "chamfer-gothic-ludlow", "acumin-pro", Impact, sans-serif;
    font-weight: 700; font-size: 44px; line-height: 44px; letter-spacing: 2px;
    color: #aeb4c1; text-align: center; margin: 0;
  }

  .rating-note {
    position: absolute; left: 1690px; top: 992px; width: 132px;
    font-family: "acumin-pro", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500; font-size: 12px; letter-spacing: 3px;
    color: #6f7583; text-align: center; margin: 0;
  }

  /* -------------------------------------------------------- the fighter */

  .fighter { position: absolute; left: 1042px; top: 64px; width: 760px; height: 920px; }
</style>
</head>

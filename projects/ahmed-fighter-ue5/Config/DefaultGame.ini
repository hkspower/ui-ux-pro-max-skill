[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=AHMED - Kuwait Fighter
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDisplayedTitle", "AHMED — Kuwait Fighter")
CompanyName=Almuhallab Code
CompanyDistinguishedName=Almuhallab Code, Kuwait
Description=A 2.5D beat-'em-up. Fight your way across Kuwait.
ProjectVersion=1.0.0
Homepage=https://sporta.com.kw
LicensingTerms=
PrivacyPolicyURL=
bShouldWindowPreserveAspectRatio=True

; ---------------------------------------------------------------- balance
; Every number the game runs on ships in Content/Data, exported from the
; browser project by Tools/export/export.mjs. The subsystem below can pull a
; newer set at launch, which turns a store review into a thirty-second change
; -- but the game is complete without it and starts on the shipped tables
; whatever happens to the network.
;
; BalanceApiUrl is deliberately empty here. Point it at your own HTTPS
; endpoint and set bEnableRemoteBalance=True when you have one. Plain http://
; will be refused by iOS at runtime; see Config/IOS/IOSEngine.ini.
[/Script/AhmedFighter.AhmedConfigSubsystem]
bEnableRemoteBalance=False
BalanceApiUrl=
RequestTimeoutSeconds=6.0
MaxPayloadBytes=2097152
BakedAttackTable=/Game/Data/DT_Attacks.DT_Attacks
BakedFighterTable=/Game/Data/DT_Fighters.DT_Fighters
BakedStageTable=/Game/Data/DT_Stages.DT_Stages
BakedTalentTable=/Game/Data/DT_Talents.DT_Talents
BakedUpgradeTable=/Game/Data/DT_Upgrades.DT_Upgrades
BakedLevelTable=/Game/Data/DT_Levels.DT_Levels
BakedWeaponTable=/Game/Data/DT_Weapons.DT_Weapons

; The live link: a WebSocket to the same server's /v1/live. When the payload
; on the server changes, the game refetches it -- a retune in the browser
; project's panel reaches a running build in about a second. Off by default,
; like the balance fetch it drives. ws:// is refused by iOS; use wss://.
[/Script/AhmedFighter.AhmedLiveLinkSubsystem]
bEnableLiveLink=False
LiveLinkUrl=
ReconnectSeconds=2.0
ReconnectCapSeconds=60.0

; Save sync: the profile uploaded to and fetched from the same server's
; /v1/saves/{id}. Nothing happens unless Upload or Download is called. Set
; SaveToken to what the server was started with (SAVE_TOKEN); without one
; the server is a save anyone can overwrite, which is fine on a desk and
; nowhere else.
[/Script/AhmedFighter.AhmedSaveSyncSubsystem]
bEnableSaveSync=False
SaveApiUrl=
SaveToken=
RequestTimeoutSeconds=8.0

; ------------------------------------------------------------------ audio
; Every sound the game makes is a row in DT_Sounds, played by cue name; the
; files live in Content/Audio (see the README there). Bus volumes are what the
; settings screen moves; the profile's bSound / bMusic switches gate them.
[/Script/AhmedFighter.AhmedAudioSubsystem]
SoundTable=/Game/Data/DT_Sounds.DT_Sounds
EffectsVolume=1.0
InterfaceVolume=0.9
MusicVolume=0.8

; ------------------------------------------------------------- packaging
[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Shipping
FullRebuild=False
ForDistribution=False
UsePakFile=True
bCompressed=True
bUseIoStore=True
bShareMaterialShaderCode=True
; The data tables are cooked assets, but the raw exports are kept in the
; package too so a build can be diffed against the browser project without
; opening the editor.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Data")

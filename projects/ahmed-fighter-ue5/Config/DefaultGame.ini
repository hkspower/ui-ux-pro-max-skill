; ---------------------------------------------------------------- balance
; Every number the game runs on ships in Content/Data, exported from the
; browser project by Tools/export/export.mjs. The subsystem below can pull a
; newer set at launch, which turns a store review into a thirty-second change
; -- but the game is complete without it and starts on the shipped tables
; whatever happens to the network.
;
; BalanceApiUrl is deliberately empty here. Point it at your own HTTPS
; endpoint and set bEnableRemoteBalance=True when you have one. Plain http://
; will be refused by iOS at runtime; see Config/IOS/IOSEngine.ini.
[/Script/AhmedFighter.AhmedConfigSubsystem]
bEnableRemoteBalance=False
BalanceApiUrl=
RequestTimeoutSeconds=6.0
MaxPayloadBytes=2097152
BakedAttackTable=/Game/Data/DT_Attacks.DT_Attacks
BakedFighterTable=/Game/Data/DT_Fighters.DT_Fighters
BakedStageTable=/Game/Data/DT_Stages.DT_Stages
BakedTalentTable=/Game/Data/DT_Talents.DT_Talents
BakedUpgradeTable=/Game/Data/DT_Upgrades.DT_Upgrades
BakedLevelTable=/Game/Data/DT_Levels.DT_Levels
BakedWeaponTable=/Game/Data/DT_Weapons.DT_Weapons

; ------------------------------------------------------------- packaging
[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Shipping
FullRebuild=False
ForDistribution=False
UsePakFile=True
bCompressed=True
bUseIoStore=True
bShareMaterialShaderCode=True
; The data tables are cooked assets, but the raw exports are kept in the
; package too so a build can be diffed against the browser project without
; opening the editor.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Data")

; AHMED — Kuwait Fighter :: iOS
; =============================================================================
; Everything here is what the platform needs rather than what the game wants.
; The game's own settings live in ../DefaultEngine.ini and apply everywhere.
;
; Two things in this file will stop a build dead if they are wrong, so they are
; called out where they sit: the bundle identifier has to match the App ID in
; your Apple developer account exactly, and the signing certificate and mobile
; provision have to be for that same App ID. Everything else is tuning.
; =============================================================================

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]

; ---- identity ---------------------------------------------------------------
; Must match the App ID you registered at developer.apple.com. Change the
; reverse-domain part to yours before the first build; changing it later means
; a new App ID and a new provisioning profile.
BundleIdentifier=kw.com.sporta.ahmedfighter
BundleName=AHMED
BundleDisplayName=AHMED — Kuwait Fighter
VersionInfo=1.0.0
BuildNumber=1

; ---- what it runs on --------------------------------------------------------
; A beat-'em-up wants a big screen and a wide one. Portrait is disabled rather
; than merely deprioritised so the phone never rotates mid-fight.
bSupportsPortraitOrientation=False
bSupportsUpsideDownOrientation=False
bSupportsLandscapeLeftOrientation=True
bSupportsLandscapeRightOrientation=True
PreferredLandscapeOrientation=LandscapeLeft

; Metal only. iOS dropped OpenGL ES years ago and Unreal follows.
bSupportsMetal=True
bSupportsMetalMRT=False
; 15.0 is the floor Unreal 5.4 supports; raising it costs you devices, lowering
; it is not possible.
MinimumiOSVersion=IOS_15
bSupportsIPad=True
bSupportsIPhone=True

; ---- performance ------------------------------------------------------------
; A fighting game lives or dies on frame pacing, and 60 is the whole point.
; FrameRateLock caps it; bEnableDynamicMaxFPS lets ProMotion devices go higher
; where they can hold it.
FrameRateLock=PUFRL_60
bEnableDynamicMaxFPS=True
; Background audio off: this is not a game anyone plays with the screen locked.
bSupportsBackgroundAudio=False

; ---- networking -------------------------------------------------------------
; App Transport Security. iOS refuses plain HTTP from a shipped app, and the
; right answer is to put the balance API behind HTTPS rather than to punch a
; hole here. bDisableHTTPS stays False deliberately: turning it on is what
; gets a build rejected, and it would let anyone on the same wifi rewrite the
; game's balance in flight.
bDisableHTTPS=False

; If you genuinely need to test against a plain-HTTP server on your own
; machine, do it in a Development build by uncommenting the line below, and
; delete it again before you ship. It allows local addresses only.
;AdditionalPlistData=<key>NSAppTransportSecurity</key><dict><key>NSAllowsLocalNetworking</key><true/></dict>

; ---- packaging --------------------------------------------------------------
bGeneratedSYMFile=True
bGeneratedSYMBundle=True
bGenerateCrashReportSymbols=True
bTreatRemoteAsSeparateController=False
; On-device shader compilation is not a thing on iOS; shaders are cooked.
bUseRSync=False

[/Script/Engine.RendererSettings]
; Mobile deferred, which is what makes the lighting the browser build got
; possible here: real shadows and a proper post chain instead of a forward
; renderer's approximations. It costs bandwidth, which is why the settings
; below give some of it back.
r.Mobile.ShadingPath=1
r.MobileHDR=True
r.Mobile.AllowDeferredShadingOpenGL=0
r.Mobile.SupportGPUScene=1
r.Mobile.EnableStaticAndCSMShadowReceivers=1
r.Mobile.EnableMovableLightCSMShaderCulling=1
r.Mobile.AllowDistanceFieldShadows=1
r.Mobile.AmbientOcclusion=1
r.Mobile.FloatPrecisionMode=1

; The post chain, matched to what the browser build settled on: bloom and a
; film curve on, motion blur off because it reads as lag in a fighting game,
; auto-exposure off because the stages are lit deliberately and letting the
; camera re-expose them undoes that.
r.DefaultFeature.Bloom=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AntiAliasing=2
r.MobileMSAA=1
r.Mobile.AntiAliasing=3

[/Script/Engine.PhysicsSettings]
bSubstepping=True
MaxSubstepDeltaTime=0.008333
MaxSubsteps=4

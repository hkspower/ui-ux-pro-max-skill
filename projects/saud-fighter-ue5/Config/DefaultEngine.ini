[/Script/EngineSettings.GameMapsSettings]
; The game now opens on L_Prologue -- Saud's life before he fell -- rather
; than on the souq. ASaudPrologueGameMode (set as that level's own Game Mode
; Override, not here) sends anyone who has already seen it straight into
; L_AlHalqa_World -- the open world, the only map the game plays on since
; 2026-09-23 -- so this only ever plays once per profile.
GameDefaultMap=/Game/Maps/L_Prologue.L_Prologue
EditorStartupMap=/Game/Maps/L_Prologue.L_Prologue
GlobalDefaultGameMode=/Script/SaudFighter.SaudGameMode
GameInstanceClass=/Script/SaudFighter.SaudGameInstance

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/SaudFighter")

[/Script/Engine.RendererSettings]
r.Mobile.ShadingPath=0
r.MobileHDR=False
r.DefaultFeature.Bloom=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AutoExposure=False
; Every light in this game is dynamic: the level builders spawn them by
; script and nothing ever bakes a lightmap, and the night's fires are
; Movable so the game can switch their shadows (USaudLightSubsystem). No
; static-lighting shader permutations, no "lighting needs rebuilding", no
; stationary light losing its shadow to the four-overlap limit (2026-10-03).
r.AllowStaticLighting=False

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-1400.000000

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bEnableMouseSmoothing=False

; The bindings are made in C++ -- since 2026-09-30 -- by USaudInputBindings
; (Source/SaudFighter/Game/SaudInputBindings.h), a game-instance subsystem
; that builds both Enhanced Input mapping contexts and every action at
; start-up from the one table in Source/SaudFighter/Combat/SaudControls.h
; (PadBindings, KeyBindings, UEKeyName). There are no input assets to make
; or assign; a Blueprint that sets ASaudCharacter's action pointers anyway
; still wins over the built ones.
;
;   fight    Move          left stick             W A S D, arrows
;            Look          right stick            mouse
;            Punch         X / Square             J
;            Kick          A / Cross              K
;            Block/parry   RB or LB (R1 / L1)     L      (tap while moving = dash)
;            Dash          B / Circle             Shift
;            Rage          Y / Triangle           Space, U
;            Pause         Menu / Options         Esc, P
;   menu     Navigate      d-pad, left stick      arrows, W S
;            Confirm       A / Cross              Enter, Space
;            Back          B / Circle             Esc, Backspace
;            Flip the pad  LB / RB (L1 / R1)      Q, E, Tab
;            Resume        Menu / Options         Esc, P
;
; The fight context is added by USaudMenuSubsystem when a fight starts and
; swapped for the menu context, at a higher priority, while a menu is open.
;
; DefaultViewportMouseCaptureMode stays: the game is played on a gamepad
; and a keyboard (see ../CLAUDE.md, "Input is a gamepad and a keyboard"),
; the menus are pad and keyboard only, and no menu shows a cursor -- the
; mouse is the camera's and nothing else's, so it stays captured.

[/Script/Engine.InputSettings]
bAltEnterTogglesFullscreen=True
bUseMouseForTouch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
